<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fumola — web REPL</title>
    <meta name="description" content="Write Fumola in the browser, with the library beside you. Highlighted by the language's own lexer.">
    <style>
      /* The palette is the Fumola VS Code theme's, the same one the homepage
         uses, and the token kinds below map onto its scopes. */
      :root {
        --bg:     #000000;
        --panel:  #0b0b0d;
        --rule:   #212124;
        --fg:     #d4d4d4;
        --dim:    #7d7d82;

        --green:  #6A9955;
        --blue:   #569CD6;
        --pink:   #C586C0;
        --type:   #a989d0;
        --sym:    #a086a5;
        --op:     #9999dd;
        --eff:    #ffaaaa;
        --str:    #c87e60;
        --var:    #f6ead2;

        --ui:   system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                "Liberation Mono", "DejaVu Sans Mono", monospace;
      }

      * { box-sizing: border-box; }
      /* One knob, as on the homepage: everything below is in rem, so the
         whole app grows on a large screen instead of sitting small. The floor
         is a little above the homepage's, because this is a working surface
         rather than prose and was too small to read at no zoom. */
      html {
        height: 100%;
        font-size: clamp(17px, 12px + 0.55vw, 23px);
      }
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 400 0.95rem/1.5 var(--ui);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;           /* each pane scrolls on its own */
      }
      a { color: var(--blue); text-decoration: none; }
      a:hover { color: #7db6e8; }

      /* ---- frame ------------------------------------------------------- */

      .shell { display: flex; flex-direction: column; height: 100%; }

      .bar {
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.55rem 0.9rem;
        border-bottom: 1px solid var(--rule);
        font: 400 0.8rem/1 var(--mono);
        color: var(--dim);
        flex: 0 0 auto;
      }
      .bar .here { color: var(--var); }
      .bar .spacer { flex: 1; }
      .bar label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
      .bar input { accent-color: var(--blue); margin: 0; }
      #status { color: var(--dim); }

      .panes { flex: 1; display: flex; min-height: 0; }

      /* The pane width lives in a variable so the drag handle and the snap
         buttons are setting the same thing. */
      .shell { --lib-w: 26rem; }

      /* ---- the library, on the left ------------------------------------ */

      .library {
        /* Only this pane's text. The editor is deliberately larger and is
           left alone by the controls in the header. */
        --lib-font: 0.84rem;
        flex: 0 0 var(--lib-w);
        display: flex; flex-direction: column;
        border-right: 1px solid var(--rule);
        /* Both needed. A flex item's min-width defaults to its content, and
           the source below is a <pre> with long lines, so without this the
           pane refuses to shrink to its basis and squeezes the editor out. */
        min-width: 0; min-height: 0;
        background: var(--panel);
      }
      .lib-head {
        display: flex; align-items: center; gap: 0.5rem;
        padding: 0.5rem 0.7rem;
        font: 400 0.72rem/1 var(--mono);
        letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--dim);
        border-bottom: 1px solid var(--rule);
        flex: 0 0 auto;
      }
      .lib-head .snaps { margin-left: auto; display: flex; gap: 0.3rem; }
      .lib-head button {
        background: none; border: 1px solid var(--rule); border-radius: 2px;
        color: var(--dim); cursor: pointer;
        font: 400 0.68rem/1 var(--mono);
        letter-spacing: 0.06em; text-transform: none;
        padding: 0.25rem 0.45rem;
      }
      .lib-head button:hover { color: var(--var); border-color: #3a3a40; }

      /* The drag handle. Wider than it looks, so it is easy to grab. */
      .grip {
        flex: 0 0 7px;
        margin: 0 -3px;              /* overlap the border, keep the layout */
        cursor: col-resize;
        background: transparent;
        position: relative; z-index: 2;
      }
      .grip:hover, .grip.dragging { background: #2b3f52; }
      body.dragging { cursor: col-resize; user-select: none; }
      /* While dragging, the textarea must not swallow the pointer. */
      body.dragging .editor > textarea { pointer-events: none; }

      /* When the library is shut, a thin way back. */
      .reopen {
        flex: 0 0 auto;
        writing-mode: vertical-rl;
        background: var(--panel); border: 0; border-right: 1px solid var(--rule);
        color: var(--dim); cursor: pointer;
        font: 400 0.7rem/1 var(--mono);
        letter-spacing: 0.1em; padding: 0.8rem 0.35rem;
      }
      .reopen:hover { color: var(--var); }
      /* With nothing open the outline has the pane to itself. Once a module
         is showing it takes half, and it can be shut entirely -- reading a
         file is the common case, and the outline is only in the way then. */
      #modules {
        list-style: none; margin: 0; padding: 0.35rem 0;
        overflow-y: auto;
        flex: 1 1 auto; min-height: 0;
        border-bottom: 1px solid var(--rule);
      }
      .library.has-source #modules { flex: 0 0 50%; }
      .library[data-outline="closed"] #modules { display: none; }

      .outline-toggle::before {
        content: "\25be";           /* a caret, turned when shut */
        display: inline-block;
        margin-right: 0.35rem;
        transition: transform 0.12s;
      }
      .library[data-outline="closed"] .outline-toggle::before {
        transform: rotate(-90deg);
      }
      .current {
        font: 400 0.72rem/1 var(--mono);
        color: var(--sym);
        text-transform: none; letter-spacing: 0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      #modules ul { list-style: none; margin: 0; padding: 0; }
      #modules .dir {
        padding: 0.24rem 0.9rem;
        font: 400 var(--lib-font)/1.5 var(--mono);
        color: var(--sym);
      }
      #modules button {
        display: block; width: 100%; text-align: left;
        background: none; border: 0; cursor: pointer;
        padding: 0.24rem 0.9rem;
        font: 400 var(--lib-font)/1.5 var(--mono);
        color: var(--dim);
      }
      #modules button:hover { color: var(--var); }
      #modules button[aria-current="true"] { color: var(--blue); }

      .source { flex: 1; min-width: 0; min-height: 0; overflow: auto; }
      .source pre {
        margin: 0; padding: 0.9rem;
        font: 400 var(--lib-font)/1.6 var(--mono);
        white-space: pre; color: var(--fg);
      }
      .source .empty { padding: 0.9rem; color: var(--dim); font: italic 0.85rem/1.5 var(--ui); }

      /* ---- the editor, on the right ------------------------------------ */

      .work { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

      .editor { position: relative; flex: 1; min-height: 0; }
      /* The highlighted layer and the textarea are stacked and must agree on
         every metric, or the coloured text drifts away from the caret. */
      .editor > pre,
      .editor > textarea {
        position: absolute; inset: 0;
        margin: 0; padding: 1rem;
        border: 0;
        font: 400 0.92rem/1.65 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
        overflow: auto;
        tab-size: 2;
      }
      .editor > pre { pointer-events: none; color: var(--fg); background: var(--bg); }
      .editor > textarea {
        color: transparent;
        background: transparent;
        caret-color: var(--var);
        resize: none; outline: none;
      }
      .editor > textarea::selection { background: #2a3f55; color: transparent; }

      .out {
        flex: 0 0 auto;
        max-height: 40%;
        overflow: auto;
        border-top: 1px solid var(--rule);
        padding: 0.8rem 1rem;
        font: 400 0.9rem/1.6 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--panel);
        min-height: 3.2rem;
      }
      .out .tag { color: var(--type); }
      .out .err { color: var(--eff); }
      .out .waiting { color: var(--dim); font-style: italic; }
      .out.stale { opacity: 0.45; }

      /* ---- token colours, from the theme -------------------------------- */

      .c   { color: var(--green); font-style: italic; }
      .k   { color: var(--blue);  font-weight: 600; }
      .t   { color: var(--type);  font-weight: 600; }
      .sy  { color: var(--sym);   font-weight: 600; }
      .o   { color: var(--op); }
      .eff { color: var(--eff); }
      .st  { color: var(--str); }
      .v   { color: var(--var); }

      @media (max-width: 52rem) {
        .panes { flex-direction: column; }
        .library { flex: 0 0 40%; border-right: 0; border-bottom: 1px solid var(--rule); }
        #modules { max-height: 45%; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <a class="home" href="/">fumola</a>
        <span>/</span>
        <span class="here">web repl</span>
        <span class="spacer"></span>
        <label title="Keep the adapton store between runs, so an edit repairs what the last one built. Off, each run starts from a clean store.">
          <input type="checkbox" id="persist" checked> keep state between runs
        </label>
        <span id="status">starting the runtime…</span>
      </header>

      <div class="panes">
        <aside class="library">
          <div class="lib-head">
            <button type="button" id="outline-toggle" class="outline-toggle"
                    aria-expanded="true" title="Show or hide the outline">
              outline
            </button>
            <span class="current" id="current"></span>
            <span class="snaps">
              <button type="button" id="lib-smaller" title="Smaller library text">A&minus;</button>
              <button type="button" id="lib-bigger"  title="Larger library text">A+</button>
              <button type="button" data-snap="full"  title="Fill the window">full</button>
              <button type="button" data-snap="half"  title="Half the window">half</button>
              <button type="button" data-snap="close" title="Hide the library">hide</button>
            </span>
          </div>
          <ul id="modules"></ul>
          <div class="source" id="source">
            <div class="empty">Pick a module to read its source.</div>
          </div>
        </aside>
        <div class="grip" id="grip" role="separator" aria-orientation="vertical"
             aria-label="Resize the library"></div>
        <button class="reopen" id="reopen" hidden>the library</button>

        <section class="work">
          <div class="editor">
            <pre aria-hidden="true"><code id="hl"></code></pre>
            <textarea id="src" spellcheck="false" autocapitalize="off"
              autocorrect="off" aria-label="Fumola program"></textarea>
          </div>
          <div class="out" id="out"></div>
        </section>
      </div>
    </div>

    <script type="module">
      import init, {
        fumola_create,
        fumola_ensure_mode,
        fumola_eval_top,
        fumola_tokens,
        fumola_modules,
        fumola_module_source,
      } from "../fumola_wasm.js";

      const $ = (id) => document.getElementById(id);
      const srcEl = $("src"), hlEl = $("hl"), outEl = $("out"),
            statusEl = $("status"), persistEl = $("persist");

      const START = "`n := 21;\nforce(`double := thunk { get(`n) * 2 })";

      // ---- highlighting -------------------------------------------------
      // The kinds come from the language's own lexer, so there is no grammar
      // here to fall out of step with it.
      const CLASS = {
        comment: "c", keyword: "k", type: "t", symbol: "sy",
        effect: "eff", operator: "o", literal: "st", ident: "v",
      };
      const esc = (s) =>
        s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

      const highlight = (text) => {
        let reply;
        try { reply = JSON.parse(fumola_tokens(text)); } catch (e) { return esc(text); }
        if (!reply.ok) return esc(text);
        let html = "", at = 0;
        for (const t of reply.tokens) {
          if (t.start > at) html += esc(text.slice(at, t.start));
          const body = esc(text.slice(t.start, t.start + t.len));
          const cls = CLASS[t.kind];
          html += cls ? `<span class="${cls}">${body}</span>` : body;
          at = t.start + t.len;
        }
        if (at < text.length) html += esc(text.slice(at));
        // A <pre> swallows one trailing newline; without this the last line
        // of the highlight sits one line above the caret.
        return html + "\n";
      };

      const paint = () => {
        if (!ready) { hlEl.textContent = srcEl.value; return; }
        hlEl.innerHTML = highlight(srcEl.value);
      };

      // ---- the runtime, fetched on first use ----------------------------
      let ready = false, instance = null, starting = null;
      const ensureRuntime = () => {
        if (starting) return starting;
        statusEl.textContent = "starting the runtime…";
        starting = init()
          .then(() => {
            instance = fumola_create();
            fumola_ensure_mode(instance, "graphical");
            ready = true;
            listModules();
            paint();          // the first paint was plain: the lexer is here now
            note();
            evaluate();       // show the starter program's answer straight away
          })
          .catch((e) => {
            statusEl.textContent = "the runtime could not be loaded";
            starting = null;
            throw e;
          });
        return starting;
      };
      const note = () => {
        statusEl.textContent = persistEl.checked
          ? `instance ${instance} · graphical · state kept`
          : `instance ${instance} · graphical · clean store each run`;
      };

      // ---- the library --------------------------------------------------
      const listModules = () => {
        const reply = JSON.parse(fumola_modules());
        if (!reply.ok) return;

        // Group by path segment, so shared prefixes become shared parents.
        // The `fumola/` prefix is on every module, so it is only noise.
        const root = { dirs: new Map(), files: [] };
        for (const m of reply.modules) {
          // Skip the symlinked copies. They exist so that a module's
          // neighbours are importable without "../.." in the path, not
          // because the file lives there, and listing them shows the same
          // module up to three times. See Adapton/fumola for the underlying
          // import-path limitation.
          if (m.link) continue;
          const path = m.path;
          const parts = path.replace(/^fumola\//, "").split("/");
          let node = root;
          for (const dir of parts.slice(0, -1)) {
            if (!node.dirs.has(dir)) node.dirs.set(dir, { dirs: new Map(), files: [] });
            node = node.dirs.get(dir);
          }
          node.files.push({ name: parts[parts.length - 1], path });
        }

        const list = $("modules");
        list.textContent = "";
        renderTree(root, list, 0);
      };

      // Fully expanded: the library is small enough to take in at a glance,
      // and a fold would only hide it.
      const renderTree = (node, into, depth) => {
        const indent = (el) => {
          el.style.paddingLeft = 0.9 + depth * 0.9 + "rem";
        };
        const byName = (a, b) => String(a).localeCompare(String(b));

        for (const name of [...node.dirs.keys()].sort(byName)) {
          const li = document.createElement("li");
          const label = document.createElement("div");
          label.className = "dir";
          label.textContent = name + "/";
          indent(label);
          li.appendChild(label);
          const sub = document.createElement("ul");
          renderTree(node.dirs.get(name), sub, depth + 1);
          li.appendChild(sub);
          into.appendChild(li);
        }
        for (const f of node.files.sort((a, b) => byName(a.name, b.name))) {
          const li = document.createElement("li");
          const b = document.createElement("button");
          b.textContent = f.name;
          b.title = f.path;         // the full path an `import` would use
          indent(b);
          b.addEventListener("click", () => showModule(f.path, b));
          li.appendChild(b);
          into.appendChild(li);
        }
      };

      const setOutline = (open) => {
        libEl.dataset.outline = open ? "open" : "closed";
        $("outline-toggle").setAttribute("aria-expanded", String(open));
      };

      const showModule = (path, button) => {
        for (const b of document.querySelectorAll("#modules button"))
          b.removeAttribute("aria-current");
        button.setAttribute("aria-current", "true");
        libEl.classList.add("has-source");
        $("current").textContent = path.replace(/^fumola\//, "");
        // Picking a file is the end of navigating, so the outline gets out of
        // the way. The toggle brings it back at half.
        setOutline(false);
        const reply = JSON.parse(fumola_module_source(path));
        const pane = $("source");
        pane.textContent = "";
        if (!reply.ok) {
          pane.innerHTML = '<div class="empty"></div>';
          pane.firstChild.textContent = reply.error;
          return;
        }
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        code.innerHTML = highlight(reply.source);
        pre.appendChild(code);
        pane.appendChild(pre);
        pane.scrollTop = 0;
      };

      // ---- evaluation ---------------------------------------------------
      const show = (v) => {
        if (v === null || v === undefined) return "?";
        switch (v.tag) {
          case "Unit": return "()";
          case "Null": return "null";
          case "Option": return "?(" + show(v.value) + ")";
          case "String": return v.value;
          case "Symbol": return symbolSource(v.value);
          case "List": return "[" + v.value.map(show).join(", ") + "]";
          case "Tuple": return "(" + v.value.map(show).join(", ") + ")";
          case "Record":
            return "{" + Object.entries(v.value)
              .map(([k, f]) => k + " = " + show(f)).join("; ") + "}";
          case "Variant":
            return "#" + v.value.name +
              (v.value.value === null ? "" : "(" + show(v.value.value) + ")");
          case "AdaptonPointer": return "pointer(" + v.value.source + ")";
          case "Pointer": return JSON.stringify(v.value);
          default: return String(v.value);
        }
      };
      const symbolSource = (s) => {
        if (s === null || typeof s !== "object") return String(s);
        switch (s.tag) {
          case "Num": return String(s.value);
          case "Name": return "`" + s.value;
          case "Call": return symbolSource(s.fun) + "(" + symbolSource(s.arg) + ")";
          case "Dot": return symbolSource(s.left) + "." + symbolSource(s.right);
          default: return JSON.stringify(s);
        }
      };

      let timer = null;
      const evaluate = async () => {
        try { await ensureRuntime(); } catch (e) { return; }
        const text = srcEl.value;
        if (!text.trim()) { outEl.textContent = ""; outEl.classList.remove("stale"); return; }

        // A clean store is cheaper to ask for than a fresh instance: making
        // one rebuilds the whole module library.
        if (!persistEl.checked) fumola_eval_top(instance, 'prim "adaptonReset" (#graphical)');

        let reply;
        try {
          reply = JSON.parse(fumola_eval_top(instance, text));
        } catch (e) {
          return;
        }
        if (reply.ok) {
          outEl.classList.remove("stale");
          outEl.textContent = "";
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = reply.tag + "  ";
          outEl.append(tag, show(reply));
          return;
        }
        // Half-typed programs are syntax errors most of the time, and
        // flashing red on every keystroke is worse than useless. The last
        // good answer stays, dimmed, until this one parses.
        if (reply.kind === "syntax") {
          outEl.classList.add("stale");
          return;
        }
        outEl.classList.remove("stale");
        outEl.textContent = "";
        const err = document.createElement("span");
        err.className = "err";
        err.textContent = reply.error;
        outEl.append(err);
      };

      const schedule = () => {
        clearTimeout(timer);
        timer = setTimeout(evaluate, 300);
      };

      srcEl.addEventListener("input", () => { paint(); schedule(); });
      srcEl.addEventListener("scroll", () => {
        const pre = hlEl.parentElement;
        pre.scrollTop = srcEl.scrollTop;
        pre.scrollLeft = srcEl.scrollLeft;
      });
      persistEl.addEventListener("change", () => { note(); evaluate(); });

      // ---- the library's own text size, independent of the editor --------
      const LIB_STEPS = ["0.62rem", "0.7rem", "0.78rem", "0.84rem",
                         "0.92rem", "1rem", "1.12rem", "1.25rem"];
      const LIB_FONT_KEY = "fumola.web-repl.libFont";
      let libStep = 3;
      const applyLibFont = () => {
        document.querySelector(".library")
          .style.setProperty("--lib-font", LIB_STEPS[libStep]);
        try { localStorage.setItem(LIB_FONT_KEY, String(libStep)); } catch (e) {}
      };
      const stepLibFont = (by) => {
        libStep = Math.max(0, Math.min(LIB_STEPS.length - 1, libStep + by));
        applyLibFont();
      };
      try {
        const saved = localStorage.getItem(LIB_FONT_KEY);
        if (saved !== null) libStep = Math.max(0, Math.min(LIB_STEPS.length - 1, Number(saved)));
      } catch (e) {}

      // ---- the library pane: drag to size, or snap -----------------------
      const shell = document.querySelector(".shell");
      const libEl = document.querySelector(".library");
      const gripEl = $("grip");
      const reopenEl = $("reopen");
      const REMEMBER = "fumola.web-repl.libWidth";

      const setWidth = (px) => {
        const max = window.innerWidth;
        // Snapped shut, or dragged so far it may as well be: show the spine
        // instead of a sliver nobody can read.
        const w = Math.max(0, Math.min(px, max));
        const shut = w < 40;
        shell.style.setProperty("--lib-w", shut ? "0px" : w + "px");
        libEl.hidden = shut;
        gripEl.hidden = shut;
        reopenEl.hidden = !shut;
        try { localStorage.setItem(REMEMBER, String(shut ? 0 : w)); } catch (e) {}
      };

      for (const b of document.querySelectorAll("[data-snap]")) {
        b.addEventListener("click", () => {
          const to = b.dataset.snap;
          setWidth(to === "full" ? window.innerWidth
                 : to === "half" ? Math.round(window.innerWidth / 2)
                 : 0);
        });
      }
      reopenEl.addEventListener("click", () =>
        setWidth(Math.round(window.innerWidth / 2)));

      gripEl.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        gripEl.setPointerCapture(e.pointerId);
        gripEl.classList.add("dragging");
        document.body.classList.add("dragging");
        const move = (ev) => setWidth(ev.clientX - libEl.getBoundingClientRect().left);
        const up = () => {
          gripEl.classList.remove("dragging");
          document.body.classList.remove("dragging");
          gripEl.removeEventListener("pointermove", move);
          gripEl.removeEventListener("pointerup", up);
        };
        gripEl.addEventListener("pointermove", move);
        gripEl.addEventListener("pointerup", up);
      });

      // Restore the last width, if this browser remembers one.
      try {
        const saved = localStorage.getItem(REMEMBER);
        if (saved !== null) setWidth(Number(saved));
      } catch (e) {}

      $("lib-smaller").addEventListener("click", () => stepLibFont(-1));
      $("lib-bigger").addEventListener("click", () => stepLibFont(+1));
      applyLibFont();

      $("outline-toggle").addEventListener("click", () =>
        setOutline(libEl.dataset.outline === "closed"));

      srcEl.value = START;
      paint();
      outEl.innerHTML = '<span class="waiting">starting…</span>';

      // Fetched immediately, unlike the console on the homepage. There, most
      // readers never run anything and the 5 MB is worth deferring; here,
      // opening the page is the request -- and the library list and the
      // highlighting both come out of the runtime, so deferring it left the
      // page looking broken until the first keystroke.
      ensureRuntime().catch(() => {});
    </script>
  </body>
</html>
