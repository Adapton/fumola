<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fumola — web play</title>
    <meta name="description" content="Write Fumola in the browser, with the library beside you. Highlighted by the language's own lexer.">
    <style>
      /* The palette is the Fumola VS Code theme's, the same one the homepage
         uses, and the token kinds below map onto its scopes. */
      :root {
        --bg:     #000000;
        --panel:  #0b0b0d;
        --rule:   #212124;
        --fg:     #d4d4d4;
        --dim:    #7d7d82;

        --green:  #6A9955;
        --blue:   #569CD6;
        --pink:   #C586C0;
        --type:   #a989d0;
        --sym:    #a086a5;
        --op:     #9999dd;
        --eff:    #ffaaaa;
        --str:    #c87e60;
        --var:    #f6ead2;

        --ui:   system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                "Liberation Mono", "DejaVu Sans Mono", monospace;
      }

      * { box-sizing: border-box; }
      /* One knob, as on the homepage: everything below is in rem, so the
         whole app grows on a large screen instead of sitting small. The floor
         is a little above the homepage's, because this is a working surface
         rather than prose and was too small to read at no zoom. */
      html {
        height: 100%;
        font-size: clamp(17px, 12px + 0.55vw, 23px);
      }
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 400 0.95rem/1.5 var(--ui);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;           /* each pane scrolls on its own */
      }
      a { color: var(--blue); text-decoration: none; }
      a:hover { color: #7db6e8; }

      /* ---- frame ------------------------------------------------------- */

      .shell { display: flex; flex-direction: column; height: 100%; }

      .bar {
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.55rem 0.9rem;
        border-bottom: 1px solid var(--rule);
        font: 400 0.8rem/1 var(--mono);
        color: var(--dim);
        flex: 0 0 auto;
      }
      .bar .here { color: var(--var); }
      .bar .spacer { flex: 1; }
      .bar label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
      .bar input { accent-color: var(--blue); margin: 0; }
      #status { color: var(--dim); }

      .panes { flex: 1; display: flex; min-height: 0; }

      /* The pane width lives in a variable so the drag handle and the snap
         buttons are setting the same thing. */
      .shell { --lib-w: 26rem; }

      /* ---- the library, on the left ------------------------------------ */

      .library {
        /* Only this pane's text. The editor is deliberately larger and is
           left alone by the controls in the header. */
        --lib-font: 0.84rem;
        flex: 0 0 var(--lib-w);
        display: flex; flex-direction: column;
        border-right: 1px solid var(--rule);
        /* Both needed. A flex item's min-width defaults to its content, and
           the source below is a <pre> with long lines, so without this the
           pane refuses to shrink to its basis and squeezes the editor out. */
        min-width: 0; min-height: 0;
        background: var(--panel);
      }
      .lib-head {
        display: flex; align-items: center; gap: 0.5rem;
        padding: 0.5rem 0.7rem;
        font: 400 0.72rem/1 var(--mono);
        letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--dim);
        border-bottom: 1px solid var(--rule);
        flex: 0 0 auto;
      }
      .lib-head .snaps { margin-left: auto; display: flex; gap: 0.3rem; }
      .lib-head button {
        background: none; border: 1px solid var(--rule); border-radius: 2px;
        color: var(--dim); cursor: pointer;
        font: 400 0.68rem/1 var(--mono);
        letter-spacing: 0.06em; text-transform: none;
        padding: 0.25rem 0.45rem;
      }
      .lib-head button:hover { color: var(--var); border-color: #3a3a40; }

      /* The drag handle. Wider than it looks, so it is easy to grab. */
      .grip {
        flex: 0 0 7px;
        margin: 0 -3px;              /* overlap the border, keep the layout */
        cursor: col-resize;
        background: transparent;
        position: relative; z-index: 2;
      }
      .grip:hover, .grip.dragging { background: #2b3f52; }
      body.dragging { cursor: col-resize; user-select: none; }
      /* While dragging, the textarea must not swallow the pointer. */
      body.dragging .editor > textarea { pointer-events: none; }

      /* When the library is shut, a thin way back. */
      .reopen {
        flex: 0 0 auto;
        writing-mode: vertical-rl;
        background: var(--panel); border: 0; border-right: 1px solid var(--rule);
        color: var(--dim); cursor: pointer;
        font: 400 0.7rem/1 var(--mono);
        letter-spacing: 0.1em; padding: 0.8rem 0.35rem;
      }
      .reopen:hover { color: var(--var); }
      /* With nothing open the outline has the pane to itself. Once a module
         is showing it takes half, and it can be shut entirely -- reading a
         file is the common case, and the outline is only in the way then. */
      #modules {
        list-style: none; margin: 0; padding: 0.35rem 0;
        overflow-y: auto;
        flex: 1 1 auto; min-height: 0;
        border-bottom: 1px solid var(--rule);
      }
      .library.has-source #modules { flex: 0 0 var(--outline-h, 50%); }
      /* Drag this to give either the outline or the source the whole pane. */
      .hgrip {
        flex: 0 0 7px; margin: -3px 0;
        cursor: row-resize; background: transparent;
        position: relative; z-index: 2;
      }
      .hgrip:hover, .hgrip.dragging { background: #2b3f52; }
      .library:not(.has-source) .hgrip,
      .library[data-outline="closed"] .hgrip,
      .library:not([data-view="library"]) .hgrip { display: none; }
      body.dragging-v { cursor: row-resize; user-select: none; }
      .library[data-outline="closed"] #modules { display: none; }

      .views { display: flex; gap: 0.25rem; }
      .view-tab[aria-current="true"] { color: var(--var); border-color: #3a3a40; }
      /* Lit while the panel has something in it, so a program that prints
         says so even when the outline is the view in front. */
      .view-tab.has-output { color: var(--green); border-color: #3a4a3a; }
      .view-tab.has-output::after { content: " \2022"; }

      /* One view at a time. Any view but the library hides the library's
         own parts, and a panel shows only under the view that names it. */
      .library:not([data-view="library"]) #modules,
      .library:not([data-view="library"]) .source,
      .library:not([data-view="library"]) .lib-path,
      .library:not([data-view="library"]) .outline-toggle { display: none; }
      .events, .print, .scene { display: none; }
      .library[data-view="events"] .events,
      .library[data-view="print"] .print,
      .library[data-view="objects"] #objects-panel,
      .library[data-view="outline"] #outline-panel { display: block; }

      /* The outline, styled as the replayground styles it: each level a
         step in and a rule down its left, so nesting is visible as nesting. */
      .outline-node {
        margin-left: 8px; padding-left: 2px;
        border-left: 2px solid #2a2e37;
        background: #0d0d11;
      }
      .outline-edge { margin-left: 8px; background: #101014; }
      .outline-edge:hover, .outline-node:hover { background: #16161c; }
      .outline-internal-result {
        margin-left: 8px; border-left: 2px solid #2a2e37; background: #0d0d11;
      }
      #outline-body .nodeId { color: var(--sym); }
      #outline-body .metaTime { color: var(--dim); }
      #outline-body .outline-value-text { color: var(--fg); }
      #outline-body .action-arrow { color: var(--op); }
      #outline-body .action-put, #outline-body .action-putForce { color: var(--green); }
      #outline-body .action-get { color: var(--blue); }
      #outline-body .result-arrow { color: var(--pink); }
      /* Between the trees of a forest, so several read as several. */
      .forest-rule {
        margin: 0.7rem 0 0.2rem;
        padding-top: 0.4rem;
        border-top: 1px solid var(--rule);
        font: 400 0.72rem/1.4 var(--mono);
        letter-spacing: 0.06em;
        color: var(--dim);
      }

      /* The objects, drawn. Fills the panel; the canvas is sized to it. */
      #objects-panel { display: none; }
      .library[data-view="objects"] #objects-panel { display: flex; flex-direction: column; }
      .viewport { flex: 1; min-height: 0; position: relative; background: #08080b; }
      .viewport canvas { display: block; }
      .viewport .hint {
        position: absolute; left: 0.7rem; bottom: 0.6rem;
        font: 400 0.7rem/1.4 var(--mono); color: var(--dim);
        pointer-events: none;
      }

      /* The two scene panels: what a program said about how to look at it. */
      .scene { flex: 1; min-height: 0; overflow: auto; }
      .scene-body {
        margin: 0; padding: 0.7rem 0.9rem;
        font: 400 var(--lib-font)/1.6 var(--mono);
        white-space: pre-wrap; word-break: break-word; color: var(--fg);
      }
      /* An empty panel says what would fill it, in the language's own terms. */
      .schema {
        margin: 0.6rem 0 0; padding: 0.7rem 0.9rem;
        font: 400 var(--lib-font)/1.6 var(--mono);
        white-space: pre-wrap; color: var(--fg);
        background: var(--panel); border: 1px solid var(--rule); border-radius: 2px;
      }

      .print { flex: 1; min-height: 0; overflow: auto; }
      .print ol {
        margin: 0; padding: 0.4rem 0.6rem 0.4rem 3.2rem; list-style: decimal;
      }
      .print li {
        font: 400 var(--lib-font)/1.5 var(--mono);
        color: var(--fg); padding: 0.1rem 0; white-space: pre-wrap;
        word-break: break-word; tab-size: 4;
      }
      .print li::marker { color: var(--dim); font-size: 0.85em; }
      /* Each run is a block, so a program that printed twice reads as two
         runs rather than one long list. */
      .print li.run-start { border-top: 1px solid var(--rule); margin-top: 0.35rem;
        padding-top: 0.45rem; }

      .events { flex: 1; min-height: 0; overflow: auto; }
      .events table { width: 100%; border-collapse: collapse; }
      .events td {
        font: 400 var(--lib-font)/1.5 var(--mono);
        padding: 0.15rem 0.5rem;
        vertical-align: baseline;
      }
      /* One band per meta-time, alternating -- so a group of events that
         happened at the same moment reads as one block. */
      .events tr.band0 td { background: #0d0d11; }
      .events tr.band1 td { background: #16161c; }
      .events td.mt {
        text-align: right; color: var(--dim);
        width: 3.5em; white-space: nowrap;
        border-right: 1px solid var(--rule);
      }
      .events td.ev { white-space: pre-wrap; word-break: break-word; }

      .outline-toggle::before {
        content: "\25be";           /* a caret, turned when shut */
        display: inline-block;
        margin-right: 0.35rem;
        transition: transform 0.12s;
      }
      .library[data-outline="closed"] .outline-toggle::before {
        transform: rotate(-90deg);
      }
      /* A line of its own. Three view tabs, the outline toggle and six
         sizing buttons already fill the row above, and a path is the one
         thing there that has no fixed width -- squeezed in beside them it
         was the first thing to be cut to an ellipsis. */
      .lib-path {
        padding: 0.4rem 0.7rem;
        border-bottom: 1px solid var(--rule);
        flex: 0 0 auto;
        min-width: 0;
      }
      /* Only once a file is open; there is nothing to name before that, and
         an empty strip would just be a second border. */
      .library:not(.has-source) .lib-path,

      .current {
        display: block;
        font: 400 0.78rem/1.2 var(--mono);
        color: var(--sym);
        text-transform: none; letter-spacing: 0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        direction: rtl; text-align: left;      /* keep the filename when it clips */
      }
      #modules ul { list-style: none; margin: 0; padding: 0; }
      /* The tests are a second library, and the one you come here to use, so
         they are set off from the modules and sized up a step. The tinted
         ground is the same idea as the two-tone event rows: it says "this
         part is different" without a heading to explain it. */
      #modules .tests-root,
      #modules .examples-root {
        border-top: 1px solid var(--rule);
        margin-top: 0.5rem;
        padding-top: 0.35rem;
        background: #101017;
      }
      /* A tone of its own, so three sections read as three. */
      #modules .examples-root { background: #0e1414; }
      #modules .examples-root > .dir { color: var(--blue); }
      /* Only the heading is larger. The tree under it matches the modules
         above, so the two read as the same kind of thing; the tone is what
         separates them. */
      #modules .tests-root > .dir,
      #modules .examples-root > .dir {
        font-size: calc(var(--lib-font) * 1.3);
        color: var(--green);
        padding-bottom: 0.15rem;
      }
      #modules .tests-root button,
      #modules .examples-root button { color: var(--fg); }
      #modules .tests-root button:hover,
      #modules .examples-root button:hover { color: var(--var); }
      #modules .dir {
        padding: 0.24rem 0.9rem;
        font: 400 var(--lib-font)/1.5 var(--mono);
        color: var(--sym);
      }
      #modules button {
        display: block; width: 100%; text-align: left;
        background: none; border: 0; cursor: pointer;
        padding: 0.24rem 0.9rem;
        font: 400 var(--lib-font)/1.5 var(--mono);
        color: var(--dim);
      }
      #modules button:hover { color: var(--var); }
      #modules button[aria-current="true"] { color: var(--blue); }

      .source { flex: 1; min-width: 0; min-height: 0; overflow: auto; }
      /* The gutter and the code are one row so they share a scroll, and the
         gutter sticks to the left so a long line scrolls under it rather than
         taking the numbers with it. `min-width: max-content` keeps the row as
         wide as its widest line, which is what gives the sticky gutter
         something to stick against. */
      .code-lines { display: flex; align-items: flex-start; min-width: max-content; }
      .source pre {
        margin: 0; padding: 0.9rem;
        font: 400 var(--lib-font)/1.6 var(--mono);
        white-space: pre; color: var(--fg);
      }
      .gutter {
        position: sticky; left: 0; z-index: 1;
        padding-right: 0.7rem !important;
        color: var(--dim); text-align: right;
        user-select: none; -webkit-user-select: none;
        background: var(--panel);
        border-right: 1px solid var(--rule);
      }
      /* An attribute reads as one annotation, delimiters included. */
      .at { color: var(--pink); }
      /* A `#[test]` in the source runs it, like its entry in the tree. It is
         still an attribute, so it keeps the attribute's colour and adds only
         the affordance. */
      .run-here {
        font: inherit; color: var(--pink); font-style: normal;
        background: none; border: 0; padding: 0; cursor: pointer;
        border-bottom: 1px dotted #6b4a68;
      }
      .run-here:hover { color: var(--var); border-bottom-color: var(--var); }
      .run-here[aria-current="true"] { color: var(--var); background: #2a1c29; }
      .body-here {
        font: inherit; font-size: 0.85em; font-style: normal;
        color: var(--dim); background: none; cursor: pointer;
        border: 1px solid var(--rule); border-radius: 2px;
        padding: 0 0.3em; margin-left: 0.5em;
      }
      .body-here:hover { color: var(--var); border-color: #3a3a40; }

      .source .empty { padding: 0.9rem; color: var(--dim); font: italic 0.85rem/1.5 var(--ui); }

      /* ---- the editor, on the right ------------------------------------ */

      .work { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

      .editor { position: relative; flex: 1; min-height: 0; }
      /* The highlighted layer and the textarea are stacked and must agree on
         every metric, or the coloured text drifts away from the caret.
         
         `pre`, not `pre-wrap`: soft wrapping was the drift. The highlighted
         layer is one span per token, and a break inside a word is decided
         per inline box, so a long line wrapped in a different place there
         than in the textarea over it -- one line's worth of offset, and
         every line below it inherited the error. Not wrapping at all is the
         only way the two can be relied on to agree. Long lines scroll
         sideways instead, both layers together. */
      .editor > pre,
      .editor > textarea {
        position: absolute; inset: 0;
        margin: 0; padding: 1rem;
        border: 0;
        font: 400 0.92rem/1.65 var(--mono);
        white-space: pre;
        overflow: auto;
        tab-size: 2;
      }
      .editor > pre { pointer-events: none; color: var(--fg); background: var(--bg); }
      /* The browser's own stylesheet sets `code { font-family: monospace }`,
         which beats what `pre` inherits down. Same size, different typeface,
         and therefore different metrics -- which goes wrong twice over.
         In the editor the caret drifted further from its text the further
         along a line it went. In the library it drifted DOWNWARD: the real
         line boxes came out at 27.1px against the gutter's 25.59px, so over
         439 lines of mergeSort the numbers ran out 26 lines early. Both are
         the same missing declaration. */
      .editor > pre > code,
      .source pre > code { font: inherit; letter-spacing: inherit; }
      .editor > textarea {
        color: transparent;
        background: transparent;
        caret-color: var(--var);
        resize: none; outline: none;
      }
      .editor > textarea::selection { background: #2a3f55; color: transparent; }
      /* The line an error stopped on. Behind both layers, so the text and the
         caret sit on top of it. */
      .rowmark {
        position: absolute; left: 0; right: 0; height: 0;
        background: #3a1c1c; border-left: 2px solid var(--eff);
        pointer-events: none; z-index: 0;
      }

      .out {
        flex: 0 0 auto;
        max-height: 40%;
        overflow: auto;
        border-top: 1px solid var(--rule);
        padding: 0.8rem 1rem;
        font: 400 0.9rem/1.6 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--panel);
        min-height: 3.2rem;
      }
      .work { position: relative; }
      /* Only while what is in the editor is still the preset it came from. */
      .corner {
        position: absolute; right: 0.7rem; bottom: 0.6rem;
        display: flex; gap: 0.4rem;
      }
      .share {
        font: 400 0.72rem/1 var(--mono); letter-spacing: 0.06em;
        color: var(--dim); background: var(--panel);
        border: 1px solid var(--rule); border-radius: 2px;
        padding: 0.3rem 0.55rem; cursor: pointer;
      }
      .share:hover { color: var(--var); border-color: #3a3a40; }
      .share.done { color: var(--green); border-color: #3a4a3a; }
      .out .tag { color: var(--type); }
      .out .err { color: var(--eff); }
      .out .waiting { color: var(--dim); font-style: italic; }
      .out.stale { opacity: 0.45; }

      /* ---- token colours, from the theme -------------------------------- */

      .c   { color: var(--green); font-style: italic; }
      .k   { color: var(--blue);  font-weight: 600; }
      .t   { color: var(--type);  font-weight: 600; }
      .sy  { color: var(--sym);   font-weight: 600; }
      .o   { color: var(--op); }
      .eff { color: var(--eff); }
      .st  { color: var(--str); }
      .v   { color: var(--var); }
      .tg  { color: #a586a5; font-weight: 600; }

      @media (max-width: 52rem) {
        .panes { flex-direction: column; }
        .library { flex: 0 0 40%; border-right: 0; border-bottom: 1px solid var(--rule); }
        #modules { max-height: 45%; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <a class="home" href="/">fumola</a>
        <span>/</span>
        <span class="here">web play</span>
        <span class="spacer"></span>
        <label title="Keep the graph and the top-level bindings between runs, so an edit repairs what the last one built. Off, each run starts from the instance as it was before anything ran.">
          <input type="checkbox" id="persist"> keep state between runs
        </label>
        <span id="status">starting the runtime…</span>
      </header>

      <div class="panes">
        <aside class="library">
          <div class="lib-head">
            <span class="views">
              <button type="button" class="view-tab" data-view="library">library</button>
              <button type="button" class="view-tab" data-view="objects">objects</button>
              <button type="button" class="view-tab" data-view="outline">outline</button>
              <button type="button" class="view-tab" data-view="events">events</button>
              <button type="button" class="view-tab" data-view="print">print</button>
            </span>
            <button type="button" id="outline-toggle" class="outline-toggle"
                    aria-expanded="true" title="Show or hide the outline"></button>
            <span class="snaps">
              <button type="button" id="lib-smaller" title="Smaller library text">A&minus;</button>
              <button type="button" id="lib-default" title="Default library text size">A0</button>
              <button type="button" id="lib-bigger"  title="Larger library text">A+</button>
              <button type="button" data-snap="full"  title="Fill the window">full</button>
              <button type="button" data-snap="half"  title="Half the window">half</button>
              <button type="button" data-snap="close" title="Hide the library">hide</button>
            </span>
          </div>
          <div class="lib-path"><span class="current" id="current"></span></div>
          <ul id="modules"></ul>
          <div class="hgrip" id="hgrip" role="separator" aria-orientation="horizontal"
               aria-label="Resize the outline"></div>
          <div class="source" id="source">
            <div class="empty">Pick a module to read its source.</div>
          </div>
          <div class="events" id="events">
            <table><tbody id="events-body"></tbody></table>
            <div class="empty" id="events-empty">No events yet.</div>
          </div>
          <div class="scene" id="objects-panel">
            <div class="viewport" id="viewport" hidden></div>
            <div class="scene-body" id="objects-body" hidden></div>
            <div class="empty" id="objects-empty"></div>
          </div>
          <div class="scene" id="outline-panel">
            <div class="scene-body" id="outline-body"></div>
            <div class="empty" id="outline-empty"></div>
          </div>
          <div class="print" id="print">
            <ol id="print-body"></ol>
            <div class="empty" id="print-empty">
              Nothing printed yet. Call <code>print("hello")</code>, or
              <code>print</code> any value, and it appears here.
            </div>
          </div>
        </aside>
        <div class="grip" id="grip" role="separator" aria-orientation="vertical"
             aria-label="Resize the library"></div>
        <button class="reopen" id="reopen" hidden>navigation &middot; library, objects, outline, events, print</button>

        <section class="work">
          <div class="editor">
            <pre aria-hidden="true"><code id="hl"></code></pre>
            <textarea id="src" spellcheck="false" autocapitalize="off"
              autocorrect="off" aria-label="Fumola program"></textarea>
          </div>
          <div class="out" id="out"></div>
          <!-- Outside .out on purpose: every evaluation clears that panel's
               contents, and a button living inside it would be cleared too. -->
          <div class="corner">
            <button type="button" id="hush" class="share" hidden
                    title="Comment out every assert, to re-introduce them one at a time">// assert</button>
            <button type="button" id="share" class="share" hidden
                    title="Copy a link to this example"></button>
          </div>
        </section>
      </div>
    </div>

    <script type="module">
      import init, {
        fumola_ensure_mode,
        fumola_eval_top,
        fumola_reset,
        fumola_tokens,
        fumola_modules,
        fumola_module_source,
      } from "../fumola_wasm.js";

      const $ = (id) => document.getElementById(id);
      const rowEl = document.createElement("div");
      rowEl.className = "rowmark";
      rowEl.hidden = true;

      const srcEl = $("src"), hlEl = $("hl"), outEl = $("out"),
            statusEl = $("status"), persistEl = $("persist"),
            preEl = hlEl.parentElement;
      // Behind both layers: first child of .editor, which is the positioned
      // ancestor the mark is placed against.
      preEl.parentElement.insertBefore(rowEl, preEl);

      // This page owns the runtime, so a fixed id is enough.
      const REPL_INSTANCE = 1;

      // What the page opens on: the body of one example, not a call to it.
      //
      // A scene rather than a two-line program, because the objects panel is
      // the thing here a description cannot substitute for. And the body
      // rather than `exampleMergeSort()`, because the body shows the
      // arguments -- the seed and the size are the first things anyone will
      // want to change, and a unit-argument call hides them.
      //
      // Named rather than written out, so the text comes from the library
      // through the same path the `body` button uses and cannot drift from
      // it. The homepage's console keeps the two-line program, where the
      // point is only that a runtime is running at all.
      const START_BODY = "examples/mergeSort/mergeSort:exampleMergeSort";

      // ---- highlighting -------------------------------------------------
      // The kinds come from the language's own lexer, so there is no grammar
      // here to fall out of step with it.
      const CLASS = {
        comment: "c", keyword: "k", type: "t", symbol: "sy",
        effect: "eff", operator: "o", literal: "st", ident: "v",
        variant: "tg",
      };
      const esc = (s) =>
        s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

      /// The spans of `#[...]` attributes, start offset -> end offset.
      ///
      /// An attribute is metadata about the declaration under it, and reads
      /// best as one thing: `#[derive(Compare)]` coloured in three pieces --
      /// delimiters, name, argument -- makes the reader assemble it. This
      /// goes past what the VSCode grammar does deliberately.
      ///
      /// `#` is also Fumola's concatenation operator, so `xs # [1, 2]` would
      /// look identical to an attribute token by token. Two things separate
      /// them, and both are needed: an attribute writes `#[` with nothing
      /// between, and it begins a declaration, so what precedes it is `;`,
      /// `{`, `}`, or the start of the file. Concatenation is preceded by the
      /// expression it is concatenating. Starting a line is not enough on its
      /// own -- levelTree really does contain
      ///     objectFromEdge(label_, "putA", n.edges[1])
      ///     # [ objectFromEdge(label_, "putB", n.edges[3]), ... ]
      /// which is a concatenation at the head of a line.
      const attrRanges = (source, tokens) => {
        const out = new Map();
        const t = tokens.filter((x) => x.kind !== "space" && x.kind !== "comment");
        const at = (i) => (t[i] ? source.slice(t[i].start, t[i].start + t[i].len) : "");
        const OPENS = [";", "{", "}"];
        for (let i = 0; i < t.length; i += 1) {
          if (at(i) !== "#" || at(i + 1) !== "[") continue;
          // `#[`, not `# [`.
          if (t[i + 1].start !== t[i].start + t[i].len) continue;
          // and at the head of a declaration, not after an operand.
          if (i > 0 && !OPENS.includes(at(i - 1))) continue;
          let depth = 0;
          for (let j = i + 1; j < t.length; j += 1) {
            const w = at(j);
            if (w === "[") depth += 1;
            else if (w === "]") {
              depth -= 1;
              if (depth === 0) { out.set(t[i].start, t[j].start + t[j].len); break; }
            }
          }
        }
        return out;
      };

      // `marks` maps a start offset to {end, index}: that range is wrapped in
      // a button rather than coloured, so a `#[test]` in the source can be
      // clicked the same way its entry in the tree can.
      const highlight = (text, marks) => {
        let reply;
        try { reply = JSON.parse(fumola_tokens(text)); } catch (e) { return esc(text); }
        if (!reply.ok) return esc(text);
        const attrs = attrRanges(text, reply.tokens);
        let html = "", at = 0;
        for (const t of reply.tokens) {
          if (t.start > at) html += esc(text.slice(at, t.start));
          if (at > t.start) continue;               // inside a mark already emitted
          const mark = marks && marks.get(t.start);
          if (mark) {
            html += `<button class="run-here" data-test="${mark.index}" ` +
                    `title="Run this test">${esc(text.slice(t.start, mark.end))}</button>` +
                    `<button class="body-here" data-test="${mark.index}" ` +
                    `title="Put this test's code in the editor">body</button>`;
            at = mark.end;
            continue;
          }
          // An attribute is emitted whole, so `#[`, its name, its arguments
          // and `]` all read as the one annotation they are.
          const attrEnd = attrs.get(t.start);
          if (attrEnd !== undefined) {
            html += `<span class="at">${esc(text.slice(t.start, attrEnd))}</span>`;
            at = attrEnd;
            continue;
          }
          const body = esc(text.slice(t.start, t.start + t.len));
          const cls = CLASS[t.kind];
          html += cls ? `<span class="${cls}">${body}</span>` : body;
          at = t.start + t.len;
        }
        if (at < text.length) html += esc(text.slice(at));
        // A <pre> swallows one trailing newline; without this the last line
        // of the highlight sits one line above the caret.
        return html + "\n";
      };

      /// Both layers are scrollable and only one of them is scrolled by
      /// typing, so the highlighted text has to be told where the caret went.
      /// Without this the whole layer sits at the top while the textarea
      /// moves down it -- the drift is the scroll distance, which is why it
      /// only showed up once programs were longer than the box.
      const syncScroll = () => {
        preEl.scrollTop = srcEl.scrollTop;
        preEl.scrollLeft = srcEl.scrollLeft;
        placeRowMark();
      };

      /// Put a band behind the line an error stopped on.
      ///
      /// Both layers are `white-space: pre` and neither wraps, so line N is
      /// always the same distance down and the band can be positioned by
      /// arithmetic rather than by measuring the text.
      let markedLine = 0;
      const placeRowMark = () => {
        if (!markedLine) { rowEl.hidden = true; return; }
        const style = getComputedStyle(srcEl);
        const lh = parseFloat(style.lineHeight);
        const top = parseFloat(style.paddingTop);
        rowEl.style.height = `${lh}px`;
        rowEl.style.top = `${top + (markedLine - 1) * lh - srcEl.scrollTop}px`;
        rowEl.hidden = false;
      };

      const markLine = (line) => { markedLine = line || 0; placeRowMark(); };

      /// The innermost frame that is in the program, if any is.
      ///
      /// A frame carries a line and a byte span but not a file, so the runtime
      /// cannot say whether it is in what was just typed or in a library
      /// module that was called. This can: a frame reaching past the end of
      /// the program is not in the program. Frames arrive innermost first, so
      /// the first that fits is the nearest place in the program to where it
      /// actually stopped -- which is the line worth pointing at even when the
      /// failure itself happened further in.
      const frameInProgram = (frames, text) => {
        if (!Array.isArray(frames)) return null;
        const bytes = new TextEncoder().encode(text).length;
        const lines = text.split("\n").length;
        return (
          frames.find(
            (f) => f && f.end <= bytes && f.line >= 1 && f.line <= lines
          ) || null
        );
      };

      const paint = () => {
        if (!ready) { hlEl.textContent = srcEl.value; return; }
        hlEl.innerHTML = highlight(srcEl.value);
        // Replacing the content resets the layer's own scroll.
        syncScroll();
      };

      // ---- the runtime, fetched on first use ----------------------------
      let ready = false, instance = null, starting = null;
      const ensureRuntime = () => {
        if (starting) return starting;
        statusEl.textContent = "starting the runtime…";
        starting = init()
          .then(() => {
            // Graphical throughout, and built that way rather than created
            // simple and switched. Simple is the wasm default because Hazel
            // has a re-evaluation semantics of its own to compose with;
            // presenting Fumola on its own, that caution only gets in the
            // way, and library code written for Fumola's own default failed
            // under it. ensure_mode creates the instance if the id is free,
            // so this is one build, not two.
            instance = REPL_INSTANCE;
            fumola_ensure_mode(instance, "graphical");
            ready = true;
            listModules();
            paint();          // the first paint was plain: the lexer is here now
            note();
            // A link names a library test or example; carrying it out
            // replaces the starter program. With no link, open the body the
            // page starts on.
            if (!openFromHash() && !openBody(START_BODY)) evaluate();
          })
          .catch((e) => {
            statusEl.textContent = "the runtime could not be loaded";
            starting = null;
            throw e;
          });
        return starting;
      };
      const note = () => {
        statusEl.textContent = persistEl.checked
          ? `instance ${instance} · graphical · state kept`
          : `instance ${instance} · graphical · clean store each run`;
      };

      // ---- the library --------------------------------------------------
      // A module's public tests, found in its own token stream: the sequence
      // # [ test ] public func NAME, ignoring whitespace. Only public ones,
      // since a private test cannot be called from outside its module -- 17
      // of the library's 29 are public.
      //
      // Lexical rather than semantic. The VM builds an authoritative suite
      // when a module is imported (TestSuiteItem carries the file, the
      // visibility and the function), which would be the better source if
      // this ever needs to be exact.
      const testsIn = (source) => {
        let reply;
        try { reply = JSON.parse(fumola_tokens(source)); } catch (e) { return []; }
        if (!reply.ok) return [];
        const t = reply.tokens.filter((x) => x.kind !== "space" && x.kind !== "comment");
        const text = (i) => (t[i] ? source.slice(t[i].start, t[i].start + t[i].len) : "");

        const found = [];
        const scopes = [];        // enclosing `public module NAME`, innermost last
        let depth = 0, pending = null;

        for (let i = 0; i < t.length; i++) {
          const w = text(i);
          if (w === "{") {
            depth += 1;
            if (pending !== null) { scopes.push({ depth, name: pending }); pending = null; }
            continue;
          }
          if (w === "}") {
            while (scopes.length && scopes[scopes.length - 1].depth >= depth) scopes.pop();
            depth -= 1;
            continue;
          }
          // `public module NAME {` -- the name is a type token when it is
          // capitalised, which it usually is.
          if (w === "public" && text(i + 1) === "module" &&
              t[i + 2] && (t[i + 2].kind === "ident" || t[i + 2].kind === "type")) {
            pending = text(i + 2);
            continue;
          }
          // `#[test] public func NAME`, and `#[example]` and
          // `#[examplePair]` the same way. All three are a public function
          // the library offers to be run; what differs is what running one is
          // for, and which section it is listed under. A pair answers with
          // two runs and the difference between them, so one panel becomes
          // three.
          if (w === "#" && text(i + 1) === "[" &&
              (text(i + 2) === "test" || text(i + 2) === "example" ||
               text(i + 2) === "examplePair") &&
              text(i + 3) === "]" && text(i + 4) === "public" &&
              text(i + 5) === "func" && t[i + 6] && t[i + 6].kind === "ident") {
            found.push({
              kind: text(i + 2),
              name: text(i + 6),
              // A test inside `public module EditTest` is reached through it.
              scope: scopes.map((sc) => sc.name).join("."),
              // Where `#[test]` sits, so the source view can make it a link.
              start: t[i].start,
              end: t[i + 3].start + t[i + 3].len,
              // And where its body is, so the source view can hand it over
              // to be edited. Found by matching braces from the first `{`
              // after the signature.
              body: bodyRange(t, text, i + 6),
            });
          }
        }
        return found;
      };

      /// The span inside the braces of the function whose name is at `from`.
      const bodyRange = (t, text, from) => {
        let j = from;
        while (j < t.length && text(j) !== "{") j += 1;
        if (j >= t.length) return null;
        let depth = 0;
        for (let k = j; k < t.length; k += 1) {
          const w = text(k);
          if (w === "{") depth += 1;
          else if (w === "}") {
            depth -= 1;
            if (depth === 0) {
              return { start: t[j].start + 1, end: t[k].start };
            }
          }
        }
        return null;
      };

      /// Every `public` binding, with the module scope it sits in.
      const exportsOf = (source) => {
        let reply;
        try { reply = JSON.parse(fumola_tokens(source)); } catch (e) { return []; }
        if (!reply.ok) return [];
        const t = reply.tokens.filter((x) => x.kind !== "space" && x.kind !== "comment");
        const text = (i) => (t[i] ? source.slice(t[i].start, t[i].start + t[i].len) : "");
        const out = [];
        const scopes = [];
        let depth = 0, pending = null;
        for (let i = 0; i < t.length; i += 1) {
          const w = text(i);
          if (w === "{") {
            depth += 1;
            if (pending !== null) { scopes.push({ depth, name: pending }); pending = null; }
            continue;
          }
          if (w === "}") {
            while (scopes.length && scopes[scopes.length - 1].depth >= depth) scopes.pop();
            depth -= 1;
            continue;
          }
          if (w !== "public") continue;
          const kind = text(i + 1);
          if (!["func", "module", "let", "var", "type"].includes(kind)) continue;
          out.push({ name: text(i + 2), scope: scopes.map((sc) => sc.name).join(".") });
          if (kind === "module") pending = text(i + 2);
        }
        return out;
      };

      /// The module's own imports, as the editor would have to write them.
      /// Every import path in the library is a bare name resolved in the
      /// importing file's directory -- which is what the symlinks under
      /// `fumola/` are working around -- so re-addressing one from the top
      /// level is just putting that directory in front of it.
      const importsOf = (source, path) => {
        const dir = path.replace(/\/[^/]*$/, "");
        const out = [];
        const re = /\bimport\s+([A-Za-z_][A-Za-z0-9_]*)\s+"([^"]*)"/g;
        let m;
        while ((m = re.exec(source)) !== null)
          out.push({ alias: m[1], path: m[2].includes("/") ? m[2] : `${dir}/${m[2]}` });
        return out;
      };

      /// Inside the module, a test calls its neighbours by their bare names.
      /// Outside it, those names are gone, so the pasted body would be red
      /// on arrival. Put the module back in front of the ones that came from
      /// it, and leave everything else -- locals, the prelude, the private
      /// helpers we cannot reach anyway -- untouched.
      const qualify = (body, test, source) => {
        const all = exportsOf(source);
        const prefix = new Map();
        for (const e of all) if (!e.scope) prefix.set(e.name, "M.");
        // A name in the test's own module is the nearer one, so it wins.
        if (test.scope)
          for (const e of all)
            if (e.scope === test.scope) prefix.set(e.name, `M.${test.scope}.`);
        if (!prefix.size) return { text: body, changed: 0 };

        let reply;
        try { reply = JSON.parse(fumola_tokens(body)); } catch (e) { return { text: body, changed: 0 }; }
        if (!reply.ok) return { text: body, changed: 0 };
        const t = reply.tokens.filter((x) => x.kind !== "space" && x.kind !== "comment");
        const text = (i) => (t[i] ? body.slice(t[i].start, t[i].start + t[i].len) : "");

        // Anything the body binds for itself shadows the module's version --
        // but only from where it binds it. A body that ends with
        //   let sceneObjects = sceneObjects1 # sceneObjects2;
        // still means the module's `sceneObjects` where it calls it further
        // up, and a position-blind scan let that later `let` reach backwards
        // and leave the call unqualified.
        const local = new Map();          // name -> first token index binding it
        const bind = (name, at) => { if (!local.has(name)) local.set(name, at); };
        for (let i = 0; i < t.length; i += 1) {
          const w = text(i);
          if (w === "func" || w === "module") { bind(text(i + 1), i + 1); continue; }
          if (w !== "let" && w !== "var") continue;
          for (let j = i + 1; j < t.length; j += 1) {
            const u = text(j);
            if (u === "=" || u === ";" || u === "in") break;
            if (t[j].kind === "ident") bind(u, j);
          }
        }

        const DECL = ["func", "module", "type", "let", "var", "label", "."];
        let out = "", at = 0, changed = 0;
        for (let i = 0; i < t.length; i += 1) {
          const w = text(i);
          if (t[i].kind !== "ident" && t[i].kind !== "type") continue;
          if (!prefix.has(w)) continue;
          const boundAt = local.get(w);
          if (boundAt !== undefined && boundAt < i) continue;
          if (i > 0 && (DECL.includes(text(i - 1)) || text(i - 1) === "`")) continue;
          if (text(i + 1) === "=") continue;          // a field, or a binding
          out += body.slice(at, t[i].start) + prefix.get(w);
          at = t[i].start;
          changed += 1;
        }
        return { text: out + body.slice(at), changed };
      };

      /// Strip the indentation the body had inside its module.
      const dedent = (block) => {
        const lines = block.replace(/^\n/, "").replace(/\s+$/, "").split("\n");
        const indents = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^[ \t]*/)[0].length);
        const cut = indents.length ? Math.min(...indents) : 0;
        return lines.map((l) => l.slice(cut)).join("\n");
      };

      // Clicking one writes the call that runs it from outside the module,
      // which is the whole point: the library's authors decide what a visitor
      // finds here, and it arrives ready to run.
      const invocationFor = (path, test) =>
        `import M "${path}";\nM.${test.scope ? test.scope + "." : ""}${test.name}()`;

      const listModules = () => {
        const reply = JSON.parse(fumola_modules());
        if (!reply.ok) return;
        const list = $("modules");
        list.textContent = "";

        // Shared prefixes become shared parents. The `fumola/` prefix is on
        // every module, so it is only noise. Every module listed is a file
        // that exists: the library used to carry symlinked copies, skipped
        // here by a `link` flag, so that a module's neighbours were
        // importable without "../..". An import can climb out of its own
        // directory now, so there is nothing left to filter.
        const modules = emptyTree();
        const real = [];
        for (const m of reply.modules) {
          real.push(m.path);
          const parts = m.path.replace(/^fumola\//, "").split("/");
          const name = parts.pop();
          place(modules, parts, {
            name,
            title: m.path,
            pick: (b) => showModule(m.path, b),
          });
        }
        renderTree(modules, list, 0);

        // What the library offers to be run, in the same shape as the
        // modules above, so where each one comes from is visible rather than
        // something to look up. A module becomes a directory of its own.
        const examples = emptyTree();
        const pairs = emptyTree();
        const tests = emptyTree();
        let count = 0, exampleCount = 0, pairCount = 0;
        for (const path of real) {
          const src = JSON.parse(fumola_module_source(path));
          if (!src.ok) continue;
          for (const t of testsIn(src.source)) {
            const dirs = path.replace(/^fumola\//, "").split("/");
            const call = invocationFor(path, t);
            presets.set(presetKey(path, t), { path, test: t });
            const into = t.kind === "example" ? examples
                       : t.kind === "examplePair" ? pairs : tests;
            if (t.kind === "example") exampleCount += 1;
            else if (t.kind === "examplePair") pairCount += 1;
            else count += 1;
            place(into, dirs, {
              name: (t.scope ? t.scope + "." : "") + t.name,
              title: call.split("\n")[1],
              pick: (b) => {
                // Both halves: run it, and open its module at the marker, so
                // the test can be read as well as run.
                showModule(path, b, t);
                loadTest(path, t);
              },
            });
          }
        }

        /// A section of its own under the modules, with a heading and a tone
        /// that set it apart without a second layout to learn.
        const section = (cls, heading, tree) => {
          const li = document.createElement("li");
          li.className = cls;
          const label = document.createElement("div");
          label.className = "dir";
          label.textContent = heading;
          label.style.paddingLeft = "0.9rem";
          li.appendChild(label);
          const sub = document.createElement("ul");
          renderTree(tree, sub, 1);
          li.appendChild(sub);
          list.appendChild(li);
        };

        // Examples first: they are what someone opening the page is most
        // likely to want, and each one answers with a picture of itself.
        if (exampleCount) section("examples-root", "examples/", examples);
        if (pairCount) section("examples-root", "examplePairs/", pairs);
        if (count) section("tests-root", "tests/", tests);
      };

      // Fully expanded: the library is small enough to take in at a glance,
      // and a fold would only hide it. Leaves carry their own action, so the
      // modules and the tests can share this.
      const renderTree = (node, into, depth) => {
        const indent = (el) => { el.style.paddingLeft = 0.9 + depth * 0.9 + "rem"; };
        const byName = (a, b) => String(a).localeCompare(String(b));

        for (const name of [...node.dirs.keys()].sort(byName)) {
          const li = document.createElement("li");
          const label = document.createElement("div");
          label.className = "dir";
          label.textContent = name + "/";
          indent(label);
          li.appendChild(label);
          const sub = document.createElement("ul");
          renderTree(node.dirs.get(name), sub, depth + 1);
          li.appendChild(sub);
          into.appendChild(li);
        }
        for (const f of node.files.sort((a, b) => byName(a.name, b.name))) {
          const li = document.createElement("li");
          const b = document.createElement("button");
          b.textContent = f.name;
          if (f.title) b.title = f.title;
          indent(b);
          b.addEventListener("click", () => f.pick(b));
          li.appendChild(b);
          into.appendChild(li);
        }
      };

      /// Insert a leaf at a path of directory names.
      const place = (root, dirs, file) => {
        let node = root;
        for (const d of dirs) {
          if (!node.dirs.has(d)) node.dirs.set(d, { dirs: new Map(), files: [] });
          node = node.dirs.get(d);
        }
        node.files.push(file);
      };
      const emptyTree = () => ({ dirs: new Map(), files: [] });

      // ---- the event log, watched as you edit ---------------------------
      // Asking for the events does not add any -- peekEvents is a read -- so
      // this can refresh on every evaluation without disturbing what it is
      // showing.
      const eventsEl = $("events");
      /// Lit while the panel has something in it, the same as print.
      const setEventsLight = (n) => {
        document
          .querySelector('.view-tab[data-view="events"]')
          .classList.toggle("has-output", n > 0);
      };

      /// How many events there are, without building the table.
      ///
      /// The tab has to know whether it is empty even while another view is
      /// in front -- which is exactly when the hint is worth having, and
      /// exactly when the renderer below bails out. Only the count crosses:
      /// rendering costs a `fumola_tokens` call per row, and the list itself
      /// can be thousands of entries on a graph of any size.
      const countEvents = () => {
        if (!ready) return;
        try {
          const reply = JSON.parse(
            fumola_eval_top(instance, "Adapton.peekEvents().size()")
          );
          setEventsLight(reply.ok ? Number(reply.value) : 0);
        } catch (e) { /* a half-typed program is not worth a report */ }
      };

      const refreshEvents = () => {
        if (!ready) return;
        if (libEl.dataset.view !== "events") { countEvents(); return; }
        const body = $("events-body");
        const empty = $("events-empty");

        let reply;
        try {
          reply = JSON.parse(fumola_eval_top(instance, "Adapton.peekEvents()"));
        } catch (e) { return; }
        if (!reply.ok || reply.tag !== "List") {
          body.textContent = "";
          empty.hidden = false;
          // A simple-semantics instance keeps no graph to report on.
          empty.textContent = reply.ok ? "No events to show." : reply.error;
          setEventsLight(0);
          return;
        }

        // Follow the tail, but do not yank the view away from someone who has
        // scrolled up to read.
        const atEnd =
          eventsEl.scrollHeight - eventsEl.scrollTop - eventsEl.clientHeight < 40;

        body.textContent = "";
        let band = 0, lastMeta = null;
        for (const row of reply.value) {
          const fields = row && row.value ? row.value : {};
          const meta = fields.metaTime ? String(fields.metaTime.value) : "";
          if (meta !== lastMeta) { band = 1 - band; lastMeta = meta; }

          const tr = document.createElement("tr");
          tr.className = "band" + band;
          const mt = document.createElement("td");
          mt.className = "mt";
          mt.textContent = meta;
          const ev = document.createElement("td");
          ev.className = "ev";
          ev.innerHTML = highlight(show(fields.event)).replace(/\n$/, "");
          tr.append(mt, ev);
          body.appendChild(tr);
        }
        empty.hidden = reply.value.length > 0;
        setEventsLight(reply.value.length);
        empty.textContent = "No events yet.";
        if (atEnd) eventsEl.scrollTop = eventsEl.scrollHeight;
      };

      const setView = (view) => {
        libEl.dataset.view = view;
        // Asking for the outline means wanting to see it. After picking a
        // module the tree is collapsed, and without this the tab looked
        // dead: it switched to a view whose tree was still shut.
        if (view === "library") setOutline(true);
        for (const t of document.querySelectorAll(".view-tab"))
          t.setAttribute("aria-current", String(t.dataset.view === view));
        if (view === "events") refreshEvents();
      };

      /// Fumola's lexer recognises `\n` and `\t` well enough to know they do
      /// not end a string, but never turns them into the characters they name
      /// -- so a printed line arrives holding a backslash and an `n`. Showing
      /// them as the line break and tab they were written for is a display
      /// convention here, not an unescaping: there is no escaped form in the
      /// value to undo.
      const unescapeText = (line) =>
        line.replace(/\\([nt\\])/g, (_, c) =>
          c === "n" ? "\n" : c === "t" ? "\t" : "\\");

      /// What `prim "print"` wrote during the run that just finished.
      ///
      /// The CLI puts these on stdout, and they are often the whole reason a
      /// test prints at all -- the numbers it is about to assert on. There is
      /// no stdout in a browser, so they come here instead.
      ///
      /// This run's, not every run's. The program is re-evaluated on each
      /// keystroke, so accumulating would add another copy of the same lines
      /// per character typed; what is wanted is what the program prints now.
      const showPrint = (lines) => {
        const body = $("print-body");
        body.textContent = "";
        for (const line of lines || []) {
          const li = document.createElement("li");
          li.textContent = unescapeText(line);
          body.appendChild(li);
        }
        const any = !!(lines && lines.length);
        $("print-empty").hidden = any;
        // Lit exactly while there is something to read, so the tab answers
        // "is there anything in there?" without being opened.
        document
          .querySelector('.view-tab[data-view="print"]')
          .classList.toggle("has-output", any);
      };

      const setOutline = (open) => {
        libEl.dataset.outline = open ? "open" : "closed";
        $("outline-toggle").setAttribute("aria-expanded", String(open));
      };

      // Loading a test is the same action whether it is clicked in the tree
      // or in the source, so both go through here.
      /// Which library preset the editor is currently showing, if any.
      ///
      /// An anchor names a test by where it is defined -- the module it lives
      /// in and its name inside that module -- and by nothing else. Not a line
      /// number, which every edit to the file would invalidate, and not an
      /// index, which reordering would. A link therefore survives the module
      /// being edited around the test, and breaks only when the test moves to
      /// a different module, which is the one case where it should.
      ///
      /// `text` is what was put in the editor. The moment the editor differs
      /// from it, this page is no longer showing that example, and the link
      /// would be a claim about something that is not there -- so the anchor
      /// goes.
      let preset = null;
      const presets = new Map();   // "path:Qualified.name" -> {path, test}

      const presetKey = (path, test) =>
        `${path.replace(/^fumola\//, "")}:` +
        `${test.scope ? test.scope + "." : ""}${test.name}`;

      const setPreset = (kind, path, test) => {
        preset = { kind, key: presetKey(path, test), text: srcEl.value };
        const hash = `#${kind}=${preset.key}`;
        history.replaceState(null, "", location.pathname + location.search + hash);
        showShare();
      };

      /// The editor no longer holds what the anchor says it holds.
      const clearPreset = () => {
        if (!preset) return;
        preset = null;
        history.replaceState(null, "", location.pathname + location.search);
        showShare();
      };

      /// Comment out every assertion in the editor.
      ///
      /// Editing a test body means its assertions describe the old code, and
      /// they fail one at a time in whatever order the program happens to
      /// reach them -- which tells you about the first one and hides the rest.
      /// Commenting them all out gets the body running again, and they come
      /// back one at a time, as choices.
      ///
      /// Only lines that start with `assert`, and only in the editor: the
      /// library on the left is read-only.
      /// Where each `assert` statement begins and ends.
      ///
      /// A whole statement, not a line: an assertion can run over several,
      /// and levelTree's testGeom2d does --
      ///     assert (g ==
      ///       { height = 8;
      ///         width = 10; ... });
      /// -- so commenting only the first line leaves an orphaned record
      /// behind and the program is worse off than before. The end is the `;`
      /// that closes it at bracket depth zero, found over the token stream so
      /// that a brace inside a string or a comment cannot move it.
      const assertStatements = (text) => {
        let reply;
        try { reply = JSON.parse(fumola_tokens(text)); } catch (e) { return []; }
        if (!reply.ok) return [];
        const t = reply.tokens.filter(
          (x) => x.kind !== "space" && x.kind !== "comment"
        );
        const at = (i) => (t[i] ? text.slice(t[i].start, t[i].start + t[i].len) : "");
        const STARTS = [";", "{", "}"];
        const out = [];
        for (let i = 0; i < t.length; i += 1) {
          if (at(i) !== "assert") continue;
          if (i > 0 && !STARTS.includes(at(i - 1))) continue;
          let depth = 0, end = t[i].start + t[i].len;
          for (let j = i; j < t.length; j += 1) {
            const w = at(j);
            if (w === "(" || w === "{" || w === "[") depth += 1;
            else if (w === ")" || w === "}" || w === "]") depth -= 1;
            if (depth < 0) break;              // the block around it closed
            end = t[j].start + t[j].len;
            if (w === ";" && depth === 0) break;
          }
          out.push({ start: t[i].start, end });
        }
        return out;
      };

      const commentAsserts = () => {
        const text = srcEl.value;
        const spans = assertStatements(text);
        if (!spans.length) return;
        const lineOf = (off) => text.slice(0, off).split("\n").length - 1;
        const hush = new Set();
        for (const sp of spans)
          for (let l = lineOf(sp.start); l <= lineOf(Math.max(sp.start, sp.end - 1)); l += 1)
            hush.add(l);
        srcEl.value = text
          .split("\n")
          .map((l, i) => (hush.has(i) ? l.replace(/^(\s*)/, "$1// ") : l))
          .join("\n");
        // The editor no longer holds what a link would claim it holds.
        clearPreset();
        paint();
        evaluate();
      };

      const showHush = (on) => { $("hush").hidden = !on; };

      /// What a program says about how to look at it.
      ///
      /// A scene is not extracted from a program; a program offers one, by
      /// evaluating to a record with these two fields. Seeing that come back
      /// from the editor is the whole trigger -- nothing reads the code, and
      /// nothing guesses. An `#[example]` is how a library function opts into
      /// producing one.
      ///
      /// Recognised by its fields rather than by a tag around them, so that
      /// code already holding the right shape is a scene without being
      /// converted into one. `A.Scene.Scene` is such a record, with a
      /// `history` beside them that a scene ignores.
      const SCENE_SCHEMA =
        'import W "fumola/system/webPlay";\n' +
        "\n" +
        "{\n" +
        "  objects : [ Adapton.Scene.SceneObject ];\n" +
        "  outline : [ Adapton.Outline.Outline ];\n" +
        "}";

      const sceneOf = (reply) => {
        if (!reply.ok || reply.tag !== "Record") return null;
        const fields = reply.value || {};
        return fields.objects !== undefined && fields.outline !== undefined
          ? reply
          : null;
      };

      /// An `#[examplePair]` answers with two scenes and their node diff.
      /// Recognised by having those three fields, the way a scene is
      /// recognised by having `objects` and `outline` -- no tag to carry.
      const pairOf = (reply) => {
        if (!reply.ok || reply.tag !== "Record") return null;
        const f = reply.value || {};
        return f.left !== undefined && f.right !== undefined &&
               f.nodes !== undefined && f.sizes !== undefined ? f : null;
      };

      /// The four numbers, from the pair's `sizes`, plus what they imply.
      ///
      /// From `sizes` and not from `nodes`: the diff's maps are `Map`s, whose
      /// representation is hidden, so they arrive here as an opaque rendering
      /// rather than something countable. The pair states the counts for that
      /// reason.
      const diffCounts = (sizes) => {
        const f = (sizes && sizes.value) || {};
        const n = (k) => {
          const v = f[k];
          const raw = v && v.value !== undefined ? v.value : v;
          const num = Number(raw);
          return Number.isFinite(num) ? num : 0;
        };
        const c = {
          left: n("left"), right: n("right"),
          onlyLeft: n("onlyLeft"), onlyRight: n("onlyRight"),
          equal: n("equal"), notEqual: n("notEqual"),
        };
        c.changed = c.onlyLeft + c.onlyRight + c.notEqual;
        c.total = Math.max(c.left, c.right);
        c.fraction = c.total ? c.changed / c.total : 0;
        return c;
      };

      const fillScenePanel = (name, component, count, lead, draw) => {
        const body = $(name + "-body");
        const empty = $(name + "-empty");
        const tab = document.querySelector(`.view-tab[data-view="${name}"]`);
        if (count) {
          body.textContent = "";
          if (draw) draw(body);
          else body.innerHTML = highlight(show(component)).replace(/\n$/, "");
          body.hidden = false;
          empty.hidden = true;
        } else {
          body.textContent = "";
          body.hidden = true;
          empty.textContent = "";
          const p = document.createElement("div");
          p.textContent = lead;
          const code = document.createElement("pre");
          code.className = "schema";
          code.innerHTML = highlight(SCENE_SCHEMA).replace(/\n$/, "");
          empty.append(p, code);
          empty.hidden = false;
        }
        tab.classList.toggle("has-output", count > 0);
      };

      // ---- the outline, drawn the way the replayground draws it ----------
      //
      // A port of `renderOutline` from replayground-www/index.template.html,
      // over the values as they cross the wasm boundary rather than over the
      // JSON that `IntoJSON.fromOutline` writes. Same nesting, same arrows,
      // same `(begin, end)` pairs, same result row hanging off a nested edge.
      //
      // Left behind on purpose: the chips there are wired to a time cursor
      // and to meshes, and neither exists here yet. This draws; it does not
      // yet cross-link.

      const vRec = (v) => (v && v.tag === "Record" ? v.value : null);
      const vArr = (v) => (v && (v.tag === "List" || v.tag === "Tuple") ? v.value : []);
      const vVariant = (v) => (v && v.tag === "Variant" ? v.value : null);
      const vSome = (v) => (v && v.tag === "Option" ? v.value : null);
      const vFlat = (v) => show(v).replace(/\n+/g, " ").trim();

      const ARROWS = {
        put: " ───» ", get: " ───> ", putForce: " ══▷» ", force_: " ═══▷ ",
      };

      const span = (cls, text) => {
        const e = document.createElement("span");
        e.className = cls;
        e.textContent = text;
        return e;
      };

      /// `metaTimes` is a pair; a nested edge spans from one to the other.
      const metaPair = (v) => {
        const a = vArr(v);
        if (a.length === 2) return [vFlat(a[0]), vFlat(a[1])];
        const one = vFlat(v);
        return [one, one];
      };

      const drawOutline = (into, outline, depth) => {
        const node = vVariant(outline);
        if (!node) return;
        const fields = vRec(node.value);
        if (!fields) return;

        const div = document.createElement("div");
        div.className = "outline-node";
        if (depth === 0) {
          const id = fields.nodeId || fields.__nodeId;
          if (id) div.appendChild(span("nodeId", vFlat(id)));
        }
        into.appendChild(div);

        // Everything below this node goes inside its element, not beside it.
        // That nesting is the indentation: `.outline-node` and
        // `.outline-edge` each step 8px left-ward, and the steps accumulate
        // only if the DOM actually nests. Appending to `into` instead draws
        // the whole tree flush left, which is what it did at first.
        for (const edgeValue of vArr(fields.edges)) {
          const e = vRec(edgeValue);
          if (!e) continue;
          const row = document.createElement("div");
          row.className = "outline-edge";

          const [begin, end] = metaPair(e.metaTimes);
          const nested = vSome(e.outline);
          // The same convention as `IntoText.metaTimesIntoText`: a pair only
          // when the two differ, so an edge that happened at one moment says
          // one moment.
          row.appendChild(
            span("metaTime", begin === end ? `(${begin})` : `(${begin}, ${end})`)
          );

          const action = vVariant(e.action);
          const name = action ? action.name : "";
          row.appendChild(
            span("action-arrow action-" + name, ARROWS[name] || ` ${name} `)
          );
          row.appendChild(span("nodeId", vFlat(e.actionTarget)));
          div.appendChild(row);

          if (nested) {
            drawOutline(div, nested, depth + 1);
            // The value a nested force came back with, on a line of its own.
            const result = document.createElement("div");
            result.className = "outline-internal-result";
            result.appendChild(span("action-arrow result-arrow", "╰〜〜> "));
            result.appendChild(span("outline-value-text", vFlat(e.value)));
            div.appendChild(result);
          } else {
            row.appendChild(span("outline-value-text", " " + vFlat(e.value)));
          }
        }
      };

      // ---- the objects, drawn ------------------------------------------
      //
      // Follows the construction in replayground-www: a box or an orb per
      // labelled object at the position the program chose, and a line for
      // each pointer between them. three.js is vendored beside this page
      // rather than fetched from a CDN, and imported the first time a scene
      // actually needs it -- 670KB is not something to charge someone for
      // opening the page.

      let three = null, viewport = null;

      const loadThree = async () => {
        if (three) return three;
        const [THREE, orbit] = await Promise.all([
          import("../vendor/three.module.min.js"),
          import("../vendor/OrbitControls.js"),
        ]);
        three = { THREE, OrbitControls: orbit.OrbitControls };
        return three;
      };

      const vNum = (v) => (v && v.value !== undefined ? Number(v.value) : 0);
      const vStr = (v) => (v && typeof v.value === "string" ? v.value : vFlat(v));
      const vec3 = (v) => {
        const r = vRec(v) || {};
        return [vNum(r.x), vNum(r.y), vNum(r.z)];
      };

      /// Take the scene apart into what a renderer needs.
      const readObjects = (list) => {
        const shapes = [], links = [], actions = [];
        for (const item of vArr(list)) {
          const v = vVariant(item);
          if (!v) continue;
          const f = vRec(v.value) || {};
          if (v.name === "box" || v.name === "orb") {
            shapes.push({
              kind: v.name,
              // `unescapeText` here for the same reason the print panel needs
              // it: Fumola's lexer never turns `\n` into a line break, so the
              // Text holds a backslash and an `n`. The replayground never had
              // to do this -- the CLI expands escapes when it writes the
              // scene file, so its `scene.json` holds real newlines by the
              // time `makeTextTexture` splits on them. Reading the value
              // across the wasm boundary skips that step.
              label: unescapeText(vStr(f.label_)),
              at: vec3(f.position),
              text: unescapeText(vStr(f.textFields)),
              // The named slots a pointer can leave from. Each becomes a dot
              // under the object, and a pointer line starts at its dot rather
              // than at the object's middle -- which is how the replayground
              // can show two pointers leaving one box in different directions.
              fields: vArr(f.pointerFields).map(vStr),
            });
          } else if (v.name === "pointer") {
            links.push({ from: vStr(f.from), to: vStr(f.to) });
          } else if (v.name === "action") {
            const kind = vVariant(f.action);
            actions.push({
              // `#force_` is the variant's name; "force" is what the JSON
              // calls it and what the colours below are keyed on.
              kind: kind ? (kind.name === "force_" ? "force" : kind.name) : "",
              from: vStr(f.from),
              to: vStr(f.to),
            });
          }
        }
        return { shapes, links, actions };
      };

      /// Everything a mounted scene owns, so it can be given back.
      let mounted = null;

      const disposeScene = () => {
        if (!mounted) return;
        cancelAnimationFrame(mounted.frame);
        mounted.observer.disconnect();
        mounted.controls.dispose();
        for (const g of mounted.geometries) g.dispose();
        for (const m of mounted.materials) m.dispose();
        for (const t of mounted.textures) t.dispose();
        mounted.renderer.dispose();
        // Everything this scene put in the host, not just the canvas: a hint
        // left behind would sit under the next scene describing the last one.
        mounted.renderer.domElement.remove();
        mounted.hint.remove();
        mounted = null;
      };

      const mountObjects = async (list) => {
        const { shapes, links, actions } = readObjects(list);
        if (!shapes.length && !links.length && !actions.length) {
          disposeScene();
          return false;
        }
        const { THREE, OrbitControls } = await loadThree();
        disposeScene();

        const host = $("viewport");
        const width = host.clientWidth || 600;
        const height = host.clientHeight || 400;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x08080b);
        const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        renderer.setSize(width, height);
        host.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const key = new THREE.DirectionalLight(0xffffff, 0.8);
        key.position.set(4, 8, 6);
        scene.add(key);

        const geometries = [], materials = [], textures = [];
        // The replayground's own dimension, so a scene laid out for it reads
        // at the same scale here.
        const BoxDim = 0.33;
        const boxGeo = new THREE.BoxGeometry(BoxDim, BoxDim, BoxDim);
        const orbGeo = new THREE.SphereGeometry(BoxDim / 2, 20, 14);
        const dotGeo = new THREE.SphereGeometry(0.03, 10, 8);
        geometries.push(boxGeo, orbGeo, dotGeo);

        /// Text as a texture, the way the replayground does it: draw the
        /// lines onto a canvas and hand the canvas to a plane. There is no
        /// text in three.js itself, and a plane per label costs less than a
        /// font loader.
        const textTexture = (text) => {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          const fontSize = 48, lineHeight = fontSize * 1.2, pad = 20;
          const lines = String(text).split("\n");
          ctx.font = `${fontSize}px monospace`;
          const width = Math.max(1, ...lines.map((l) => ctx.measureText(l).width));
          canvas.width = width + pad * 2;
          canvas.height = lineHeight * lines.length + pad * 2;
          ctx.font = `${fontSize}px monospace`;
          ctx.fillStyle = "#d4d4d4";
          lines.forEach((l, i) => {
            ctx.fillText(l, pad, pad + (i + 1) * lineHeight - (lineHeight - fontSize));
          });
          const texture = new THREE.CanvasTexture(canvas);
          texture.minFilter = THREE.LinearFilter;
          textures.push(texture);
          return { texture, aspect: canvas.height / canvas.width };
        };

        /// A plane carrying that texture, placed relative to an object.
        const textPlane = (text, anchor, size) => {
          if (!text) return;
          const { texture, aspect } = textTexture(text);
          const geo = new THREE.PlaneGeometry(size, size * aspect);
          const mat = new THREE.MeshBasicMaterial({
            map: texture, transparent: true, alphaTest: 0.05, depthWrite: false,
          });
          geometries.push(geo);
          materials.push(mat);
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.copy(anchor);
          scene.add(mesh);
          return mesh;
        };
        // The replayground's own colours, so a scene laid out for it looks
        // like itself here: a box and a pointer share one green
        // (`color.box`, `color.pointer`), and an orb is the blue that
        // `createOrb` gives it. These had been swapped, with the pointers
        // grey, which made every scene read as the negative of the same one
        // drawn there.
        const boxMat = new THREE.MeshLambertMaterial({ color: 0x55aa44 });
        const orbMat = new THREE.MeshLambertMaterial({ color: 0x4488aa });
        const lineMat = new THREE.LineBasicMaterial({ color: 0x55aa44 });
        materials.push(boxMat, orbMat, lineMat);

        const at = new Map();       // label -> the object's position
        const dots = new Map();     // "label:field" -> where a pointer leaves
        const box = new THREE.Box3();
        const dotMat = new THREE.MeshLambertMaterial({ color: 0xbdbdc6 });
        materials.push(dotMat);

        for (const sh of shapes) {
          const mesh = new THREE.Mesh(
            sh.kind === "box" ? boxGeo : orbGeo,
            sh.kind === "box" ? boxMat : orbMat
          );
          mesh.position.set(sh.at[0], sh.at[1], sh.at[2]);
          mesh.userData.label = sh.label;
          scene.add(mesh);
          at.set(sh.label, mesh.position);
          box.expandByPoint(mesh.position);

          // The label, up and to the left; the fields, to the right. The same
          // offsets the replayground uses, so a scene sits the same way.
          textPlane(
            sh.label,
            mesh.position.clone().add(new THREE.Vector3(-0.17, 0.17, BoxDim)),
            0.7
          );
          textPlane(
            sh.text,
            mesh.position.clone().add(new THREE.Vector3(0.37, 0, BoxDim)),
            0.5
          );

          const spacing = 0.1;
          const startX = mesh.position.x - ((sh.fields.length - 1) * spacing) / 2;
          sh.fields.forEach((name, i) => {
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.position.set(startX + i * spacing, mesh.position.y - 0.17, mesh.position.z);
            scene.add(dot);
            dots.set(sh.label + ":" + name, dot.position);
          });
        }

        for (const link of links) {
          // From the named slot if there is one, else from the object itself.
          const a = dots.get(link.from) || at.get(link.from);
          const b = at.get(link.to);
          if (!a || !b) continue;
          const to = b.clone().add(new THREE.Vector3(0, BoxDim / 2, 0));
          const geo = new THREE.BufferGeometry().setFromPoints([a.clone(), to]);
          geometries.push(geo);
          scene.add(new THREE.Line(geo, lineMat));
        }

        // Action edges: what the computation did, rather than what it points
        // at. A shaft from source to target with a head that says which
        // action it was -- a cone for a get or a force, two cones back to
        // back for a put, since a put is a get's opposite. Colours, radii and
        // the hover offset follow `createActionMesh` in the replayground.
        const ACTION_COLOUR = { put: 0x008877, putForce: 0xaaaaaa };
        const actionMat = new Map();
        const materialFor = (kind) => {
          if (!actionMat.has(kind)) {
            const heavy = kind === "force" || kind === "putForce";
            const mat = new THREE.MeshLambertMaterial({
              color: ACTION_COLOUR[kind] || 0x0088aa,
              transparent: true,
              opacity: heavy ? 0.6 : 0.8,
            });
            materials.push(mat);
            actionMat.set(kind, mat);
          }
          return actionMat.get(kind);
        };
        const UP = new THREE.Vector3(0, 1, 0);
        const hoverOffset = -BoxDim;

        for (const act of actions) {
          const a = dots.get(act.from) || at.get(act.from);
          const b = at.get(act.to);
          if (!a || !b) continue;
          const dir = new THREE.Vector3().subVectors(b, a);
          const length = dir.length();
          if (length < 1e-6) continue;
          dir.normalize();
          const mat = materialFor(act.kind);
          const heavy = act.kind === "force" || act.kind === "putForce";

          const shaftLength = Math.max(0.001, length + hoverOffset * 1.6);
          const shaftGeo = new THREE.CylinderGeometry(
            heavy ? 0.1 : 0.03, heavy ? 0.1 : 0.03, shaftLength, 10
          );
          geometries.push(shaftGeo);
          const head = b.clone().addScaledVector(dir, hoverOffset);
          const shaft = new THREE.Mesh(shaftGeo, mat);
