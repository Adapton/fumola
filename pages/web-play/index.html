<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fumola — web play</title>
    <meta name="description" content="Write Fumola in the browser, with the library beside you. Highlighted by the language's own lexer.">
    <style>
      /* The palette is the Fumola VS Code theme's, the same one the homepage
         uses, and the token kinds below map onto its scopes. */
      :root {
        --bg:     #000000;
        --panel:  #0b0b0d;
        --rule:   #212124;
        --fg:     #d4d4d4;
        --dim:    #7d7d82;

        --green:  #6A9955;
        --blue:   #569CD6;
        --pink:   #C586C0;
        --type:   #a989d0;
        --sym:    #a086a5;
        --op:     #9999dd;
        --eff:    #ffaaaa;
        --str:    #c87e60;
        --var:    #f6ead2;

        --ui:   system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                "Liberation Mono", "DejaVu Sans Mono", monospace;
      }

      * { box-sizing: border-box; }
      /* One knob, as on the homepage: everything below is in rem, so the
         whole app grows on a large screen instead of sitting small. The floor
         is a little above the homepage's, because this is a working surface
         rather than prose and was too small to read at no zoom. */
      html {
        height: 100%;
        font-size: clamp(17px, 12px + 0.55vw, 23px);
      }
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 400 0.95rem/1.5 var(--ui);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;           /* each pane scrolls on its own */
      }
      a { color: var(--blue); text-decoration: none; }
      a:hover { color: #7db6e8; }

      /* ---- frame ------------------------------------------------------- */

      .shell { display: flex; flex-direction: column; height: 100%; }

      .bar {
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.55rem 0.9rem;
        border-bottom: 1px solid var(--rule);
        font: 400 0.8rem/1 var(--mono);
        color: var(--dim);
        flex: 0 0 auto;
      }
      .bar .here { color: var(--var); }
      .bar .spacer { flex: 1; }
      .bar label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
      .bar input { accent-color: var(--blue); margin: 0; }
      #status { color: var(--dim); }

      .panes { flex: 1; display: flex; min-height: 0; }

      /* The pane width lives in a variable so the drag handle and the snap
         buttons are setting the same thing. */
      .shell { --lib-w: 26rem; }

      /* ---- the library, on the left ------------------------------------ */

      .library {
        /* Only this pane's text. The editor is deliberately larger and is
           left alone by the controls in the header. */
        --lib-font: 0.84rem;
        flex: 0 0 var(--lib-w);
        display: flex; flex-direction: column;
        border-right: 1px solid var(--rule);
        /* Both needed. A flex item's min-width defaults to its content, and
           the source below is a <pre> with long lines, so without this the
           pane refuses to shrink to its basis and squeezes the editor out. */
        min-width: 0; min-height: 0;
        background: var(--panel);
      }
      .lib-head {
        display: flex; align-items: center; gap: 0.5rem;
        padding: 0.5rem 0.7rem;
        font: 400 0.72rem/1 var(--mono);
        letter-spacing: 0.1em; text-transform: uppercase;
        color: var(--dim);
        border-bottom: 1px solid var(--rule);
        flex: 0 0 auto;
      }
      .lib-head .snaps { margin-left: auto; display: flex; gap: 0.3rem; }
      .lib-head button {
        background: none; border: 1px solid var(--rule); border-radius: 2px;
        color: var(--dim); cursor: pointer;
        font: 400 0.68rem/1 var(--mono);
        letter-spacing: 0.06em; text-transform: none;
        padding: 0.25rem 0.45rem;
      }
      .lib-head button:hover { color: var(--var); border-color: #3a3a40; }

      /* The drag handle. Wider than it looks, so it is easy to grab. */
      .grip {
        flex: 0 0 7px;
        margin: 0 -3px;              /* overlap the border, keep the layout */
        cursor: col-resize;
        background: transparent;
        position: relative; z-index: 2;
      }
      .grip:hover, .grip.dragging { background: #2b3f52; }
      body.dragging { cursor: col-resize; user-select: none; }
      /* While dragging, the textarea must not swallow the pointer. */
      body.dragging .editor > textarea { pointer-events: none; }

      /* When the library is shut, a thin way back. */
      .reopen {
        flex: 0 0 auto;
        writing-mode: vertical-rl;
        background: var(--panel); border: 0; border-right: 1px solid var(--rule);
        color: var(--dim); cursor: pointer;
        font: 400 0.7rem/1 var(--mono);
        letter-spacing: 0.1em; padding: 0.8rem 0.35rem;
      }
      .reopen:hover { color: var(--var); }
      /* With nothing open the outline has the pane to itself. Once a module
         is showing it takes half, and it can be shut entirely -- reading a
         file is the common case, and the outline is only in the way then. */
      #modules {
        list-style: none; margin: 0; padding: 0.35rem 0;
        overflow-y: auto;
        flex: 1 1 auto; min-height: 0;
        border-bottom: 1px solid var(--rule);
      }
      .library.has-source #modules { flex: 0 0 var(--outline-h, 50%); }
      /* Drag this to give either the outline or the source the whole pane. */
      .hgrip {
        flex: 0 0 7px; margin: -3px 0;
        cursor: row-resize; background: transparent;
        position: relative; z-index: 2;
      }
      .hgrip:hover, .hgrip.dragging { background: #2b3f52; }
      .library:not(.has-source) .hgrip,
      .library[data-outline="closed"] .hgrip,
      .library[data-view="events"] .hgrip,
      .library[data-view="print"] .hgrip { display: none; }
      body.dragging-v { cursor: row-resize; user-select: none; }
      .library[data-outline="closed"] #modules { display: none; }

      .views { display: flex; gap: 0.25rem; }
      .view-tab[aria-current="true"] { color: var(--var); border-color: #3a3a40; }
      /* Lit while the panel has something in it, so a program that prints
         says so even when the outline is the view in front. */
      .view-tab.has-output { color: var(--green); border-color: #3a4a3a; }
      .view-tab.has-output::after { content: " \2022"; }

      /* Only one of the three shows at a time. */
      .library[data-view="events"] #modules,
      .library[data-view="events"] .source,
      .library[data-view="events"] .outline-toggle,
      .library[data-view="print"] #modules,
      .library[data-view="print"] .source,
      .library[data-view="print"] .outline-toggle { display: none; }
      .library[data-view="outline"] .events,
      .library[data-view="print"] .events { display: none; }
      .library[data-view="outline"] .print,
      .library[data-view="events"] .print { display: none; }

      .print { flex: 1; min-height: 0; overflow: auto; }
      .print ol {
        margin: 0; padding: 0.4rem 0.6rem 0.4rem 3.2rem; list-style: decimal;
      }
      .print li {
        font: 400 var(--lib-font)/1.5 var(--mono);
        color: var(--fg); padding: 0.1rem 0; white-space: pre-wrap;
        word-break: break-word; tab-size: 4;
      }
      .print li::marker { color: var(--dim); font-size: 0.85em; }
      /* Each run is a block, so a program that printed twice reads as two
         runs rather than one long list. */
      .print li.run-start { border-top: 1px solid var(--rule); margin-top: 0.35rem;
        padding-top: 0.45rem; }

      .events { flex: 1; min-height: 0; overflow: auto; }
      .events table { width: 100%; border-collapse: collapse; }
      .events td {
        font: 400 var(--lib-font)/1.5 var(--mono);
        padding: 0.15rem 0.5rem;
        vertical-align: baseline;
      }
      /* One band per meta-time, alternating -- so a group of events that
         happened at the same moment reads as one block. */
      .events tr.band0 td { background: #0d0d11; }
      .events tr.band1 td { background: #16161c; }
      .events td.mt {
        text-align: right; color: var(--dim);
        width: 3.5em; white-space: nowrap;
        border-right: 1px solid var(--rule);
      }
      .events td.ev { white-space: pre-wrap; word-break: break-word; }

      .outline-toggle::before {
        content: "\25be";           /* a caret, turned when shut */
        display: inline-block;
        margin-right: 0.35rem;
        transition: transform 0.12s;
      }
      .library[data-outline="closed"] .outline-toggle::before {
        transform: rotate(-90deg);
      }
      /* A line of its own. Three view tabs, the outline toggle and six
         sizing buttons already fill the row above, and a path is the one
         thing there that has no fixed width -- squeezed in beside them it
         was the first thing to be cut to an ellipsis. */
      .lib-path {
        padding: 0.4rem 0.7rem;
        border-bottom: 1px solid var(--rule);
        flex: 0 0 auto;
        min-width: 0;
      }
      /* Only once a file is open; there is nothing to name before that, and
         an empty strip would just be a second border. */
      .library:not(.has-source) .lib-path,
      .library[data-view="events"] .lib-path,
      .library[data-view="print"] .lib-path { display: none; }
      .current {
        display: block;
        font: 400 0.78rem/1.2 var(--mono);
        color: var(--sym);
        text-transform: none; letter-spacing: 0;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        direction: rtl; text-align: left;      /* keep the filename when it clips */
      }
      #modules ul { list-style: none; margin: 0; padding: 0; }
      /* The tests are a second library, and the one you come here to use, so
         they are set off from the modules and sized up a step. The tinted
         ground is the same idea as the two-tone event rows: it says "this
         part is different" without a heading to explain it. */
      #modules .tests-root {
        border-top: 1px solid var(--rule);
        margin-top: 0.5rem;
        padding-top: 0.35rem;
        background: #101017;
      }
      /* Only the heading is larger. The tree under it matches the modules
         above, so the two read as the same kind of thing; the tone is what
         separates them. */
      #modules .tests-root > .dir {
        font-size: calc(var(--lib-font) * 1.3);
        color: var(--green);
        padding-bottom: 0.15rem;
      }
      #modules .tests-root button { color: var(--fg); }
      #modules .tests-root button:hover { color: var(--var); }
      #modules .dir {
        padding: 0.24rem 0.9rem;
        font: 400 var(--lib-font)/1.5 var(--mono);
        color: var(--sym);
      }
      #modules button {
        display: block; width: 100%; text-align: left;
        background: none; border: 0; cursor: pointer;
        padding: 0.24rem 0.9rem;
        font: 400 var(--lib-font)/1.5 var(--mono);
        color: var(--dim);
      }
      #modules button:hover { color: var(--var); }
      #modules button[aria-current="true"] { color: var(--blue); }

      .source { flex: 1; min-width: 0; min-height: 0; overflow: auto; }
      /* The gutter and the code are one row so they share a scroll, and the
         gutter sticks to the left so a long line scrolls under it rather than
         taking the numbers with it. `min-width: max-content` keeps the row as
         wide as its widest line, which is what gives the sticky gutter
         something to stick against. */
      .code-lines { display: flex; align-items: flex-start; min-width: max-content; }
      .source pre {
        margin: 0; padding: 0.9rem;
        font: 400 var(--lib-font)/1.6 var(--mono);
        white-space: pre; color: var(--fg);
      }
      .gutter {
        position: sticky; left: 0; z-index: 1;
        padding-right: 0.7rem !important;
        color: var(--dim); text-align: right;
        user-select: none; -webkit-user-select: none;
        background: var(--panel);
        border-right: 1px solid var(--rule);
      }
      /* An attribute reads as one annotation, delimiters included. */
      .at { color: var(--pink); }
      /* A `#[test]` in the source runs it, like its entry in the tree. It is
         still an attribute, so it keeps the attribute's colour and adds only
         the affordance. */
      .run-here {
        font: inherit; color: var(--pink); font-style: normal;
        background: none; border: 0; padding: 0; cursor: pointer;
        border-bottom: 1px dotted #6b4a68;
      }
      .run-here:hover { color: var(--var); border-bottom-color: var(--var); }
      .run-here[aria-current="true"] { color: var(--var); background: #2a1c29; }
      .body-here {
        font: inherit; font-size: 0.85em; font-style: normal;
        color: var(--dim); background: none; cursor: pointer;
        border: 1px solid var(--rule); border-radius: 2px;
        padding: 0 0.3em; margin-left: 0.5em;
      }
      .body-here:hover { color: var(--var); border-color: #3a3a40; }

      .source .empty { padding: 0.9rem; color: var(--dim); font: italic 0.85rem/1.5 var(--ui); }

      /* ---- the editor, on the right ------------------------------------ */

      .work { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

      .editor { position: relative; flex: 1; min-height: 0; }
      /* The highlighted layer and the textarea are stacked and must agree on
         every metric, or the coloured text drifts away from the caret.
         
         `pre`, not `pre-wrap`: soft wrapping was the drift. The highlighted
         layer is one span per token, and a break inside a word is decided
         per inline box, so a long line wrapped in a different place there
         than in the textarea over it -- one line's worth of offset, and
         every line below it inherited the error. Not wrapping at all is the
         only way the two can be relied on to agree. Long lines scroll
         sideways instead, both layers together. */
      .editor > pre,
      .editor > textarea {
        position: absolute; inset: 0;
        margin: 0; padding: 1rem;
        border: 0;
        font: 400 0.92rem/1.65 var(--mono);
        white-space: pre;
        overflow: auto;
        tab-size: 2;
      }
      .editor > pre { pointer-events: none; color: var(--fg); background: var(--bg); }
      /* The browser's own stylesheet sets `code { font-family: monospace }`,
         which beats what `pre` inherits down -- so the highlighted layer was
         drawn in a different typeface from the textarea over it, at the same
         size, and every character was a slightly different width. The caret
         drifted further from its text the further along a line it went. */
      .editor > pre > code { font: inherit; letter-spacing: inherit; }
      .editor > textarea {
        color: transparent;
        background: transparent;
        caret-color: var(--var);
        resize: none; outline: none;
      }
      .editor > textarea::selection { background: #2a3f55; color: transparent; }
      /* The line an error stopped on. Behind both layers, so the text and the
         caret sit on top of it. */
      .rowmark {
        position: absolute; left: 0; right: 0; height: 0;
        background: #3a1c1c; border-left: 2px solid var(--eff);
        pointer-events: none; z-index: 0;
      }

      .out {
        flex: 0 0 auto;
        max-height: 40%;
        overflow: auto;
        border-top: 1px solid var(--rule);
        padding: 0.8rem 1rem;
        font: 400 0.9rem/1.6 var(--mono);
        white-space: pre-wrap;
        word-break: break-word;
        background: var(--panel);
        min-height: 3.2rem;
      }
      .out .tag { color: var(--type); }
      .out .err { color: var(--eff); }
      .out .waiting { color: var(--dim); font-style: italic; }
      .out.stale { opacity: 0.45; }

      /* ---- token colours, from the theme -------------------------------- */

      .c   { color: var(--green); font-style: italic; }
      .k   { color: var(--blue);  font-weight: 600; }
      .t   { color: var(--type);  font-weight: 600; }
      .sy  { color: var(--sym);   font-weight: 600; }
      .o   { color: var(--op); }
      .eff { color: var(--eff); }
      .st  { color: var(--str); }
      .v   { color: var(--var); }
      .tg  { color: #a586a5; font-weight: 600; }

      @media (max-width: 52rem) {
        .panes { flex-direction: column; }
        .library { flex: 0 0 40%; border-right: 0; border-bottom: 1px solid var(--rule); }
        #modules { max-height: 45%; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="bar">
        <a class="home" href="/">fumola</a>
        <span>/</span>
        <span class="here">web play</span>
        <span class="spacer"></span>
        <label title="Keep the graph and the top-level bindings between runs, so an edit repairs what the last one built. Off, each run starts from the instance as it was before anything ran.">
          <input type="checkbox" id="persist"> keep state between runs
        </label>
        <span id="status">starting the runtime…</span>
      </header>

      <div class="panes">
        <aside class="library">
          <div class="lib-head">
            <span class="views">
              <button type="button" class="view-tab" data-view="outline">library</button>
              <button type="button" class="view-tab" data-view="events">events</button>
              <button type="button" class="view-tab" data-view="print">print</button>
            </span>
            <button type="button" id="outline-toggle" class="outline-toggle"
                    aria-expanded="true" title="Show or hide the outline"></button>
            <span class="snaps">
              <button type="button" id="lib-smaller" title="Smaller library text">A&minus;</button>
              <button type="button" id="lib-default" title="Default library text size">A0</button>
              <button type="button" id="lib-bigger"  title="Larger library text">A+</button>
              <button type="button" data-snap="full"  title="Fill the window">full</button>
              <button type="button" data-snap="half"  title="Half the window">half</button>
              <button type="button" data-snap="close" title="Hide the library">hide</button>
            </span>
          </div>
          <div class="lib-path"><span class="current" id="current"></span></div>
          <ul id="modules"></ul>
          <div class="hgrip" id="hgrip" role="separator" aria-orientation="horizontal"
               aria-label="Resize the outline"></div>
          <div class="source" id="source">
            <div class="empty">Pick a module to read its source.</div>
          </div>
          <div class="events" id="events">
            <table><tbody id="events-body"></tbody></table>
            <div class="empty" id="events-empty">No events yet.</div>
          </div>
          <div class="print" id="print">
            <ol id="print-body"></ol>
            <div class="empty" id="print-empty">
              Nothing printed yet. Call <code>print("hello")</code>, or
              <code>print</code> any value, and it appears here.
            </div>
          </div>
        </aside>
        <div class="grip" id="grip" role="separator" aria-orientation="vertical"
             aria-label="Resize the library"></div>
        <button class="reopen" id="reopen" hidden>navigation &middot; library, tests, events, print</button>

        <section class="work">
          <div class="editor">
            <pre aria-hidden="true"><code id="hl"></code></pre>
            <textarea id="src" spellcheck="false" autocapitalize="off"
              autocorrect="off" aria-label="Fumola program"></textarea>
          </div>
          <div class="out" id="out"></div>
        </section>
      </div>
    </div>

    <script type="module">
      import init, {
        fumola_ensure_mode,
        fumola_eval_top,
        fumola_reset,
        fumola_tokens,
        fumola_modules,
        fumola_module_source,
      } from "../fumola_wasm.js";

      const $ = (id) => document.getElementById(id);
      const rowEl = document.createElement("div");
      rowEl.className = "rowmark";
      rowEl.hidden = true;

      const srcEl = $("src"), hlEl = $("hl"), outEl = $("out"),
            statusEl = $("status"), persistEl = $("persist"),
            preEl = hlEl.parentElement;
      // Behind both layers: first child of .editor, which is the positioned
      // ancestor the mark is placed against.
      preEl.parentElement.insertBefore(rowEl, preEl);

      // This page owns the runtime, so a fixed id is enough.
      const REPL_INSTANCE = 1;

      const START = "`n := 21;\nforce(`double := thunk { get(`n) * 2 })";

      // ---- highlighting -------------------------------------------------
      // The kinds come from the language's own lexer, so there is no grammar
      // here to fall out of step with it.
      const CLASS = {
        comment: "c", keyword: "k", type: "t", symbol: "sy",
        effect: "eff", operator: "o", literal: "st", ident: "v",
        variant: "tg",
      };
      const esc = (s) =>
        s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

      /// The spans of `#[...]` attributes, start offset -> end offset.
      ///
      /// An attribute is metadata about the declaration under it, and reads
      /// best as one thing: `#[derive(Compare)]` coloured in three pieces --
      /// delimiters, name, argument -- makes the reader assemble it. This
      /// goes past what the VSCode grammar does deliberately.
      ///
      /// `#` is also Fumola's concatenation operator, so `xs # [1, 2]` would
      /// look identical to an attribute token by token. Two things separate
      /// them, and both are needed: an attribute writes `#[` with nothing
      /// between, and it begins a declaration, so what precedes it is `;`,
      /// `{`, `}`, or the start of the file. Concatenation is preceded by the
      /// expression it is concatenating. Starting a line is not enough on its
      /// own -- levelTree really does contain
      ///     objectFromEdge(label_, "putA", n.edges[1])
      ///     # [ objectFromEdge(label_, "putB", n.edges[3]), ... ]
      /// which is a concatenation at the head of a line.
      const attrRanges = (source, tokens) => {
        const out = new Map();
        const t = tokens.filter((x) => x.kind !== "space" && x.kind !== "comment");
        const at = (i) => (t[i] ? source.slice(t[i].start, t[i].start + t[i].len) : "");
        const OPENS = [";", "{", "}"];
        for (let i = 0; i < t.length; i += 1) {
          if (at(i) !== "#" || at(i + 1) !== "[") continue;
          // `#[`, not `# [`.
          if (t[i + 1].start !== t[i].start + t[i].len) continue;
          // and at the head of a declaration, not after an operand.
          if (i > 0 && !OPENS.includes(at(i - 1))) continue;
          let depth = 0;
          for (let j = i + 1; j < t.length; j += 1) {
            const w = at(j);
            if (w === "[") depth += 1;
            else if (w === "]") {
              depth -= 1;
              if (depth === 0) { out.set(t[i].start, t[j].start + t[j].len); break; }
            }
          }
        }
        return out;
      };

      // `marks` maps a start offset to {end, index}: that range is wrapped in
      // a button rather than coloured, so a `#[test]` in the source can be
      // clicked the same way its entry in the tree can.
      const highlight = (text, marks) => {
        let reply;
        try { reply = JSON.parse(fumola_tokens(text)); } catch (e) { return esc(text); }
        if (!reply.ok) return esc(text);
        const attrs = attrRanges(text, reply.tokens);
        let html = "", at = 0;
        for (const t of reply.tokens) {
          if (t.start > at) html += esc(text.slice(at, t.start));
          if (at > t.start) continue;               // inside a mark already emitted
          const mark = marks && marks.get(t.start);
          if (mark) {
            html += `<button class="run-here" data-test="${mark.index}" ` +
                    `title="Run this test">${esc(text.slice(t.start, mark.end))}</button>` +
                    `<button class="body-here" data-test="${mark.index}" ` +
                    `title="Put this test's code in the editor">body</button>`;
            at = mark.end;
            continue;
          }
          // An attribute is emitted whole, so `#[`, its name, its arguments
          // and `]` all read as the one annotation they are.
          const attrEnd = attrs.get(t.start);
          if (attrEnd !== undefined) {
            html += `<span class="at">${esc(text.slice(t.start, attrEnd))}</span>`;
            at = attrEnd;
            continue;
          }
          const body = esc(text.slice(t.start, t.start + t.len));
          const cls = CLASS[t.kind];
          html += cls ? `<span class="${cls}">${body}</span>` : body;
          at = t.start + t.len;
        }
        if (at < text.length) html += esc(text.slice(at));
        // A <pre> swallows one trailing newline; without this the last line
        // of the highlight sits one line above the caret.
        return html + "\n";
      };

      /// Both layers are scrollable and only one of them is scrolled by
      /// typing, so the highlighted text has to be told where the caret went.
      /// Without this the whole layer sits at the top while the textarea
      /// moves down it -- the drift is the scroll distance, which is why it
      /// only showed up once programs were longer than the box.
      const syncScroll = () => {
        preEl.scrollTop = srcEl.scrollTop;
        preEl.scrollLeft = srcEl.scrollLeft;
        placeRowMark();
      };

      /// Put a band behind the line an error stopped on.
      ///
      /// Both layers are `white-space: pre` and neither wraps, so line N is
      /// always the same distance down and the band can be positioned by
      /// arithmetic rather than by measuring the text.
      let markedLine = 0;
      const placeRowMark = () => {
        if (!markedLine) { rowEl.hidden = true; return; }
        const style = getComputedStyle(srcEl);
        const lh = parseFloat(style.lineHeight);
        const top = parseFloat(style.paddingTop);
        rowEl.style.height = `${lh}px`;
        rowEl.style.top = `${top + (markedLine - 1) * lh - srcEl.scrollTop}px`;
        rowEl.hidden = false;
      };

      const markLine = (line) => { markedLine = line || 0; placeRowMark(); };

      /// The innermost frame that is in the program, if any is.
      ///
      /// A frame carries a line and a byte span but not a file, so the runtime
      /// cannot say whether it is in what was just typed or in a library
      /// module that was called. This can: a frame reaching past the end of
      /// the program is not in the program. Frames arrive innermost first, so
      /// the first that fits is the nearest place in the program to where it
      /// actually stopped -- which is the line worth pointing at even when the
      /// failure itself happened further in.
      const frameInProgram = (frames, text) => {
        if (!Array.isArray(frames)) return null;
        const bytes = new TextEncoder().encode(text).length;
        const lines = text.split("\n").length;
        return (
          frames.find(
            (f) => f && f.end <= bytes && f.line >= 1 && f.line <= lines
          ) || null
        );
      };

      const paint = () => {
        if (!ready) { hlEl.textContent = srcEl.value; return; }
        hlEl.innerHTML = highlight(srcEl.value);
        // Replacing the content resets the layer's own scroll.
        syncScroll();
      };

      // ---- the runtime, fetched on first use ----------------------------
      let ready = false, instance = null, starting = null;
      const ensureRuntime = () => {
        if (starting) return starting;
        statusEl.textContent = "starting the runtime…";
        starting = init()
          .then(() => {
            // Graphical throughout, and built that way rather than created
            // simple and switched. Simple is the wasm default because Hazel
            // has a re-evaluation semantics of its own to compose with;
            // presenting Fumola on its own, that caution only gets in the
            // way, and library code written for Fumola's own default failed
            // under it. ensure_mode creates the instance if the id is free,
            // so this is one build, not two.
            instance = REPL_INSTANCE;
            fumola_ensure_mode(instance, "graphical");
            ready = true;
            listModules();
            paint();          // the first paint was plain: the lexer is here now
            note();
            evaluate();       // show the starter program's answer straight away
          })
          .catch((e) => {
            statusEl.textContent = "the runtime could not be loaded";
            starting = null;
            throw e;
          });
        return starting;
      };
      const note = () => {
        statusEl.textContent = persistEl.checked
          ? `instance ${instance} · graphical · state kept`
          : `instance ${instance} · graphical · clean store each run`;
      };

      // ---- the library --------------------------------------------------
      // A module's public tests, found in its own token stream: the sequence
      // # [ test ] public func NAME, ignoring whitespace. Only public ones,
      // since a private test cannot be called from outside its module -- 17
      // of the library's 29 are public.
      //
      // Lexical rather than semantic. The VM builds an authoritative suite
      // when a module is imported (TestSuiteItem carries the file, the
      // visibility and the function), which would be the better source if
      // this ever needs to be exact.
      const testsIn = (source) => {
        let reply;
        try { reply = JSON.parse(fumola_tokens(source)); } catch (e) { return []; }
        if (!reply.ok) return [];
        const t = reply.tokens.filter((x) => x.kind !== "space" && x.kind !== "comment");
        const text = (i) => (t[i] ? source.slice(t[i].start, t[i].start + t[i].len) : "");

        const found = [];
        const scopes = [];        // enclosing `public module NAME`, innermost last
        let depth = 0, pending = null;

        for (let i = 0; i < t.length; i++) {
          const w = text(i);
          if (w === "{") {
            depth += 1;
            if (pending !== null) { scopes.push({ depth, name: pending }); pending = null; }
            continue;
          }
          if (w === "}") {
            while (scopes.length && scopes[scopes.length - 1].depth >= depth) scopes.pop();
            depth -= 1;
            continue;
          }
          // `public module NAME {` -- the name is a type token when it is
          // capitalised, which it usually is.
          if (w === "public" && text(i + 1) === "module" &&
              t[i + 2] && (t[i + 2].kind === "ident" || t[i + 2].kind === "type")) {
            pending = text(i + 2);
            continue;
          }
          // `#[test] public func NAME`
          if (w === "#" && text(i + 1) === "[" && text(i + 2) === "test" &&
              text(i + 3) === "]" && text(i + 4) === "public" &&
              text(i + 5) === "func" && t[i + 6] && t[i + 6].kind === "ident") {
            found.push({
              name: text(i + 6),
              // A test inside `public module EditTest` is reached through it.
              scope: scopes.map((sc) => sc.name).join("."),
              // Where `#[test]` sits, so the source view can make it a link.
              start: t[i].start,
              end: t[i + 3].start + t[i + 3].len,
              // And where its body is, so the source view can hand it over
              // to be edited. Found by matching braces from the first `{`
              // after the signature.
              body: bodyRange(t, text, i + 6),
            });
          }
        }
        return found;
      };

      /// The span inside the braces of the function whose name is at `from`.
      const bodyRange = (t, text, from) => {
        let j = from;
        while (j < t.length && text(j) !== "{") j += 1;
        if (j >= t.length) return null;
        let depth = 0;
        for (let k = j; k < t.length; k += 1) {
          const w = text(k);
          if (w === "{") depth += 1;
          else if (w === "}") {
            depth -= 1;
            if (depth === 0) {
              return { start: t[j].start + 1, end: t[k].start };
            }
          }
        }
        return null;
      };

      /// Every `public` binding, with the module scope it sits in.
      const exportsOf = (source) => {
        let reply;
        try { reply = JSON.parse(fumola_tokens(source)); } catch (e) { return []; }
        if (!reply.ok) return [];
        const t = reply.tokens.filter((x) => x.kind !== "space" && x.kind !== "comment");
        const text = (i) => (t[i] ? source.slice(t[i].start, t[i].start + t[i].len) : "");
        const out = [];
        const scopes = [];
        let depth = 0, pending = null;
        for (let i = 0; i < t.length; i += 1) {
          const w = text(i);
          if (w === "{") {
            depth += 1;
            if (pending !== null) { scopes.push({ depth, name: pending }); pending = null; }
            continue;
          }
          if (w === "}") {
            while (scopes.length && scopes[scopes.length - 1].depth >= depth) scopes.pop();
            depth -= 1;
            continue;
          }
          if (w !== "public") continue;
          const kind = text(i + 1);
          if (!["func", "module", "let", "var", "type"].includes(kind)) continue;
          out.push({ name: text(i + 2), scope: scopes.map((sc) => sc.name).join(".") });
          if (kind === "module") pending = text(i + 2);
        }
        return out;
      };

      /// The module's own imports, as the editor would have to write them.
      /// Every import path in the library is a bare name resolved in the
      /// importing file's directory -- which is what the symlinks under
      /// `fumola/` are working around -- so re-addressing one from the top
      /// level is just putting that directory in front of it.
      const importsOf = (source, path) => {
        const dir = path.replace(/\/[^/]*$/, "");
        const out = [];
        const re = /\bimport\s+([A-Za-z_][A-Za-z0-9_]*)\s+"([^"]*)"/g;
        let m;
        while ((m = re.exec(source)) !== null)
          out.push({ alias: m[1], path: m[2].includes("/") ? m[2] : `${dir}/${m[2]}` });
        return out;
      };

      /// Inside the module, a test calls its neighbours by their bare names.
      /// Outside it, those names are gone, so the pasted body would be red
      /// on arrival. Put the module back in front of the ones that came from
      /// it, and leave everything else -- locals, the prelude, the private
      /// helpers we cannot reach anyway -- untouched.
      const qualify = (body, test, source) => {
        const all = exportsOf(source);
        const prefix = new Map();
        for (const e of all) if (!e.scope) prefix.set(e.name, "M.");
        // A name in the test's own module is the nearer one, so it wins.
        if (test.scope)
          for (const e of all)
            if (e.scope === test.scope) prefix.set(e.name, `M.${test.scope}.`);
        if (!prefix.size) return { text: body, changed: 0 };

        let reply;
        try { reply = JSON.parse(fumola_tokens(body)); } catch (e) { return { text: body, changed: 0 }; }
        if (!reply.ok) return { text: body, changed: 0 };
        const t = reply.tokens.filter((x) => x.kind !== "space" && x.kind !== "comment");
        const text = (i) => (t[i] ? body.slice(t[i].start, t[i].start + t[i].len) : "");

        // Anything the body binds for itself shadows the module's version --
        // but only from where it binds it. A body that ends with
        //   let sceneObjects = sceneObjects1 # sceneObjects2;
        // still means the module's `sceneObjects` where it calls it further
        // up, and a position-blind scan let that later `let` reach backwards
        // and leave the call unqualified.
        const local = new Map();          // name -> first token index binding it
        const bind = (name, at) => { if (!local.has(name)) local.set(name, at); };
        for (let i = 0; i < t.length; i += 1) {
          const w = text(i);
          if (w === "func" || w === "module") { bind(text(i + 1), i + 1); continue; }
          if (w !== "let" && w !== "var") continue;
          for (let j = i + 1; j < t.length; j += 1) {
            const u = text(j);
            if (u === "=" || u === ";" || u === "in") break;
            if (t[j].kind === "ident") bind(u, j);
          }
        }

        const DECL = ["func", "module", "type", "let", "var", "label", "."];
        let out = "", at = 0, changed = 0;
        for (let i = 0; i < t.length; i += 1) {
          const w = text(i);
          if (t[i].kind !== "ident" && t[i].kind !== "type") continue;
          if (!prefix.has(w)) continue;
          const boundAt = local.get(w);
          if (boundAt !== undefined && boundAt < i) continue;
          if (i > 0 && (DECL.includes(text(i - 1)) || text(i - 1) === "`")) continue;
          if (text(i + 1) === "=") continue;          // a field, or a binding
          out += body.slice(at, t[i].start) + prefix.get(w);
          at = t[i].start;
          changed += 1;
        }
        return { text: out + body.slice(at), changed };
      };

      /// Strip the indentation the body had inside its module.
      const dedent = (block) => {
        const lines = block.replace(/^\n/, "").replace(/\s+$/, "").split("\n");
        const indents = lines
          .filter((l) => l.trim())
          .map((l) => l.match(/^[ \t]*/)[0].length);
        const cut = indents.length ? Math.min(...indents) : 0;
        return lines.map((l) => l.slice(cut)).join("\n");
      };

      // Clicking one writes the call that runs it from outside the module,
      // which is the whole point: the library's authors decide what a visitor
      // finds here, and it arrives ready to run.
      const invocationFor = (path, test) =>
        `import M "${path}";\nM.${test.scope ? test.scope + "." : ""}${test.name}()`;

      const listModules = () => {
        const reply = JSON.parse(fumola_modules());
        if (!reply.ok) return;
        const list = $("modules");
        list.textContent = "";

        // Shared prefixes become shared parents. The `fumola/` prefix is on
        // every module, so it is only noise. Symlinked copies are skipped:
        // they exist so a module's neighbours are importable without "../..",
        // not because the file lives there. See Adapton/fumola#55.
        const modules = emptyTree();
        const real = [];
        for (const m of reply.modules) {
          if (m.link) continue;
          real.push(m.path);
          const parts = m.path.replace(/^fumola\//, "").split("/");
          const name = parts.pop();
          place(modules, parts, {
            name,
            title: m.path,
            pick: (b) => showModule(m.path, b),
          });
        }
        renderTree(modules, list, 0);

        // The tests the library offers, in the same shape, so where a test
        // comes from is visible rather than something to look up. A module
        // becomes a directory of its tests.
        const tests = emptyTree();
        let count = 0;
        for (const path of real) {
          const src = JSON.parse(fumola_module_source(path));
          if (!src.ok) continue;
          for (const t of testsIn(src.source)) {
            const dirs = path.replace(/^fumola\//, "").split("/");
            const call = invocationFor(path, t);
            place(tests, dirs, {
              name: (t.scope ? t.scope + "." : "") + t.name,
              title: call.split("\n")[1],
              pick: (b) => {
                // Both halves: run it, and open its module at the marker, so
                // the test can be read as well as run.
                showModule(path, b, t);
                loadTest(path, t);
              },
            });
            count += 1;
          }
        }
        if (!count) return;

        const li = document.createElement("li");
        li.className = "tests-root";
        const label = document.createElement("div");
        label.className = "dir";
        label.textContent = "tests/";
        label.style.paddingLeft = "0.9rem";
        li.appendChild(label);
        const sub = document.createElement("ul");
        renderTree(tests, sub, 1);
        li.appendChild(sub);
        list.appendChild(li);
      };

      // Fully expanded: the library is small enough to take in at a glance,
      // and a fold would only hide it. Leaves carry their own action, so the
      // modules and the tests can share this.
      const renderTree = (node, into, depth) => {
        const indent = (el) => { el.style.paddingLeft = 0.9 + depth * 0.9 + "rem"; };
        const byName = (a, b) => String(a).localeCompare(String(b));

        for (const name of [...node.dirs.keys()].sort(byName)) {
          const li = document.createElement("li");
          const label = document.createElement("div");
          label.className = "dir";
          label.textContent = name + "/";
          indent(label);
          li.appendChild(label);
          const sub = document.createElement("ul");
          renderTree(node.dirs.get(name), sub, depth + 1);
          li.appendChild(sub);
          into.appendChild(li);
        }
        for (const f of node.files.sort((a, b) => byName(a.name, b.name))) {
          const li = document.createElement("li");
          const b = document.createElement("button");
          b.textContent = f.name;
          if (f.title) b.title = f.title;
          indent(b);
          b.addEventListener("click", () => f.pick(b));
          li.appendChild(b);
          into.appendChild(li);
        }
      };

      /// Insert a leaf at a path of directory names.
      const place = (root, dirs, file) => {
        let node = root;
        for (const d of dirs) {
          if (!node.dirs.has(d)) node.dirs.set(d, { dirs: new Map(), files: [] });
          node = node.dirs.get(d);
        }
        node.files.push(file);
      };
      const emptyTree = () => ({ dirs: new Map(), files: [] });

      // ---- the event log, watched as you edit ---------------------------
      // Asking for the events does not add any -- peekEvents is a read -- so
      // this can refresh on every evaluation without disturbing what it is
      // showing.
      const eventsEl = $("events");
      const refreshEvents = () => {
        if (libEl.dataset.view !== "events" || !ready) return;
        const body = $("events-body");
        const empty = $("events-empty");

        let reply;
        try {
          reply = JSON.parse(fumola_eval_top(instance, "Adapton.peekEvents()"));
        } catch (e) { return; }
        if (!reply.ok || reply.tag !== "List") {
          body.textContent = "";
          empty.hidden = false;
          // A simple-semantics instance keeps no graph to report on.
          empty.textContent = reply.ok ? "No events to show." : reply.error;
          return;
        }

        // Follow the tail, but do not yank the view away from someone who has
        // scrolled up to read.
        const atEnd =
          eventsEl.scrollHeight - eventsEl.scrollTop - eventsEl.clientHeight < 40;

        body.textContent = "";
        let band = 0, lastMeta = null;
        for (const row of reply.value) {
          const fields = row && row.value ? row.value : {};
          const meta = fields.metaTime ? String(fields.metaTime.value) : "";
          if (meta !== lastMeta) { band = 1 - band; lastMeta = meta; }

          const tr = document.createElement("tr");
          tr.className = "band" + band;
          const mt = document.createElement("td");
          mt.className = "mt";
          mt.textContent = meta;
          const ev = document.createElement("td");
          ev.className = "ev";
          ev.innerHTML = highlight(show(fields.event)).replace(/\n$/, "");
          tr.append(mt, ev);
          body.appendChild(tr);
        }
        empty.hidden = reply.value.length > 0;
        empty.textContent = "No events yet.";
        if (atEnd) eventsEl.scrollTop = eventsEl.scrollHeight;
      };

      const setView = (view) => {
        libEl.dataset.view = view;
        // Asking for the outline means wanting to see it. After picking a
        // module the tree is collapsed, and without this the tab looked
        // dead: it switched to a view whose tree was still shut.
        if (view === "outline") setOutline(true);
        for (const t of document.querySelectorAll(".view-tab"))
          t.setAttribute("aria-current", String(t.dataset.view === view));
        if (view === "events") refreshEvents();
      };

      /// Fumola's lexer recognises `\n` and `\t` well enough to know they do
      /// not end a string, but never turns them into the characters they name
      /// -- so a printed line arrives holding a backslash and an `n`. Showing
      /// them as the line break and tab they were written for is a display
      /// convention here, not an unescaping: there is no escaped form in the
      /// value to undo.
      const unescapeText = (line) =>
        line.replace(/\\([nt\\])/g, (_, c) =>
          c === "n" ? "\n" : c === "t" ? "\t" : "\\");

      /// What `prim "print"` wrote during the run that just finished.
      ///
      /// The CLI puts these on stdout, and they are often the whole reason a
      /// test prints at all -- the numbers it is about to assert on. There is
      /// no stdout in a browser, so they come here instead.
      ///
      /// This run's, not every run's. The program is re-evaluated on each
      /// keystroke, so accumulating would add another copy of the same lines
      /// per character typed; what is wanted is what the program prints now.
      const showPrint = (lines) => {
        const body = $("print-body");
        body.textContent = "";
        for (const line of lines || []) {
          const li = document.createElement("li");
          li.textContent = unescapeText(line);
          body.appendChild(li);
        }
        const any = !!(lines && lines.length);
        $("print-empty").hidden = any;
        // Lit exactly while there is something to read, so the tab answers
        // "is there anything in there?" without being opened.
        document
          .querySelector('.view-tab[data-view="print"]')
          .classList.toggle("has-output", any);
      };

      const setOutline = (open) => {
        libEl.dataset.outline = open ? "open" : "closed";
        $("outline-toggle").setAttribute("aria-expanded", String(open));
      };

      // Loading a test is the same action whether it is clicked in the tree
      // or in the source, so both go through here.
      const loadTest = (path, test) => {
        srcEl.value = invocationFor(path, test);
        paint();
        evaluate();
      };

      // The test's own code, ready to change, rather than a call to it. The
      // import comes too, since the body will lean on the module's names --
      // and where it leans on them unqualified, that is the first thing to
      // fix by hand, which is the point of having it here.
      const loadTestBody = (path, test) => {
        if (!test.body) return;
        const name = `${test.scope ? test.scope + "." : ""}${test.name}`;
        const { text, changed } = qualify(
          dedent(currentSource.slice(test.body.start, test.body.end)), test, currentSource
        );
        // Only the imports this body actually reaches for; the module's
        // other six would be noise around three lines of test.
        const used = importsOf(currentSource, path).filter((im) =>
          new RegExp(`\\b${im.alias}\\b`).test(text)
        );
        srcEl.value =
          [`import M "${path}";`]
            .concat(used.map((im) => `import ${im.alias} "${im.path}";`))
            .join("\n") +
          `\n// ${name}` +
          (changed ? ", with its own module's names qualified" : "") +
          `\n${text}`;
        paint();
        evaluate();
      };

      let currentSource = "";

      const showModule = (path, button, focus) => {
        for (const b of document.querySelectorAll("#modules button"))
          b.removeAttribute("aria-current");
        button.setAttribute("aria-current", "true");
        libEl.classList.add("has-source");
        $("current").textContent = path.replace(/^fumola\//, "");
        // Picking a file is the end of navigating, so the outline gets out of
        // the way. The toggle brings it back at half.
        setOutline(false);
        const reply = JSON.parse(fumola_module_source(path));
        const pane = $("source");
        pane.textContent = "";
        if (!reply.ok) {
          pane.innerHTML = '<div class="empty"></div>';
          pane.firstChild.textContent = reply.error;
          return;
        }
        // Every `#[test]` above a public test becomes a link that runs it.
        const tests = testsIn(reply.source);
        const marks = new Map();
        tests.forEach((t, i) => marks.set(t.start, { end: t.end, index: i }));

        const row = document.createElement("div");
        row.className = "code-lines";
        const gutter = document.createElement("pre");
        gutter.className = "gutter";
        gutter.setAttribute("aria-hidden", "true");
        const lines = reply.source.split("\n").length;
        gutter.textContent = Array.from({ length: lines }, (_, i) => i + 1).join("\n");
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        code.innerHTML = highlight(reply.source, marks);
        pre.appendChild(code);
        row.append(gutter, pre);
        pane.appendChild(row);
        currentSource = reply.source;
        for (const b of code.querySelectorAll(".body-here")) {
          b.addEventListener("click", () =>
            loadTestBody(path, tests[Number(b.dataset.test)]));
        }
        const links = code.querySelectorAll(".run-here");
        for (const b of links) {
          const t = tests[Number(b.dataset.test)];
          b.title = "Run " + invocationFor(path, t).split("\n")[1];
          b.addEventListener("click", () => loadTest(path, t));
        }

        pane.scrollTop = 0;
        // Arriving from the tests tree: put that test's marker on the top
        // line, so the source opens at the thing that was clicked rather
        // than at the top of the file.
        if (focus) {
          const i = tests.findIndex(
            (t) => t.name === focus.name && t.scope === focus.scope
          );
          const el = i >= 0 ? links[i] : null;
          if (el) {
            el.setAttribute("aria-current", "true");
            pane.scrollTop +=
              el.getBoundingClientRect().top - pane.getBoundingClientRect().top;
          }
        }
      };

      // ---- evaluation ---------------------------------------------------
      const show = (v) => {
        if (v === null || v === undefined) return "?";
        switch (v.tag) {
          case "Unit": return "()";
          case "Null": return "null";
          case "Option": return "?(" + show(v.value) + ")";
          // Quoted, like every other part of this rendering is Fumola source.
          // Unquoted, a text field ran into the structure around it -- and a
          // string beginning with # was coloured as a variant tag, because
          // the lexer had no reason to think otherwise. JSON's escaping is
          // close enough to Fumola's and unambiguous.
          case "String": return JSON.stringify(v.value);
          case "Symbol": return symbolSource(v.value);
          case "List": return "[" + v.value.map(show).join(", ") + "]";
          case "Tuple": return "(" + v.value.map(show).join(", ") + ")";
          case "Record":
            return "{" + Object.entries(v.value)
              .map(([k, f]) => k + " = " + show(f)).join("; ") + "}";
          case "Variant":
            return "#" + v.value.name +
              (v.value.value === null ? "" : "(" + show(v.value.value) + ")");
          case "AdaptonPointer": return "pointer(" + v.value.source + ")";
          case "Pointer": return JSON.stringify(v.value);
          default: return String(v.value);
        }
      };
      const symbolSource = (s) => {
        if (s === null || typeof s !== "object") return String(s);
        switch (s.tag) {
          case "Num": return String(s.value);
          case "Name": return "`" + s.value;
          case "Call": return symbolSource(s.fun) + "(" + symbolSource(s.arg) + ")";
          case "Dot": return symbolSource(s.left) + "." + symbolSource(s.right);
          case "UnOp": return s.op + symbolSource(s.arg);
          case "BinOp": return symbolSource(s.left) + s.op + symbolSource(s.right);
          case "QuotedAst": return s.source;
          default: return JSON.stringify(s);
        }
      };

      let timer = null;
      const evaluate = async () => {
        try { await ensureRuntime(); } catch (e) { return; }
        const text = srcEl.value;
        if (!text.trim()) { outEl.textContent = ""; outEl.classList.remove("stale"); return; }

        // Back to the instance as it was before anything ran. Clearing the
        // adapton store is not enough on its own: a `let` from an earlier
        // program would still be bound, so a run would not be independent of
        // the ones before it. Restoring the pristine copy is near free --
        // a Core clones in about constant time.
        if (!persistEl.checked) fumola_reset(instance);

        let reply;
        try {
          reply = JSON.parse(fumola_eval_top(instance, text));
        } catch (e) {
          return;
        }
        // Both places: the panel is where it is meant to be read, the
        // console is where a browser's own tooling can search it.
        //
        // Not while the program is half-typed, though. A syntax error runs
        // nothing and so prints nothing, and blanking the panel on every
        // keystroke mid-edit would make it flicker; the last good run's
        // output stands until this one parses, as the answer below does.
        if (reply.kind !== "syntax") {
          showPrint(reply.printed);
          if (reply.printed) for (const line of reply.printed) console.log(line);
        }
        if (reply.ok) {
          markLine(0);
          outEl.classList.remove("stale");
          outEl.textContent = "";
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = reply.tag + "  ";
          // show() renders the value as Fumola writes it, so the same lexer
          // colours it. Worth it for anything structured -- an event log is
          // a wall of identical grey without it.
          const body = document.createElement("span");
          body.innerHTML = highlight(show(reply)).replace(/\n$/, "");
          outEl.append(tag, body);
          refreshEvents();
          return;
        }
        // Half-typed programs are syntax errors most of the time, and
        // flashing red on every keystroke is worse than useless. The last
        // good answer stays, dimmed, until this one parses.
        if (reply.kind === "syntax") {
          outEl.classList.add("stale");
          return;
        }
        outEl.classList.remove("stale");
        outEl.textContent = "";
        // Where in what was typed, if the failure reaches back into it at all.
        const at = frameInProgram(reply.frames, text);
        markLine(at ? at.line : 0);
        const err = document.createElement("span");
        err.className = "err";
        err.textContent = at ? `line ${at.line}: ${reply.error}` : reply.error;
        outEl.append(err);
        // The panel has room for the error and no more. The frame dump that
        // the CLI prints to stderr goes to the console instead, so a failure
        // here can be read the same way as one in a terminal.
        if (reply.trace) console.error(`${reply.error}\n\n${reply.trace}`);
        refreshEvents();   // the failed program may still have written
      };

      const schedule = () => {
        clearTimeout(timer);
        timer = setTimeout(evaluate, 300);
      };

      srcEl.addEventListener("input", () => { paint(); schedule(); });
      srcEl.addEventListener("scroll", syncScroll);
      persistEl.addEventListener("change", () => { note(); evaluate(); });

      // ---- the library's own text size, independent of the editor --------
      const LIB_STEPS = ["0.62rem", "0.7rem", "0.78rem", "0.84rem",
                         "0.92rem", "1rem", "1.12rem", "1.25rem"];
      const LIB_FONT_KEY = "fumola.web-play.libFont";
      const LIB_FONT_KEY_WAS = "fumola.web-repl.libFont";   // before the rename
      const LIB_DEFAULT_STEP = 3;
      let libStep = LIB_DEFAULT_STEP;
      const applyLibFont = () => {
        document.querySelector(".library")
          .style.setProperty("--lib-font", LIB_STEPS[libStep]);
        try { localStorage.setItem(LIB_FONT_KEY, String(libStep)); } catch (e) {}
      };
      const stepLibFont = (by) => {
        libStep = Math.max(0, Math.min(LIB_STEPS.length - 1, libStep + by));
        applyLibFont();
      };
      try {
        // Same origin either way, so a size chosen before the rename is still
        // in this browser under the old key. Read it rather than resetting it.
        const saved =
          localStorage.getItem(LIB_FONT_KEY) ?? localStorage.getItem(LIB_FONT_KEY_WAS);
        if (saved !== null) libStep = Math.max(0, Math.min(LIB_STEPS.length - 1, Number(saved)));
      } catch (e) {}

      // ---- the library pane: drag to size, or snap -----------------------
      const shell = document.querySelector(".shell");
      const libEl = document.querySelector(".library");
      const gripEl = $("grip");
      const reopenEl = $("reopen");
      const REMEMBER = "fumola.web-play.libWidth";
      const REMEMBER_WAS = "fumola.web-repl.libWidth";      // before the rename

      const setWidth = (px) => {
        const max = window.innerWidth;
        // Snapped shut, or dragged so far it may as well be: show the spine
        // instead of a sliver nobody can read.
        const w = Math.max(0, Math.min(px, max));
        const shut = w < 40;
        shell.style.setProperty("--lib-w", shut ? "0px" : w + "px");
        libEl.hidden = shut;
        gripEl.hidden = shut;
        reopenEl.hidden = !shut;
        try { localStorage.setItem(REMEMBER, String(shut ? 0 : w)); } catch (e) {}
      };

      for (const b of document.querySelectorAll("[data-snap]")) {
        b.addEventListener("click", () => {
          const to = b.dataset.snap;
          setWidth(to === "full" ? window.innerWidth
                 : to === "half" ? Math.round(window.innerWidth / 2)
                 : 0);
        });
      }
      reopenEl.addEventListener("click", () =>
        setWidth(Math.round(window.innerWidth / 2)));

      gripEl.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        // Best effort: a failed capture must not abort the drag before the
        // listeners below are attached.
        try { gripEl.setPointerCapture(e.pointerId); } catch (_) {}
        gripEl.classList.add("dragging");
        document.body.classList.add("dragging");
        const move = (ev) => setWidth(ev.clientX - libEl.getBoundingClientRect().left);
        const up = () => {
          gripEl.classList.remove("dragging");
          document.body.classList.remove("dragging");
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerup", up);
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
      });

      // Restore the last width, if this browser remembers one -- including
      // one stored under the pre-rename key.
      try {
        const saved = localStorage.getItem(REMEMBER) ?? localStorage.getItem(REMEMBER_WAS);
        if (saved !== null) setWidth(Number(saved));
      } catch (e) {}

      $("lib-smaller").addEventListener("click", () => stepLibFont(-1));
      $("lib-bigger").addEventListener("click", () => stepLibFont(+1));
      $("lib-default").addEventListener("click", () => {
        libStep = LIB_DEFAULT_STEP;
        applyLibFont();
      });
      applyLibFont();

      // Drag the split so either the outline or the source can have the
      // whole pane, without losing the other entirely.
      const hgripEl = $("hgrip");
      hgripEl.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        try { hgripEl.setPointerCapture(e.pointerId); } catch (_) {}
        hgripEl.classList.add("dragging");
        document.body.classList.add("dragging-v");
        const top = $("modules").getBoundingClientRect().top;
        const move = (ev) => {
          const h = Math.max(0, ev.clientY - top);
          libEl.style.setProperty("--outline-h", h + "px");
        };
        const up = () => {
          hgripEl.classList.remove("dragging");
          document.body.classList.remove("dragging-v");
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerup", up);
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
      });

      $("outline-toggle").addEventListener("click", () =>
        setOutline(libEl.dataset.outline === "closed"));
      for (const t of document.querySelectorAll(".view-tab"))
        t.addEventListener("click", () => setView(t.dataset.view));
      setView("outline");

      srcEl.value = START;
      paint();
      outEl.innerHTML = '<span class="waiting">starting…</span>';

      // Fetched immediately, unlike the console on the homepage. There, most
      // readers never run anything and the 5 MB is worth deferring; here,
      // opening the page is the request -- and the library list and the
      // highlighting both come out of the runtime, so deferring it left the
      // page looking broken until the first keystroke.
      ensureRuntime().catch(() => {});
    </script>
  </body>
</html>
