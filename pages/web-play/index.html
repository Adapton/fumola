            // through `fumola_abandon`, which restores the instance, so a
            // cancelled run costs nothing either.
            if (generation !== runGeneration) {
              fumola_abandon(instance);
              return;
            }
            const steps = nextChunk(performance.now() - began);
            await sayWaiting(progress(reply.steps));
            began = performance.now();
            reply = JSON.parse(fumola_resume(instance, steps));
          }
        } catch (e) {
          return;
        }
        // A later run started while this one was finishing its last chunk.
        if (generation !== runGeneration) return;
        // What it actually cost, for the next wait and for the answer below.
        // `steps` is the whole run where a chunked path reported one;
        // `counts.step` is the last chunk, and is the fallback for the
        // unlimited entry points that report no `steps`.
        const ranSteps = Number.isFinite(Number(reply.steps))
          ? Number(reply.steps)
          : reply.counts && Number.isFinite(Number(reply.counts.step))
            ? Number(reply.counts.step) : null;
        if (ranSteps !== null) stepsSeen.set(text, ranSteps);
        // Both places: the panel is where it is meant to be read, the
        // console is where a browser's own tooling can search it.
        //
        // Not while the program is half-typed, though. A syntax error runs
        // nothing and so prints nothing, and blanking the panel on every
        // keystroke mid-edit would make it flicker; the last good run's
        // output stands until this one parses, as the answer below does.
        if (reply.kind !== "syntax") {
          showPrint(reply.printed);
          if (reply.printed) for (const line of reply.printed) console.log(line);
        }
        if (reply.ok) {
          markLine(0);
          showHush(false);
          showScene(reply);
          // A scene is shown in its panels, so the output panel says what
          // arrived rather than printing it. `A.Scene.Scene` carries the
          // whole history beside the components, and rendering that fills
          // the panel with thousands of events nobody asked to read.
          const scene = sceneOf(reply);
          if (scene) {
            const f = scene.value || {};
            const objects = Array.isArray(f.objects && f.objects.value)
              ? f.objects.value.length : 0;
            const trees = Array.isArray(f.outline && f.outline.value)
              ? f.outline.value.length : 0;
            const events =
              f.history && f.history.value && f.history.value.events &&
              Array.isArray(f.history.value.events.value)
                ? f.history.value.events.value.length : null;
            outEl.classList.remove("stale");
            outEl.textContent = "";
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = "Scene  ";
            const body = document.createElement("span");
            body.textContent =
              `${objects} objects, ${trees} outline${trees === 1 ? "" : "s"}` +
              (events === null ? "" : `, ${events} events`) +
              (ranSteps === null ? "" : `, ${commas(ranSteps)} Fumola steps`) +
              " — see the objects and outline panels";
            outEl.append(tag, body);
            refreshEvents();
            return;
          }
          // A pair, like a scene, is described rather than printed. Its
          // value is two whole histories -- measured at 1.17 MB for the
          // tree pair -- and rendering that through the highlighter cost
          // more than running the program did, to produce something nobody
          // reads. The panels carry what it means.
          const asPair = pairOf(reply);
          if (asPair) {
            const c = diffCounts(asPair.sizes);
            outEl.classList.remove("stale");
            outEl.textContent = "";
            const pairTag = document.createElement("span");
            pairTag.className = "tag";
            pairTag.textContent = "Pair  ";
            const pairBody = document.createElement("span");
            pairBody.textContent =
              `${c.changed} of ${c.total} nodes differ ` +
              `(${(c.fraction * 100).toFixed(1)}%)` +
              (ranSteps === null ? "" : `, ${commas(ranSteps)} Fumola steps`) +
              " — see the objects and outline panels";
            outEl.append(pairTag, pairBody);
            refreshEvents();
            return;
          }
          outEl.classList.remove("stale");
          outEl.textContent = "";
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = reply.tag + "  ";
          // show() renders the value as Fumola writes it, so the same lexer
          // colours it. Worth it for anything structured -- an event log is
          // a wall of identical grey without it.
          const body = document.createElement("span");
          body.innerHTML = highlight(show(reply)).replace(/\n$/, "");
          outEl.append(tag, body);
          refreshEvents();
          return;
        }
        // Half-typed programs are syntax errors most of the time, and
        // flashing red on every keystroke is worse than useless. The last
        // good answer stays, dimmed, until this one parses.
        if (reply.kind === "syntax") {
          outEl.classList.add("stale");
          return;
        }
        outEl.classList.remove("stale");
        outEl.textContent = "";
        // Where in what was typed, if the failure reaches back into it at all.
        showScene(reply);
        const at = frameInProgram(reply.frames, text);
        markLine(at ? at.line : 0);
        // Offered for any assertion that came from this text, whether the
        // text is an edited test body or something written from scratch.
        showHush(
          /AssertionFailure/.test(reply.error) && /^\s*assert\b/m.test(text)
        );
        const err = document.createElement("span");
        err.className = "err";
        err.textContent = at ? `line ${at.line}: ${reply.error}` : reply.error;
        outEl.append(err);
        // The panel has room for the error and no more. The frame dump that
        // the CLI prints to stderr goes to the console instead, so a failure
        // here can be read the same way as one in a terminal.
        if (reply.trace) console.error(`${reply.error}\n\n${reply.trace}`);
        refreshEvents();   // the failed program may still have written
      };

      const schedule = () => {
        clearTimeout(timer);
        timer = setTimeout(evaluate, 300);
      };

      srcEl.addEventListener("input", () => {
        // Typing makes the anchor a claim about something that is no longer
        // here, so it stops being one.
        if (preset && srcEl.value !== preset.text) clearPreset();
        paint();
        schedule();
      });

      $("hush").addEventListener("click", commentAsserts);

      /// The address, with everything about the current view that the
      /// example itself does not say.
      ///
      /// The program decides what a scene contains; a link should be able to
      /// decide how it is being looked at. Without that, sharing a view means
      /// sending a link and then describing the camera in words.
      const shareUrl = () => {
        if (!preset || !preset.key) return location.href;
        const parts = [`${preset.kind}=${preset.key}`];
        if (mounted && mounted.getView) {
          const v = mounted.getView();
          for (const k of ["cam", "walk", "spin", "out", "trail", "mix", "pong"])
            if (v[k] !== undefined) parts.push(`${k}=${v[k]}`);
        }
        return location.origin + location.pathname + location.search +
               "#" + parts.join("&");
      };

      $("share").addEventListener("click", async () => {
        const b = $("share");
        const url = shareUrl();
        // Put it in the address bar too, so what was copied is visible.
        history.replaceState(null, "", url);
        try {
          await navigator.clipboard.writeText(url);
          b.textContent = "copied";
          b.classList.add("done");
          setTimeout(showShare, 1400);
        } catch (e) {
          // Without clipboard permission the address bar already holds it.
          b.textContent = "in the address bar";
          setTimeout(showShare, 1800);
        }
      });

      /// Open whatever the anchor names, once the library is known.
      ///
      /// The anchor is carried out and then left alone: it keeps standing as
      /// long as the editor still holds what it named, and the first edit
      /// takes it away.
      /// Put a named example's body in the editor, as the `body` button does.
      const openBody = (key) => {
        const found = presets.get(key);
        if (!found) return false;
        showModule(found.path, null, found.test);
        loadTestBody(found.path, found.test);
        return true;
      };

      const openFromHash = () => {
        const raw = decodeURIComponent(location.hash).replace(/^#/, "");
        if (!raw) return false;
        // `kind=path` first, then any number of `name=value` settings. The
        // path may itself contain `=`-free colons and slashes, so only the
        // first `=` of each part is a separator.
        const parts = raw.split("&");
        const first = /^(test|examplePair|example|body)=(.+)$/.exec(parts[0]);
        if (!first) return false;
        const m = first;
        const view = {};
        for (const part of parts.slice(1)) {
          const at = part.indexOf("=");
          if (at > 0) view[part.slice(0, at)] = part.slice(at + 1);
        }
        pendingView = Object.keys(view).length ? view : null;
        const found = presets.get(m[2]);
        if (!found) {
          // Say so rather than silently showing the starter program: a link
          // that no longer resolves is worth knowing about, and moving a test
          // between modules is exactly what breaks one.
          outEl.textContent = "";
          const err = document.createElement("span");
          err.className = "err";
          err.textContent = `No library ${m[1] === "body" ? "test" : m[1]} named ${m[2]}.`;
          outEl.append(err);
          return true;
        }
        const { path, test } = found;
        showModule(path, null, test);
        if (m[1] === "body") loadTestBody(path, test);
        else loadTest(path, test);
        return true;
      };
      srcEl.addEventListener("scroll", syncScroll);
      persistEl.addEventListener("change", () => { note(); evaluate(); });

      // ---- the library's own text size, independent of the editor --------
      const LIB_STEPS = ["0.62rem", "0.7rem", "0.78rem", "0.84rem",
                         "0.92rem", "1rem", "1.12rem", "1.25rem"];
      const LIB_FONT_KEY = "fumola.web-play.libFont";
      const LIB_FONT_KEY_WAS = "fumola.web-repl.libFont";   // before the rename
      const LIB_DEFAULT_STEP = 3;
      let libStep = LIB_DEFAULT_STEP;
      const applyLibFont = () => {
        document.querySelector(".library")
          .style.setProperty("--lib-font", LIB_STEPS[libStep]);
        try { localStorage.setItem(LIB_FONT_KEY, String(libStep)); } catch (e) {}
      };
      const stepLibFont = (by) => {
        libStep = Math.max(0, Math.min(LIB_STEPS.length - 1, libStep + by));
        applyLibFont();
      };
      try {
        // Same origin either way, so a size chosen before the rename is still
        // in this browser under the old key. Read it rather than resetting it.
        const saved =
          localStorage.getItem(LIB_FONT_KEY) ?? localStorage.getItem(LIB_FONT_KEY_WAS);
        if (saved !== null) libStep = Math.max(0, Math.min(LIB_STEPS.length - 1, Number(saved)));
      } catch (e) {}

      // ---- the library pane: drag to size, or snap -----------------------
      const shell = document.querySelector(".shell");
      const libEl = document.querySelector(".library");
      const gripEl = $("grip");
      const reopenEl = $("reopen");
      const REMEMBER = "fumola.web-play.libWidth";
      const REMEMBER_WAS = "fumola.web-repl.libWidth";      // before the rename

      const setWidth = (px) => {
        const max = window.innerWidth;
        // Snapped shut, or dragged so far it may as well be: show the spine
        // instead of a sliver nobody can read.
        const w = Math.max(0, Math.min(px, max));
        const shut = w < 40;
        shell.style.setProperty("--lib-w", shut ? "0px" : w + "px");
        libEl.hidden = shut;
        gripEl.hidden = shut;
        reopenEl.hidden = !shut;
        try { localStorage.setItem(REMEMBER, String(shut ? 0 : w)); } catch (e) {}
      };

      for (const b of document.querySelectorAll("[data-snap]")) {
        b.addEventListener("click", () => {
          const to = b.dataset.snap;
          setWidth(to === "full" ? window.innerWidth
                 : to === "half" ? Math.round(window.innerWidth / 2)
                 : 0);
        });
      }
      reopenEl.addEventListener("click", () =>
        setWidth(Math.round(window.innerWidth / 2)));

      gripEl.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        // Best effort: a failed capture must not abort the drag before the
        // listeners below are attached.
        try { gripEl.setPointerCapture(e.pointerId); } catch (_) {}
        gripEl.classList.add("dragging");
        document.body.classList.add("dragging");
        const move = (ev) => setWidth(ev.clientX - libEl.getBoundingClientRect().left);
        const up = () => {
          gripEl.classList.remove("dragging");
          document.body.classList.remove("dragging");
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerup", up);
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
      });

      // Restore the last width, if this browser remembers one -- including
      // one stored under the pre-rename key.
      try {
        const saved = localStorage.getItem(REMEMBER) ?? localStorage.getItem(REMEMBER_WAS);
        if (saved !== null) setWidth(Number(saved));
      } catch (e) {}

      $("lib-smaller").addEventListener("click", () => stepLibFont(-1));
      $("lib-bigger").addEventListener("click", () => stepLibFont(+1));
      $("lib-default").addEventListener("click", () => {
        libStep = LIB_DEFAULT_STEP;
        applyLibFont();
      });
      applyLibFont();

      // Drag the split so either the outline or the source can have the
      // whole pane, without losing the other entirely.
      const hgripEl = $("hgrip");
      hgripEl.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        try { hgripEl.setPointerCapture(e.pointerId); } catch (_) {}
        hgripEl.classList.add("dragging");
        document.body.classList.add("dragging-v");
        const top = $("modules").getBoundingClientRect().top;
        const move = (ev) => {
          const h = Math.max(0, ev.clientY - top);
          libEl.style.setProperty("--outline-h", h + "px");
        };
        const up = () => {
          hgripEl.classList.remove("dragging");
          document.body.classList.remove("dragging-v");
          window.removeEventListener("pointermove", move);
          window.removeEventListener("pointerup", up);
        };
        window.addEventListener("pointermove", move);
        window.addEventListener("pointerup", up);
      });

      // A link pasted into a tab that is already open changes the fragment
      // and nothing else -- the browser does not reload for that -- so the
      // page has to act on it itself. `history.replaceState` is what sets and
      // clears the anchor elsewhere, and that does not fire this, so there is
      // no loop to guard against.
      window.addEventListener("hashchange", () => { if (ready) openFromHash(); });

      $("outline-toggle").addEventListener("click", () =>
        setOutline(libEl.dataset.outline === "closed"));
      for (const t of document.querySelectorAll(".view-tab"))
        t.addEventListener("click", () => setView(t.dataset.view));
      // Opens on the scene, not the library. The library is a click away and
      // the tab says so; a drawn graph is not something the reader can
      // imagine from a file tree.
      setView("objects");
      showScene({ ok: false });

      // The editor is filled once the runtime is up, from the library --
      // see START_BODY. Until then there is nothing to paint.
      outEl.innerHTML = '<span class="waiting">starting…</span>';

      // Fetched immediately, unlike the console on the homepage. There, most
      // readers never run anything and the 5 MB is worth deferring; here,
      // opening the page is the request -- and the library list and the
      // highlighting both come out of the runtime, so deferring it left the
      // page looking broken until the first keystroke.
      ensureRuntime().catch(() => {});
    </script>
  </body>
</html>
