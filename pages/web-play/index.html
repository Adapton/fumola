          const row = document.createElement("div");
          row.className = "outline-edge";

          const [begin, end] = metaPair(e.metaTimes);
          const nested = vSome(e.outline);
          // The same convention as `IntoText.metaTimesIntoText`: a pair only
          // when the two differ, so an edge that happened at one moment says
          // one moment.
          row.appendChild(
            span("metaTime", begin === end ? `(${begin})` : `(${begin}, ${end})`)
          );

          const action = vVariant(e.action);
          const name = action ? action.name : "";
          row.appendChild(
            span("action-arrow action-" + name, ARROWS[name] || ` ${name} `)
          );
          row.appendChild(span("nodeId", vFlat(e.actionTarget)));
          div.appendChild(row);

          if (nested) {
            drawOutline(div, nested, depth + 1);
            // The value a nested force came back with, on a line of its own.
            const result = document.createElement("div");
            result.className = "outline-internal-result";
            result.appendChild(span("action-arrow result-arrow", "╰〜〜> "));
            result.appendChild(span("outline-value-text", vFlat(e.value)));
            div.appendChild(result);
          } else {
            row.appendChild(span("outline-value-text", " " + vFlat(e.value)));
          }
        }
      };

      // ---- the objects, drawn ------------------------------------------
      //
      // Follows the construction in replayground-www: a box or an orb per
      // labelled object at the position the program chose, and a line for
      // each pointer between them. three.js is vendored beside this page
      // rather than fetched from a CDN, and imported the first time a scene
      // actually needs it -- 670KB is not something to charge someone for
      // opening the page.

      let three = null, viewport = null;

      const loadThree = async () => {
        if (three) return three;
        const [THREE, orbit] = await Promise.all([
          import("../vendor/three.module.min.js"),
          import("../vendor/OrbitControls.js"),
        ]);
        three = { THREE, OrbitControls: orbit.OrbitControls };
        return three;
      };

      const vNum = (v) => (v && v.value !== undefined ? Number(v.value) : 0);
      const vStr = (v) => (v && typeof v.value === "string" ? v.value : vFlat(v));
      const vec3 = (v) => {
        const r = vRec(v) || {};
        return [vNum(r.x), vNum(r.y), vNum(r.z)];
      };

      /// Take the scene apart into what a renderer needs.
      const readObjects = (list) => {
        const shapes = [], links = [], actions = [];
        for (const item of vArr(list)) {
          const v = vVariant(item);
          if (!v) continue;
          const f = vRec(v.value) || {};
          if (v.name === "box" || v.name === "orb") {
            shapes.push({
              kind: v.name,
              // `unescapeText` here for the same reason the print panel needs
              // it: Fumola's lexer never turns `\n` into a line break, so the
              // Text holds a backslash and an `n`. The replayground never had
              // to do this -- the CLI expands escapes when it writes the
              // scene file, so its `scene.json` holds real newlines by the
              // time `makeTextTexture` splits on them. Reading the value
              // across the wasm boundary skips that step.
              label: unescapeText(vStr(f.label_)),
              at: vec3(f.position),
              text: unescapeText(vStr(f.textFields)),
              // The named slots a pointer can leave from. Each becomes a dot
              // under the object, and a pointer line starts at its dot rather
              // than at the object's middle -- which is how the replayground
              // can show two pointers leaving one box in different directions.
              fields: vArr(f.pointerFields).map(vStr),
            });
          } else if (v.name === "pointer") {
            links.push({ from: vStr(f.from), to: vStr(f.to) });
          } else if (v.name === "action") {
            const kind = vVariant(f.action);
            actions.push({
              // `#force_` is the variant's name; "force" is what the JSON
              // calls it and what the colours below are keyed on.
              kind: kind ? (kind.name === "force_" ? "force" : kind.name) : "",
              from: vStr(f.from),
              to: vStr(f.to),
            });
          }
        }
        return { shapes, links, actions };
      };

      /// Everything a mounted scene owns, so it can be given back.
      let mounted = null;

      const disposeScene = () => {
        // One teardown's worth of suppression, spent whether or not there is
        // a scene here to suppress -- a link that arrives before any scene
        // must not leave the flag down for the first edit after it.
        const keep = inheritView;
        inheritView = true;
        if (!mounted) return;
        carriedView = keep && mounted.getView ? mounted.getView() : null;
        cancelAnimationFrame(mounted.frame);
        mounted.observer.disconnect();
        mounted.controls.dispose();
        for (const g of mounted.geometries) g.dispose();
        for (const m of mounted.materials) m.dispose();
        for (const t of mounted.textures) t.dispose();
        mounted.renderer.dispose();
        // Everything this scene put in the host, not just the canvas: a hint
        // left behind would sit under the next scene describing the last one.
        mounted.renderer.domElement.remove();
        mounted.hint.remove();
        if (mounted.fader) mounted.fader.remove();
        if (mounted.trail) mounted.trail.remove();
        if (mounted.orbit) mounted.orbit.remove();
        if (mounted.caption) mounted.caption.remove();
        if (mounted.readout) mounted.readout.remove();
        mounted = null;
      };

      /// Draw one scene, or several into the same canvas.
      ///
      /// A pair's two runs belong in one canvas rather than two: a second
      /// WebGL context to look at the same structure twice is a lot of
      /// machinery for a comparison that reads better as a dissolve. Each
      /// side goes under its own group, and `setMix` fades between them.
      const mountObjects = async (input, diffKeys) => {
        const sides = Array.isArray(input) ? input : [{ list: input }];
        // Names the two runs named but disagreed about. Everything else they
        // either agree on or only one of them has, and the geometry says
        // which. From `W.DiffKeys`, whose names are the same `Text` an object
        // carries as its label.
        const disagreed = new Set(
          ((diffKeys && diffKeys.value && diffKeys.value.notEqual &&
            diffKeys.value.notEqual.value) || [])
            .map((t) => (t && t.value !== undefined ? String(t.value) : ""))
        );
        const parsed = sides.map((s) => readObjects(s.list));
        const anything = parsed.some(
          (d) => d.shapes.length || d.links.length || d.actions.length);
        if (!anything) {
          disposeScene();
          return false;
        }
        const { THREE, OrbitControls } = await loadThree();
        disposeScene();

        const host = $("viewport");
        const width = host.clientWidth || 600;
        const height = host.clientHeight || 400;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x08080b);
        const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 2000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        renderer.setSize(width, height);
        host.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const key = new THREE.DirectionalLight(0xffffff, 0.8);
        key.position.set(4, 8, 6);
        scene.add(key);

        const geometries = [], materials = [], textures = [];
        // The replayground's own dimension, so a scene laid out for it reads
        // at the same scale here.
        const BoxDim = 0.33;
        const boxGeo = new THREE.BoxGeometry(BoxDim, BoxDim, BoxDim);
        const orbGeo = new THREE.SphereGeometry(BoxDim / 2, 20, 14);
        const dotGeo = new THREE.SphereGeometry(0.03, 10, 8);
        geometries.push(boxGeo, orbGeo, dotGeo);

        // What each side owns: a group to add to, and the materials whose
        // opacity the crossfader moves. Reassigned once per side; the build
        // below is synchronous, so the closures see the right one.
        const sideGroups = [];
        let root = scene;
        let sideMats = materials;

        // What each object is made of, so a matched object can be moved as a
        // whole. An object is a mesh plus its label, its fields and its
        // pointer dots, all placed in absolute coordinates; moving it means
        // moving every part by the same delta.
        const parts = [];
        const edges = [];
        const acts = [];
        const sideAt = [];
        // Box or orb, so a glide indicator can take the colour of the thing
        // it belongs to rather than a colour of its own.
        const kindOf = new Map();

        /// Text as a texture, the way the replayground does it: draw the
        /// lines onto a canvas and hand the canvas to a plane. There is no
        /// text in three.js itself, and a plane per label costs less than a
        /// font loader.
        const textTexture = (text) => {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          const fontSize = 48, lineHeight = fontSize * 1.2, pad = 20;
          const lines = String(text).split("\n");
          ctx.font = `${fontSize}px monospace`;
          const width = Math.max(1, ...lines.map((l) => ctx.measureText(l).width));
          canvas.width = width + pad * 2;
          canvas.height = lineHeight * lines.length + pad * 2;
          ctx.font = `${fontSize}px monospace`;
          ctx.fillStyle = "#d4d4d4";
          lines.forEach((l, i) => {
            ctx.fillText(l, pad, pad + (i + 1) * lineHeight - (lineHeight - fontSize));
          });
          const texture = new THREE.CanvasTexture(canvas);
          texture.minFilter = THREE.LinearFilter;
          textures.push(texture);
          return { texture, aspect: canvas.height / canvas.width };
        };

        /// A plane carrying that texture, placed relative to an object.
        const textPlane = (text, anchor, size) => {
          if (!text) return;
          const { texture, aspect } = textTexture(text);
          const geo = new THREE.PlaneGeometry(size, size * aspect);
          const mat = new THREE.MeshBasicMaterial({
            map: texture, transparent: true, alphaTest: 0.05, depthWrite: false,
          });
          geometries.push(geo);
          sideMats.push(mat);
          const mesh = new THREE.Mesh(geo, mat);
          mesh.position.copy(anchor);
          root.add(mesh);
          return mesh;
        };
        // Bounds accumulate across sides, so a pair is framed as a whole
        // and the two runs stay registered against each other.
        const box = new THREE.Box3();

        for (let sideIx = 0; sideIx < parsed.length; sideIx += 1) {
        const { shapes, links, actions } = parsed[sideIx];
        root = new THREE.Group();
        sideMats = [];
        scene.add(root);
        sideGroups.push({ group: root, mats: sideMats, label: sides[sideIx].label });

        // The replayground's own colours, so a scene laid out for it looks
        // like itself here: a box and a pointer share one green
        // (`color.box`, `color.pointer`), and an orb is the blue that
        // `createOrb` gives it. These had been swapped, with the pointers
        // grey, which made every scene read as the negative of the same one
        // drawn there.
        const boxMat = new THREE.MeshLambertMaterial({ color: 0x55aa44 });
        const orbMat = new THREE.MeshLambertMaterial({ color: 0x4488aa });
        const lineMat = new THREE.LineBasicMaterial({ color: 0x55aa44 });
        sideMats.push(boxMat, orbMat, lineMat);

        const at = new Map();       // label -> the object's position
        const dots = new Map();     // "label:field" -> where a pointer leaves
        const dotMat = new THREE.MeshLambertMaterial({ color: 0xbdbdc6 });
        sideMats.push(dotMat);

        for (const sh of shapes) {
          const mesh = new THREE.Mesh(
            sh.kind === "box" ? boxGeo : orbGeo,
            sh.kind === "box" ? boxMat : orbMat
          );
          mesh.position.set(sh.at[0], sh.at[1], sh.at[2]);
          mesh.userData.label = sh.label;
          root.add(mesh);
          at.set(sh.label, mesh.position.clone());
          box.expandByPoint(mesh.position);
          if (sideIx === 0) kindOf.set(sh.label, sh.kind);
          const own = (obj) => {
            if (obj) parts.push({
              side: sideIx, key: sh.label, obj, base: obj.position.clone(),
            });
          };
          own(mesh);

          // The label, up and to the left; the fields, to the right. The same
          // offsets the replayground uses, so a scene sits the same way.
          own(textPlane(
            sh.label,
            mesh.position.clone().add(new THREE.Vector3(-0.17, 0.17, BoxDim)),
            0.7
          ));
          own(textPlane(
            sh.text,
            mesh.position.clone().add(new THREE.Vector3(0.37, 0, BoxDim)),
            0.5
          ));

          const spacing = 0.1;
          const startX = mesh.position.x - ((sh.fields.length - 1) * spacing) / 2;
          sh.fields.forEach((name, i) => {
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.position.set(startX + i * spacing, mesh.position.y - 0.17, mesh.position.z);
            root.add(dot);
            dots.set(sh.label + ":" + name, dot.position.clone());
            own(dot);
          });
        }

        for (const link of links) {
          // From the named slot if there is one, else from the object itself.
          const a = dots.get(link.from) || at.get(link.from);
          const b = at.get(link.to);
          if (!a || !b) continue;
          const to = b.clone().add(new THREE.Vector3(0, BoxDim / 2, 0));
          const geo = new THREE.BufferGeometry().setFromPoints([a.clone(), to]);
          geometries.push(geo);
          const pointerLine = new THREE.Line(geo, lineMat);
          root.add(pointerLine);
          // A line is drawn between two objects rather than owned by one, so
          // it follows both ends. Without this the boxes glide and their
          // pointers stay where they were.
          edges.push({
            side: sideIx, geo, line: pointerLine,
            // Identity, not endpoints: an edge is the same edge in both runs
            // only if it runs from the same slot to the same object.
            id: String(link.from) + " -> " + String(link.to),
            fromKey: String(link.from).split(":")[0], toKey: link.to,
            fromBase: a.clone(), toBase: to.clone(),
          });
        }

        // Action edges: what the computation did, rather than what it points
        // at. A shaft from source to target with a head that says which
        // action it was -- a cone for a get or a force, two cones back to
        // back for a put, since a put is a get's opposite. Colours, radii and
        // the hover offset follow `createActionMesh` in the replayground.
        const ACTION_COLOUR = { put: 0x008877, putForce: 0xaaaaaa };
        const actionMat = new Map();
        const materialFor = (kind) => {
          if (!actionMat.has(kind)) {
            const heavy = kind === "force" || kind === "putForce";
            const mat = new THREE.MeshLambertMaterial({
              color: ACTION_COLOUR[kind] || 0x0088aa,
              transparent: true,
              opacity: heavy ? 0.6 : 0.8,
            });
            sideMats.push(mat);
            actionMat.set(kind, mat);
          }
          return actionMat.get(kind);
        };
        const UP = new THREE.Vector3(0, 1, 0);
        const hoverOffset = -BoxDim;

        for (const act of actions) {
          const a = dots.get(act.from) || at.get(act.from);
          const b = at.get(act.to);
          if (!a || !b) continue;
          const dir = new THREE.Vector3().subVectors(b, a);
          const length = dir.length();
          if (length < 1e-6) continue;
          dir.normalize();
          const mat = materialFor(act.kind);
          const heavy = act.kind === "force" || act.kind === "putForce";

          const shaftLength = Math.max(0.001, length + hoverOffset * 1.6);
          const shaftGeo = new THREE.CylinderGeometry(
            heavy ? 0.1 : 0.03, heavy ? 0.1 : 0.03, shaftLength, 10
          );
          geometries.push(shaftGeo);
          const head = b.clone().addScaledVector(dir, hoverOffset);
          const shaft = new THREE.Mesh(shaftGeo, mat);
          shaft.position.copy(a.clone().add(head).multiplyScalar(0.5));
          shaft.quaternion.setFromUnitVectors(UP, dir);
          root.add(shaft);

          const coneGeo = new THREE.ConeGeometry(0.12, 0.12, 10);
          geometries.push(coneGeo);
          let marker = null;
          if (act.kind === "put" || act.kind === "putForce") {
            // Two cones back to back: a put goes the other way from a get.
            const group = new THREE.Group();
            const up = new THREE.Mesh(coneGeo, mat);
            const down = new THREE.Mesh(coneGeo, mat);
            down.rotateX(Math.PI);
            up.position.y = 0.06;
            down.position.y = -0.06;
            group.add(up, down);
            group.position.copy(head);
            group.quaternion.setFromUnitVectors(UP, dir);
            root.add(group);
            marker = group;
          } else {
            const cone = new THREE.Mesh(coneGeo, mat);
            cone.position.copy(head);
            cone.quaternion.setFromUnitVectors(UP, dir);
            root.add(cone);
            marker = cone;
          }
          // An action spans two objects like a pointer does, so it has to
          // follow both ends. Its length changes as well as its place, and a
          // cylinder's length is baked into its geometry -- so it is scaled
          // rather than rebuilt.
          acts.push({
            side: sideIx,
            id: act.kind + " " + String(act.from) + " -> " + String(act.to),
            fromKey: String(act.from).split(":")[0], toKey: act.to,
            fromBase: a.clone(), toBase: b.clone(),
            shaft, marker, baseLen: shaftLength, hover: hoverOffset,
          });
        }

        sideAt[sideIx] = at;
        materials.push(...sideMats);
        }

        // Frame whatever was built, rather than assuming where it is.
        //
        // Fit the bounding sphere to the frame. The distance at which a
        // sphere of radius r just fills a field of view is r / sin(fov/2),
        // and there are two fields of view: the camera's `fov` is the
        // vertical one, and the horizontal follows from the aspect. Fitting
        // only the vertical one clipped a wide scene in a narrow pane, so
        // take whichever needs more room.
        //
        // The direction is a diagonal, so the depth of the thing reads on
        // arrival rather than needing a drag to discover.
        const centre = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const radius = Math.max(size.length() / 2, 0.5);
        const vHalf = (camera.fov * Math.PI) / 360;
        const hHalf = Math.atan(camera.aspect * Math.tan(vHalf));
        const fit = Math.max(radius / Math.sin(vHalf), radius / Math.sin(hHalf));
        const away = new THREE.Vector3(0.45, 0.35, 1).normalize()
          .multiplyScalar(fit * 0.85);
        camera.position.copy(centre).add(away);
        // What the fit chose. The distance control moves relative to this
        // rather than in absolute units, so it means the same thing whatever
        // the scene's size.
        const fittedDistance = away.length();
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.copy(centre);
        controls.enableDamping = true;
        controls.update();

        /// The crossfader. `t` runs 0 (all left) to 1 (all right).
        ///
        /// At either end one side is solid and the other is gone. In the
        /// middle both sit at 0.7, which is what makes the comparison
        /// legible: two structures at full strength read as one confused
        /// structure, and two at half strength read as neither. So the curve
        /// is 1 to 0.7 over the first half and 0.7 to 0 over the second --
        /// a slow give and then a quick one, the way a DJ's fader is not
        /// linear either.
        const fade = (u) =>
          u <= 0.5 ? 1 - 0.6 * u : Math.max(0, 0.7 - 1.4 * (u - 0.5));

        /// A side, painted. Opacity only.
        ///
        ///    There used to be a white glow here, lighting whichever run the
        /// fader was moving towards. It is gone: the trails say which way you
        /// are going and the gliding says what is moving, so a third signal
        /// for the same thing was noise.
        ///
        ///    It was also half broken, which is what prompted looking at it.
        /// Matched objects are drawn from the left run only, so lighting the
        /// right run lit things that are hidden -- moving left glowed and
        /// moving right did nothing.
        ///
        ///    No `needsUpdate`: that asks three.js to recompile the shader,
        /// and opacity is a uniform. Setting it per material per fader move
        /// cost about a second a move on the mergeSort pair, which has some
        /// nine hundred materials. `transparent` does affect compilation, so
        /// it is set once when the material is made.
        const paintSide = (s) => {
          s.group.visible = s.opacity > 0.01;
          for (const m of s.mats) m.opacity = s.opacity;
        };

        /// Where every matched object has to travel, and which objects are
        /// not matched at all.
        ///
        ///    Most of a pair is the same objects in different places: for the
        /// tree pair, 54 of 61 differ only in position. So the two runs are
        /// not two pictures to dissolve between, they are one picture whose
        /// parts move, and the fader reads as a journey from the old layout
        /// to the new one rather than as a crossfade.
        ///
        ///    An object matched in both runs is drawn once, from the left
        /// run, and slid to where the right run puts it. Its counterpart in
        /// the right run is never shown, or the same object would appear
        /// twice. Only the objects one run has and the other does not are
        /// left to fade, and there are few of them.
        const shift = new Map();
        if (sideAt.length === 2 && sideAt[0] && sideAt[1]) {
          for (const [key, here] of sideAt[0]) {
            const there = sideAt[1].get(key);
            if (there) shift.set(key, there.clone().sub(here));
          }
        }
        const matched = (key) => shift.has(key);

        const ALONG_Y = new THREE.Vector3(0, 1, 0);
        let mixNow = 0.5;
        ///    An indicator for a node both runs agree about takes the colour
        /// of the object it belongs to -- green for a box, blue for an orb --
        /// and not white. White is what a moving object glows, so white
        /// indicators competed with the things they were about; in the
        /// object's own colour they read as its wake. Emissive either way, so
        /// they still light rather than merely tint.
        const BOX_COLOUR = 0x55aa44;
        const ORB_COLOUR = 0x4488aa;
        const PATH_DISAGREE = PAIR_DISAGREE;
        const PATH_RADIUS = 0.055;
        const PATH_OPACITY_AGREE = 0.22;
        const PATH_OPACITY_DISAGREE = 0.45;
        const PATH_SEGMENTS = 10;
        // How long a segment takes to cool after the fader has gone through
        // it. Long enough to see a trail from an ordinary drag.
        const TRAIL_MS = 900;
        // What an unlit segment still shows, so a path reads as a path.
        const TRAIL_FLOOR = 0.12;
        // How much of it to show, under the viewer's hand. The default is
        // above 1 because the faint version proved too faint to notice, and
        // how much is too much depends on the scene and the screen.
        let trailGain = 2.5;
        const paths = [];
        if (shift.size) {
          const along = new THREE.Vector3(0, 1, 0);
          for (const [key, delta] of shift) {
            const span = delta.length();
            if (span < 0.01) continue;
            const from = sideAt[0].get(key);
            if (!from) continue;
            const differs = disagreed.has(key);
            const hue = differs
              ? PATH_DISAGREE
              : kindOf.get(key) === "orb" ? ORB_COLOUR : BOX_COLOUR;
            const dir = delta.clone().normalize();
            const turn = new THREE.Quaternion().setFromUnitVectors(along, dir);
            // One geometry for the whole indicator; the segments differ only
            // in where they sit and how brightly they are lit.
            const geo = new THREE.CylinderGeometry(
              PATH_RADIUS, PATH_RADIUS, span / PATH_SEGMENTS, 8
            );
            geometries.push(geo);
            for (let i = 0; i < PATH_SEGMENTS; i += 1) {
              const at = (i + 0.5) / PATH_SEGMENTS;
              const mat = new THREE.MeshLambertMaterial({
                color: hue,
                transparent: true,
                opacity: 0,
                depthWrite: false,
              });
              materials.push(mat);
              const seg = new THREE.Mesh(geo, mat);
              seg.position.copy(from).addScaledVector(delta, at);
              seg.quaternion.copy(turn);
              sideGroups[0].group.add(seg);
              paths.push({ mat, differs, hue, at, heat: 0 });
            }
          }
        }

        /// Show the paths while the fader is moving, and let them go with the
        /// glow. They answer "what is moving where", which is a question
        /// about the gesture, not about the picture at rest.
        /// Paint the indicators from each segment's own heat, plus a faint
        /// baseline while the fader is in motion at all.
        const showPaths = (strength) => {
          for (const p of paths) {
            const base = p.differs ? PATH_OPACITY_DISAGREE : PATH_OPACITY_AGREE;
            const lit = Math.max(p.heat, TRAIL_FLOOR * strength);
            p.mat.opacity = Math.min(1, base * lit * trailGain);
            p.mat.visible = p.mat.opacity > 0.005;
            if (p.mat.emissive) {
              p.mat.emissive.setHex(p.hue);
              p.mat.emissiveIntensity = Math.min(2, p.heat * 0.9 * trailGain);
            }
          }
        };

        /// Light whichever segments the fader has just gone through.
        ///
        /// Every segment between where it was and where it is, not only the
        /// one it landed on: a fader can jump -- a click on the track, or a
        /// fast drag between frames -- and a trail with holes in it looks
        /// like a fault rather than a gesture.
        const heatTrail = (from, to) => {
          const lo = Math.min(from, to) - 0.5 / PATH_SEGMENTS;
          const hi = Math.max(from, to) + 0.5 / PATH_SEGMENTS;
          for (const p of paths) {
            if (p.at >= lo && p.at <= hi) p.heat = 1;
          }
        };

        /// Move the left run's objects along their paths, and redraw the
        /// lines between them from wherever their ends now are.
        const glide = (t) => {
          for (const p of parts) {
            if (p.side !== 0) continue;
            const d = shift.get(p.key);
            if (d) p.obj.position.copy(p.base).addScaledVector(d, t);
          }
          for (const e of edges) {
            const df = shift.get(e.fromKey);
            const dt = shift.get(e.toKey);
            if (!df && !dt) continue;
            // The left run's bases are where things start, the right run's
            // are where they end, so each side reaches the same place from
            // its own end: L + d*t is R - d*(1 - t).
            const k = e.side === 0 ? t : -(1 - t);
            const a = e.fromBase.clone();
            const b = e.toBase.clone();
            if (df) a.addScaledVector(df, k);
            if (dt) b.addScaledVector(dt, k);
            // Written in place: `setFromPoints` allocates a new attribute
            // every call, once per edge per fader move.
            const pos = e.geo.attributes.position;
            pos.setXYZ(0, a.x, a.y, a.z);
            pos.setXYZ(1, b.x, b.y, b.z);
            pos.needsUpdate = true;
          }
          for (const a of acts) {
            const df = shift.get(a.fromKey);
            const dt = shift.get(a.toKey);
            if (!df && !dt) continue;
            const k = a.side === 0 ? t : -(1 - t);
            const from = a.fromBase.clone();
            const to = a.toBase.clone();
            if (df) from.addScaledVector(df, k);
            if (dt) to.addScaledVector(dt, k);
            const dir = new THREE.Vector3().subVectors(to, from);
            const span = dir.length();
            if (span < 1e-6) continue;
            dir.normalize();
            const head = to.clone().addScaledVector(dir, a.hover);
            const want = Math.max(0.001, span + a.hover * 1.6);
            a.shaft.position.copy(from).add(head).multiplyScalar(0.5);
            a.shaft.quaternion.setFromUnitVectors(ALONG_Y, dir);
            // Scaled, not rebuilt: the cylinder's length is in its geometry.
            a.shaft.scale.y = want / a.baseLen;
            if (a.marker) {
              a.marker.position.copy(head);
              a.marker.quaternion.setFromUnitVectors(ALONG_Y, dir);
            }
          }
        };

        /// An object only one run has gets its own material, because the
        /// fade and the colour below apply to it alone and the rest of its
        /// side shares one material per shape kind.
        const lone = [];
        const loneEdges = [];
        const loneActs = [];
        if (shift.size) {
          for (const p of parts) {
            const isLone = !matched(p.key);
            if (!isLone) continue;
            p.obj.material = p.obj.material.clone();
            p.obj.material.transparent = true;
            sideGroups[p.side].mats.push(p.obj.material);
            materials.push(p.obj.material);
            lone.push(p);
          }
          // Whether an edge survives is a question about the edge, not about
          // its ends. Removing a cell rewires the tree: for the tree pair, 25
          // edges are in both runs, 5 only in the left and 3 only in the
          // right -- and some of those have ends present in both. Testing the
          // ends drew the left run's wiring at the right run's positions,
          // which produced a tree that was not a binary tree.
          const idsOf = (list, side) =>
            new Set(list.filter((e) => e.side === side).map((e) => e.id));
          const leftIds = idsOf(edges, 0);
          const rightIds = idsOf(edges, 1);
          for (const e of edges) {
            const inBoth = leftIds.has(e.id) && rightIds.has(e.id);
            e.shared = inBoth;
            if (inBoth) continue;
            // Only in one run, so it has to arrive or leave.
            e.line.material = e.line.material.clone();
            e.line.material.transparent = true;
            sideGroups[e.side].mats.push(e.line.material);
            materials.push(e.line.material);
            loneEdges.push(e);
          }
          // The same for actions, which had been drawn from both runs at
          // once: every shared action appeared twice, one copy over the
          // other, and neither moved.
          const leftActs = idsOf(acts, 0);
          const rightActs = idsOf(acts, 1);
          for (const a of acts) {
            a.shared = leftActs.has(a.id) && rightActs.has(a.id);
            if (a.shared) continue;
            const own = a.shaft.material.clone();
            own.transparent = true;
            a.shaft.material = own;
            if (a.marker) {
              a.marker.traverse
                ? a.marker.traverse((o) => { if (o.material) o.material = own; })
                : (a.marker.material = own);
            }
            sideGroups[a.side].mats.push(own);
            materials.push(own);
            loneActs.push(a);
          }
        }

        const setMix = (t) => {
          if (sideGroups.length < 2) return;
          if (t !== mixNow) heatTrail(mixNow, t);
          mixNow = t;
          if (!shift.size) {
            // Nothing matched, so there is nothing to glide: fall back to the
            // dissolve, which is still the right answer for two unrelated
            // scenes.
            sideGroups.forEach((s, i) => {
              s.opacity = fade(i === 0 ? t : 1 - t);
              paintSide(s);
            });
            return;
          }
          glide(t);
          // The left run carries every matched object and is always drawn;
          // the right run contributes only what the left does not have.
          sideGroups[0].opacity = 1;
          sideGroups[1].opacity = 1;
          sideGroups.forEach(paintSide);
          for (const p of parts) {
            if (matched(p.key)) p.obj.visible = p.side === 0;
          }
          // The left run's lines are redrawn to wherever their ends now are,
          // so the right run's copies of the same lines are duplicates. At
          // the far right they land on top of the originals, which read as
          // twice as many edges as the scene has.
          for (const e of edges) {
            // An edge both runs have is drawn once, from the left; the right
            // run's copy of it would land on top of the original.
            if (e.shared) { e.line.visible = e.side === 0; continue; }
          }
          // Peaks at the halfway mark and falls away towards either end.
          //
          // Halfway is where a node only one run has is worth looking at: it
          // is the moment the edit is happening rather than the moment before
          // or after. At its own end it is an ordinary object of an ordinary
          // colour, and at the far end it is gone.
          //
          // Held opaque through the peak, so the brightest moment is not also
          // the most transparent one.
          const peak = Math.max(0, 1 - Math.abs(t - 0.5) * 2);
          for (const a of acts) {
            if (a.shared) {
              a.shaft.visible = a.side === 0;
              if (a.marker) a.marker.visible = a.side === 0;
            }
          }
          for (const a of loneActs) {
            const near = a.side === 0 ? 1 - t : t;
            const lit = Math.max(near, peak);
            a.shaft.material.opacity = lit;
            a.shaft.visible = lit > 0.02;
            if (a.marker) a.marker.visible = lit > 0.02;
          }
          for (const e of loneEdges) {
            const near = e.side === 0 ? 1 - t : t;
            const m = e.line.material;
            m.opacity = Math.max(near, peak);
            e.line.visible = m.opacity > 0.02;
          }
          // An object about to be lost fades as the fader leaves it, and an
          // object about to arrive fades in as the fader reaches it.
          for (const p of lone) {
            const near = p.side === 0 ? 1 - t : t;
            const m = p.obj.material;
            m.opacity = Math.max(near, peak);
            m.visible = true;
            p.obj.visible = m.opacity > 0.02;
            if (m.emissive) {
              // The same magenta a changed node's indicator uses. One
              // colour for "the two runs do not agree about this", whether
              // the disagreement is that a node changed or that it is only
              // in one of them -- three shades for three flavours of the
              // same fact was harder to read than one.
              //
              // Strongest as the object is lost or gained, which is the
              // moment worth looking at.
              m.emissive.setHex(PAIR_DISAGREE);
              m.emissiveIntensity = peak * 2.2;
            }
          }
        };

        /// Light the side the fader is moving towards, and push the decay
        /// back. Called per input, so holding the fader in motion holds the
        /// glow, and releasing it lets the glow go.
        /// Note that the fader moved, so the trails have a baseline to show
        /// against for a moment. Which way it moved no longer matters here --
        /// the trail itself carries the direction.
        const MOVING_MS = 2000;
        const noteMoved = () => {
          if (sideGroups.length < 2) return;
          movingUntil = performance.now() + MOVING_MS;
          showPaths(1);
        };

        let movingUntil = 0;
        let lastCool = performance.now();
        let lastSpin = performance.now();
        sideGroups.forEach((s) => { s.opacity = 1; });
        setMix(0.5);

        /// Sweeping the fader by itself, so a pair can be watched with both
        /// hands free -- which is what it is for when it is being shown to
        /// someone rather than driven.
        ///
        ///    Eased rather than linear, and with a pause at each end. A
        /// linear sweep arrives at an end and leaves immediately, so the
        /// arrangement you were trying to see is gone before you have seen
        /// it; the dwell is what makes the two runs legible as two runs. The
        /// motion between is a cosine, which is the sine-wave feel of easing
        /// out of one end and into the other.
        const PING_DWELL = 0.18;
        let pinging = false;
        let pingButton = null;
        // Declared here rather than where the control is built: the frame
        // loop reads it, and the loop starts first.
        let faderInput = null;
        let pingPhase = 0;
        let pingPeriodMs = 6000;

        const pingAt = (phase) => {
          const move = (1 - 2 * PING_DWELL) / 2;
          if (phase < PING_DWELL) return 0;
          if (phase < PING_DWELL + move) {
            const u = (phase - PING_DWELL) / move;
            return 0.5 - 0.5 * Math.cos(u * Math.PI);
          }
          if (phase < 2 * PING_DWELL + move) return 1;
          const u = (phase - 2 * PING_DWELL - move) / move;
          return 0.5 + 0.5 * Math.cos(u * Math.PI);
        };

        const HEIGHTS = { above: 52, beside: 6, below: -38 };
        let orbiting = null;
        let orbitAz = (Math.atan2(away.x, away.z) * 180) / Math.PI;
        let orbitRate = 12;
        let orbitReach = 1;

        const placeCamera = () => {
          if (orbiting === null) return;
          const d = fittedDistance * orbitReach;
          const el = (HEIGHTS[orbiting] * Math.PI) / 180;
          const az = (orbitAz * Math.PI) / 180;
          const flat = Math.cos(el) * d;
          camera.position.set(
            controls.target.x + Math.sin(az) * flat,
            controls.target.y + Math.sin(el) * d,
            controls.target.z + Math.cos(az) * flat
          );
          camera.lookAt(controls.target);
        };

        const anim = { id: 0 };
        const tick = () => {
          anim.id = requestAnimationFrame(tick);
          // The glow decays on the clock rather than per frame, so it lasts
          // the same time whatever the frame rate, and stops touching
          // materials once it is spent.
          // The trail cools whether or not the fader is still moving, so it
          // is shed on elapsed time rather than per frame.
          const now = performance.now();
          const shed = (now - lastCool) / TRAIL_MS;
          lastCool = now;
          let anyHeat = false;
          for (const p of paths) {
            if (p.heat > 0) {
              p.heat = Math.max(0, p.heat - shed);
              anyHeat = true;
            }
          }
          if (movingUntil || anyHeat) {
            const left = movingUntil
              ? (movingUntil - performance.now()) / MOVING_MS : 0;
            const g = left > 0 ? left : 0;
            showPaths(g);
            if (g === 0 && !anyHeat) movingUntil = 0;
          }
          if (orbiting !== null) {
            orbitAz = (orbitAz + (orbitRate * (now - lastSpin)) / 1000) % 360;
            placeCamera();
          }
          if (pinging && sideGroups.length > 1) {
            pingPhase = (pingPhase + (now - lastSpin) / pingPeriodMs) % 1;
            const t = pingAt(pingPhase);
            // The control is moved to match, without dispatching: an `input`
            // event is how the user's own hand is told apart from this, and
            // that is what stops the sweep.
            if (faderInput) faderInput.value = String(t);
            noteMoved();
            setMix(t);
          }
          lastSpin = now;
          controls.update();
          renderer.render(scene, camera);
        };
        tick();

        const observer = new ResizeObserver(() => {
          const w = host.clientWidth, h = host.clientHeight;
          if (!w || !h) return;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        });
        observer.observe(host);

        const hint = document.createElement("div");
        hint.className = "hint";
        // Totals across every side, since `shapes` and friends belong to one
        // side's turn through the loop above.
        const tot = (k) => parsed.reduce((n, d) => n + d[k].length, 0);
        hint.textContent =
          // "shapes" rather than "objects": the objects array holds all
          // three kinds, and the output panel reports its total, so calling
          // the boxes and orbs "objects" here reads as a contradiction.
          `${tot("shapes")} shapes, ${tot("links")} pointers` +
          (tot("actions") ? `, ${tot("actions")} actions` : "") +
          (sideGroups.length > 1 ? " · across both runs" : "") +
          " · drag to orbit, scroll to zoom";
        host.appendChild(hint);

        // Named on the picture, because a screenshot arrives without the URL
        // that produced it and "which example is this" is the first question
        // anyone asks of one.
        let caption = null;
        if (preset && preset.key) {
          caption = document.createElement("div");
          caption.className = "caption";
          const kind = document.createElement("span");
          kind.className = "kind";
          kind.textContent =
            (preset.kind === "body" ? "body of " : preset.kind + "  ");
          const name = document.createElement("span");
          name.textContent = preset.key;
          caption.append(kind, name);
          host.appendChild(caption);
        }

        // Where the camera is, in terms anyone can repeat: how far round, how
        // far up, how far back. Written on a change rather than every frame,
        // since it only moves when someone moves it.
        const readout = document.createElement("div");
        readout.className = "camera";
        host.appendChild(readout);
        const showCamera = () => {
          const off = camera.position.clone().sub(controls.target);
          const dist = off.length();
          const az = (Math.atan2(off.x, off.z) * 180) / Math.PI;
          const el = (Math.asin(dist ? off.y / dist : 0) * 180) / Math.PI;
          const one = (n) => (Math.round(n * 10) / 10).toFixed(1);
          readout.textContent =
            `camera  around ${Math.round(az)}°  up ${Math.round(el)}°  ` +
            `back ${one(dist)}  ·  looking at ` +
            `(${one(controls.target.x)}, ${one(controls.target.y)}, ${one(controls.target.z)})`;
        };

        // The crossfader, when two runs share the canvas.
        let fader = null;
        if (sideGroups.length > 1) {
          fader = document.createElement("div");
          fader.className = "fader";
          const left = document.createElement("span");
          left.textContent = sideGroups[0].label || "left";
          const right = document.createElement("span");
          right.textContent = sideGroups[1].label || "right";
          const range = document.createElement("input");
          range.type = "range";
          range.min = "0";
          range.max = "1";
          range.step = "0.01";
          range.value = "0.5";
          range.setAttribute("aria-label", "Fade between the two runs");
          let was = Number(range.value);
          range.addEventListener("input", () => {
            // Only the user's own hand reaches here; the sweep sets `value`
            // without dispatching, precisely so that this can tell them apart.
            pinging = false;
            if (pingButton) pingButton.setAttribute("aria-pressed", "false");
            const now = Number(range.value);
            if (now !== was) noteMoved();
            was = now;
            setMix(now);
          });
          fader.append(left, range, right);
          host.appendChild(fader);
          faderInput = range;
        }

        // Only when there is something for it to govern.
        let trail = null;
        if (paths.length) {
          trail = document.createElement("div");
          trail.className = "trail";
          const cap = document.createElement("span");
          cap.textContent = "trail";
          const dial = document.createElement("input");
          dial.type = "range";
          dial.min = "0";
          dial.max = "6";
          dial.step = "0.1";
          dial.value = String(trailGain);
          dial.setAttribute("aria-label", "How strongly glide indicators show");
          dial.addEventListener("input", () => {
            trailGain = Number(dial.value);
            // Light the whole trail while it is being set, so the effect of
            // the control is visible without also dragging the fader.
            heatTrail(0, 1);
            movingUntil = performance.now() + MOVING_MS;
            showPaths(1);
          });
          trail.append(cap, dial);
          host.appendChild(trail);
        }

        /// Walk around the scene, from above, beside, or below.
        ///
        ///    Three heights and a circle. Aiming from a fixed elevation and
        /// turning is how a person looks at a thing on a table, and it shows
        /// depth in a way no single view does -- which for a pair matters,
        /// since the two runs differ in three dimensions and a still picture
        /// flattens one of them away.
        ///
        ///    Dragging stops it. A control that fights the mouse is worse
        /// than no control, and wanting to look at something is exactly when
        /// the automatic motion should get out of the way.
        const orbit = document.createElement("div");
        orbit.className = "orbit";
        const where = document.createElement("div");
        where.className = "where";
        const buttons = {};
        for (const name of ["above", "beside", "below"]) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = name;
          b.setAttribute("aria-pressed", "false");
          b.addEventListener("click", () => {
            // Pressing the one already running stops it, so the same button
            // both starts and ends the walk.
            orbiting = orbiting === name ? null : name;
            for (const [n, el] of Object.entries(buttons))
              el.setAttribute("aria-pressed", String(orbiting === n));
            placeCamera();
            showCamera();
          });
          buttons[name] = b;
          where.appendChild(b);
        }
        const dials = {};
        const dial = (text, min, max, step, value, onInput) => {
          const label = document.createElement("label");
          const cap = document.createElement("span");
          cap.textContent = text;
          const r = document.createElement("input");
          r.type = "range";
          r.min = String(min); r.max = String(max);
          r.step = String(step); r.value = String(value);
          r.setAttribute("aria-label", text);
          r.addEventListener("input", () => onInput(Number(r.value)));
          label.append(cap, r);
          dials[text] = r;
          return label;
        };
        orbit.append(
          where,
          dial("spin", 0, 60, 1, orbitRate, (v) => { orbitRate = v; }),
          dial("out", 0.4, 3, 0.05, orbitReach, (v) => {
            orbitReach = v;
            placeCamera();
            showCamera();
          })
        );
        if (sideGroups.length > 1) {
          const row = document.createElement("div");
          row.className = "where";
          pingButton = document.createElement("button");
          pingButton.type = "button";
          pingButton.textContent = "ping-pong";
          pingButton.setAttribute("aria-pressed", "false");
          pingButton.addEventListener("click", () => {
            pinging = !pinging;
            pingButton.setAttribute("aria-pressed", String(pinging));
          });
          row.appendChild(pingButton);
          orbit.append(
            row,
            // Seconds for a there-and-back, which is the unit anyone watching
            // it would use. Inverted, so rightwards is faster like the others.
            dial("pace", 1.5, 14, 0.5, pingPeriodMs / 1000, (v) => {
              pingPeriodMs = (15.5 - v) * 1000;
            })
          );
        }
        host.appendChild(orbit);

        const stopOrbit = () => {
          if (orbiting === null) return;
          orbiting = null;
          for (const el of Object.values(buttons))
            el.setAttribute("aria-pressed", "false");
        };

        /// While the walk is on, the pointer means something different, and
        /// the difference is whether it moved.
        ///
        ///    A drag moves what the walk is walking around. Circling a scene
        /// is only useful if you can choose what to circle, and stopping the
        /// walk to reposition and starting it again is three actions for one
        /// intention. So a drag pans the centre and the walk keeps going
        /// around wherever it now is.
        ///
        ///    A click -- pressed and released without moving -- stops it.
        /// That is the gesture for "enough, let me look", and it needs to
        /// stay available or the walk cannot be dismissed by hand at all.
        ///
        ///    Taken before `controls` sees any of it, since its own reading
        /// of a left-drag is to rotate, and a rotation fights a walk.
        const DRAG_SLOP = 3;
        let holding = null;

        const panTarget = (dx, dy) => {
          const d = fittedDistance * orbitReach;
          const vHalf = (camera.fov * Math.PI) / 360;
          const perPixel =
            (2 * Math.tan(vHalf) * d) /
            Math.max(1, renderer.domElement.clientHeight);
          const right = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 0);
          const up = new THREE.Vector3().setFromMatrixColumn(camera.matrix, 1);
          controls.target.addScaledVector(right, -dx * perPixel);
          controls.target.addScaledVector(up, dy * perPixel);
        };

        renderer.domElement.addEventListener("pointerdown", (e) => {
          if (orbiting === null) return;
          e.preventDefault();
          e.stopPropagation();
          holding = { x: e.clientX, y: e.clientY, moved: false, id: e.pointerId };
          renderer.domElement.setPointerCapture(e.pointerId);
        }, { capture: true });

        renderer.domElement.addEventListener("pointermove", (e) => {
          if (orbiting === null || !holding) return;
          const dx = e.clientX - holding.x;
          const dy = e.clientY - holding.y;
          if (!holding.moved &&
              Math.abs(dx) + Math.abs(dy) < DRAG_SLOP) return;
          holding.moved = true;
          holding.x = e.clientX;
          holding.y = e.clientY;
          panTarget(dx, dy);
          placeCamera();
          showCamera();
        }, { capture: true });

        const releaseHold = (e) => {
          if (!holding) return;
          const wasClick = !holding.moved;
          try { renderer.domElement.releasePointerCapture(holding.id); } catch (_) {}
          holding = null;
          if (wasClick) stopOrbit();
        };
        renderer.domElement.addEventListener("pointerup", releaseHold, { capture: true });
        renderer.domElement.addEventListener("pointercancel", releaseHold, { capture: true });

        // Not walking: the pointer belongs to `controls`, and taking hold of
        // the scene is just taking hold of the scene.

        // So the wheel moves the distance instead, while the walk is on.
        // Taken before `controls` sees it, or the camera would be dollied as
        // well and the two would fight over where it goes.
        renderer.domElement.addEventListener(
          "wheel",
          (e) => {
            if (orbiting === null) return;
            e.preventDefault();
            e.stopPropagation();
            const out = dials.out;
            const step = e.deltaY > 0 ? 1.08 : 1 / 1.08;
            orbitReach = Math.min(3, Math.max(0.4, orbitReach * step));
            if (out) out.value = String(orbitReach);
            placeCamera();
            showCamera();
          },
          { capture: true, passive: false }
        );

        /// Everything about how this is being looked at that the program did
        /// not decide.
        ///
        ///    A link already carries which example to run. What it has not
        /// carried is where the camera stands, whether it is walking, how
        /// strongly the indicators show, and where the fader sits -- and
        /// those are most of what makes a particular view worth sending to
        /// someone. Without them a link means "look at this example" when
        /// what was meant was "look at this".
        ///
        ///    Angles are rounded and the distance kept to one decimal: this
        /// goes in a URL a person may read, and nobody needs the camera
        /// restored to a millionth of a degree.
        const round1 = (n) => Math.round(n * 10) / 10;
        const getView = () => {
          const off = camera.position.clone().sub(controls.target);
          const dist = off.length();
          const az = Math.round((Math.atan2(off.x, off.z) * 180) / Math.PI);
          const el = Math.round((Math.asin(dist ? off.y / dist : 0) * 180) / Math.PI);
          const v = {
            cam: [az, el, round1(dist),
                  round1(controls.target.x), round1(controls.target.y),
                  round1(controls.target.z)].join(","),
            out: round1(orbitReach),
            trail: round1(trailGain),
          };
          if (orbiting !== null) { v.walk = orbiting; v.spin = Math.round(orbitRate); }
          if (sideGroups.length > 1) {
            v.mix = Math.round(mixNow * 100) / 100;
            if (pinging) v.pong = round1(15.5 - pingPeriodMs / 1000);
          }
          return v;
        };

        const applyView = (v) => {
          if (!v) return;
          if (v.trail !== undefined) {
            trailGain = Number(v.trail);
            if (dials.trail) dials.trail.value = String(trailGain);
            const t = document.querySelector(".viewport .trail input");
            if (t) t.value = String(trailGain);
          }
          if (v.out !== undefined) {
            orbitReach = Number(v.out);
            if (dials.out) dials.out.value = String(orbitReach);
          }
          if (v.spin !== undefined) {
            orbitRate = Number(v.spin);
            if (dials.spin) dials.spin.value = String(orbitRate);
          }
          if (v.mix !== undefined && faderInput) {
            faderInput.value = String(v.mix);
            setMix(Number(v.mix));
          }
          // The camera before the walk: starting a walk recomputes the
          // position from its own height, so a camera set afterwards would
          // be overwritten on the next frame.
          if (v.cam) {
            const n = String(v.cam).split(",").map(Number);
            if (n.length === 6 && n.every((x) => Number.isFinite(x))) {
              const [az, el, dist, tx, ty, tz] = n;
              controls.target.set(tx, ty, tz);
              const a = (az * Math.PI) / 180;
              const e = (el * Math.PI) / 180;
              const flat = Math.cos(e) * dist;
              camera.position.set(
                tx + Math.sin(a) * flat, ty + Math.sin(e) * dist,
                tz + Math.cos(a) * flat
              );
              camera.lookAt(controls.target);
              controls.update();
              orbitAz = az;
            }
          }
          if (v.walk && buttons[v.walk]) {
            orbiting = v.walk;
            for (const [n, el] of Object.entries(buttons))
              el.setAttribute("aria-pressed", String(orbiting === n));
            placeCamera();
          }
          if (v.pong !== undefined && pingButton) {
            pingPeriodMs = (15.5 - Number(v.pong)) * 1000;
            if (dials.pace) dials.pace.value = String(v.pong);
            pinging = true;
            pingButton.setAttribute("aria-pressed", "true");
          }
          showCamera();
        };

        showCamera();
        controls.addEventListener("change", showCamera);

        // A link says where to stand; failing that, stand where the last
        // run left us. Both are spent here, so a scene asked for afresh
        // later does not snap back to either.
        applyView(pendingView || carriedView);
        pendingView = null;
        carriedView = null;

        mounted = {
          renderer, controls, geometries, materials, textures, observer, hint,
          caption, readout,
          setMix, sideCount: sideGroups.length, fader, trail, orbit,
          getView, applyView,
          get frame() { return anim.id; },
        };
        return true;
      };

      /// A heading inside a panel, saying which run is below it.
      const runRule = (into, text) => {
        const rule = document.createElement("div");
        rule.className = "forest-rule";
        rule.textContent = text;
        into.appendChild(rule);
      };

      /// What differs, as a line of counts, above both runs.
      const diffLine = (into, c) => {
        const d = document.createElement("div");
        d.className = "forest-rule";
        d.textContent =
          `${c.changed} of ${c.total} nodes differ ` +
          `(${(c.fraction * 100).toFixed(1)}%) — ` +
          `${c.equal} equal, ${c.notEqual} not equal, ` +
          `${c.onlyLeft} only left, ${c.onlyRight} only right`;
        into.appendChild(d);
      };

      /// An `#[examplePair]`: the left run, the right run, and the diff.
      ///
      /// Both runs share the one canvas, under a group each, with a
      /// crossfader to dissolve between them: a second WebGL context to look
      /// at the same structure twice is a lot of machinery for a comparison
      /// that reads better as a dissolve. The outline panel has room for
      /// both side by side, so it shows both.
      const showPair = (pair) => {
        const counts = diffCounts(pair.sizes);
        const side = (s) => (s && s.value) || {};
        const L = side(pair.left), R = side(pair.right);
        const arr = (v) => (v && Array.isArray(v.value) ? v.value : []);
        const lObj = arr(L.objects), rObj = arr(R.objects);

        fillScenePanel(
          "objects", L.objects, lObj.length + rObj.length,
          "Neither run placed anything in space. A pair offers objects by evaluating to:",
          (body) => {
            diffLine(body, counts);
            runRule(body,
              `both runs drawn above — left ${lObj.length} objects, ` +
              `right ${rObj.length} — fade between them with the slider`);
          }
        );
        const host = $("viewport");
        if (lObj.length || rObj.length) {
          host.hidden = false;
          mountObjects([
            { list: L.objects, label: "left" },
            { list: R.objects, label: "right" },
          ], pair.keys).catch((e) => {
            host.hidden = true;
            $("objects-body").textContent = "could not draw the scene: " + e;
          });
        } else {
          host.hidden = true;
          disposeScene();
        }

        const lOut = L.outline ? vArr(L.outline) : [];
        const rOut = R.outline ? vArr(R.outline) : [];
        if (!lOut.length && !rOut.length && pairSource) {
          // Left behind on purpose. Say so, and fetch them if this is the
          // panel being looked at.
          fillScenePanel(
            "outline", L.outline, 1,
            "",
            (body) => {
              diffLine(body, counts);
              runRule(body,
                "outlines are fetched when this panel is opened — they are " +
                "most of what a pair costs to hand over, and the objects are " +
                "what it is for");
            }
          );
          refreshPairOutlines();
        } else {
          fillScenePanel(
            "outline", L.outline, lOut.length + rOut.length,
            "Neither run offered an outline. A pair offers one by evaluating to:",
            (body) => {
              diffLine(body, counts);
              [["left", lOut], ["right", rOut]].forEach(([name, forest]) => {
                runRule(body, `${name} — ${forest.length} tree${forest.length === 1 ? "" : "s"}`);
                forest.forEach((tree) => drawOutline(body, tree, 0));
              });
            }
          );
        }
        lastPairCounts = counts;
      };

      const showScene = (reply) => {
        const asPair = pairOf(reply);
        if (asPair) return showPair(asPair);
        const scene = sceneOf(reply);
        const fields = scene && scene.value ? scene.value : {};
        const objects = fields.objects;
        const outline = fields.outline;
        const objectCount =
          objects && Array.isArray(objects.value) ? objects.value.length : 0;
        fillScenePanel(
          "objects",
          objects,
          objectCount,
          "Nothing placed in space. A program offers objects by evaluating to:"
        );
        const host = $("viewport");
        if (objectCount) {
          host.hidden = false;
          $("objects-body").hidden = true;
          mountObjects(objects).catch((e) => {
            // If three.js will not load, say so and fall back to the value.
            host.hidden = true;
            $("objects-body").hidden = false;
            $("objects-body").textContent = "could not draw the scene: " + e;
          });
        } else {
          host.hidden = true;
          disposeScene();
        }
        // A forest, in the order the provider chose. Empty says this example
        // offered none, which is what an empty `objects` says about objects.
        const forest = outline ? vArr(outline) : [];
        fillScenePanel(
          "outline",
          outline,
          forest.length,
          "No outline. A program offers one by evaluating to:",
          forest.length
            ? (body) => {
                forest.forEach((tree, i) => {
                  if (i > 0) {
                    const rule = document.createElement("div");
                    rule.className = "forest-rule";
                    rule.textContent = `tree ${i + 1} of ${forest.length}`;
                    body.appendChild(rule);
                  }
                  drawOutline(body, tree, 0);
                });
              }
            : null
        );
      };

      /// The counts of the pair on screen, so a later outline fetch can head
      /// its panel the same way the objects panel is headed.
      let lastPairCounts = null;

      /// Fetch and draw a pair's outlines, once, when their panel is open.
      ///
      /// Same shape as `refreshEvents`: nothing happens until the panel is
      /// the one being looked at, and what it needs is asked for then.
      let pairOutlinesShown = false;
      const refreshPairOutlines = () => {
        if (!ready || !pairSource) return;
        if (libEl.dataset.view !== "outline") return;
        if (pairOutlinesShown) return;
        const program = pairOutlinesProgram(pairSource);
        if (!program) return;
        let reply;
        try {
          reply = JSON.parse(fumola_eval_scratch(instance, program));
        } catch (e) { return; }
        if (!reply.ok || !reply.value) return;
        const f = reply.value;
        const lOut = f.left ? vArr(f.left) : [];
        const rOut = f.right ? vArr(f.right) : [];
        pairOutlinesShown = true;
        fillScenePanel(
          "outline", f.left, lOut.length + rOut.length,
          "Neither run offered an outline.",
          (body) => {
            if (lastPairCounts) diffLine(body, lastPairCounts);
            [["left", lOut], ["right", rOut]].forEach(([name, forest]) => {
              runRule(body,
                `${name} — ${forest.length} tree${forest.length === 1 ? "" : "s"}`);
              forest.forEach((tree) => drawOutline(body, tree, 0));
            });
          }
        );
      };

      const showShare = () => {
        const b = $("share");
        b.hidden = !preset;
        b.classList.remove("done");
        if (preset) b.textContent = preset.kind === "body" ? "share body" : "share";
      };

      const loadTest = (path, test) => {
        // An example answers with a picture, so show the picture --
        // whichever panel was last open, since arriving at an example's
        // objects is the point of clicking one. A test answers with a value,
        // and the panel that belongs in is already the one showing.
        if (test.kind === "example" || test.kind === "examplePair")
          setView("objects");
        srcEl.value = invocationFor(path, test);
        // A link says which kind of thing it names, so it reads as what it is.
        setPreset(test.kind === "test" ? "test" : test.kind, path, test);
        paint();
        evaluate();
      };

      // The test's own code, ready to change, rather than a call to it. The
      // import comes too, since the body will lean on the module's names --
      // and where it leans on them unqualified, that is the first thing to
      // fix by hand, which is the point of having it here.
      const loadTestBody = (path, test) => {
        if (!test.body) return;
        // An example answers with a picture, so show the picture --
        // whichever panel was last open, since arriving at an example's
        // objects is the point of clicking one. A test answers with a value,
        // and the panel that belongs in is already the one showing.
        if (test.kind === "example" || test.kind === "examplePair")
          setView("objects");

        const name = `${test.scope ? test.scope + "." : ""}${test.name}`;
        const { text, changed } = qualify(
          dedent(currentSource.slice(test.body.start, test.body.end)), test, currentSource
        );
        // Only the imports this body actually reaches for; the module's
        // other six would be noise around three lines of test.
        const used = importsOf(currentSource, path).filter((im) =>
          new RegExp(`\\b${im.alias}\\b`).test(text)
        );
        srcEl.value =
          [`import M "${path}";`]
            .concat(used.map((im) => `import ${im.alias} "${im.path}";`))
            .join("\n") +
          `\n// ${name}` +
          (changed ? ", with its own module's names qualified" : "") +
          `\n${text}`;
        setPreset("body", path, test);
        paint();
        evaluate();
      };

      let currentSource = "";

      const showModule = (path, button, focus) => {
        for (const b of document.querySelectorAll("#modules button"))
          b.removeAttribute("aria-current");
        // A link arrives with no button to mark; a click brings its own.
        if (button) button.setAttribute("aria-current", "true");
        libEl.classList.add("has-source");
        $("current").textContent = path.replace(/^fumola\//, "");
        // Picking a file is the end of navigating, so the outline gets out of
        // the way. The toggle brings it back at half.
        setOutline(false);
        const reply = JSON.parse(fumola_module_source(path));
        const pane = $("source");
        pane.textContent = "";
        if (!reply.ok) {
          pane.innerHTML = '<div class="empty"></div>';
          pane.firstChild.textContent = reply.error;
          return;
        }
        // Every `#[test]` above a public test becomes a link that runs it.
        const tests = testsIn(reply.source);
        const marks = new Map();
        tests.forEach((t, i) => marks.set(t.start, { end: t.end, index: i }));

        const row = document.createElement("div");
        row.className = "code-lines";
        const gutter = document.createElement("pre");
        gutter.className = "gutter";
        gutter.setAttribute("aria-hidden", "true");
        const lines = reply.source.split("\n").length;
        gutter.textContent = Array.from({ length: lines }, (_, i) => i + 1).join("\n");
        const pre = document.createElement("pre");
        const code = document.createElement("code");
        code.innerHTML = highlight(reply.source, marks);
        pre.appendChild(code);
        row.append(gutter, pre);
        pane.appendChild(row);
        currentSource = reply.source;
        for (const b of code.querySelectorAll(".body-here")) {
          b.addEventListener("click", () =>
            loadTestBody(path, tests[Number(b.dataset.test)]));
        }
        const links = code.querySelectorAll(".run-here");
        for (const b of links) {
          const t = tests[Number(b.dataset.test)];
          b.title = "Run " + invocationFor(path, t).split("\n")[1];
          b.addEventListener("click", () => loadTest(path, t));
        }

        pane.scrollTop = 0;
        // Arriving from the tests tree: put that test's marker on the top
        // line, so the source opens at the thing that was clicked rather
        // than at the top of the file.
        if (focus) {
          const i = tests.findIndex(
            (t) => t.name === focus.name && t.scope === focus.scope
          );
          const el = i >= 0 ? links[i] : null;
          if (el) {
            el.setAttribute("aria-current", "true");
            pane.scrollTop +=
              el.getBoundingClientRect().top - pane.getBoundingClientRect().top;
          }
        }
      };

      // ---- evaluation ---------------------------------------------------
      const show = (v) => {
        if (v === null || v === undefined) return "?";
        switch (v.tag) {
          case "Unit": return "()";
          case "Null": return "null";
          case "Option": return "?(" + show(v.value) + ")";
          // Quoted, like every other part of this rendering is Fumola source.
          // Unquoted, a text field ran into the structure around it -- and a
          // string beginning with # was coloured as a variant tag, because
          // the lexer had no reason to think otherwise. JSON's escaping is
          // close enough to Fumola's and unambiguous.
          case "String": return JSON.stringify(v.value);
          case "Symbol": return symbolSource(v.value);
          case "List": return "[" + v.value.map(show).join(", ") + "]";
          case "Tuple": return "(" + v.value.map(show).join(", ") + ")";
          case "Record":
            return "{" + Object.entries(v.value)
              .map(([k, f]) => k + " = " + show(f)).join("; ") + "}";
          case "Variant":
            return "#" + v.value.name +
              (v.value.value === null ? "" : "(" + show(v.value.value) + ")");
          case "AdaptonPointer": return "pointer(" + v.value.source + ")";
          case "Pointer": return JSON.stringify(v.value);
          default: return String(v.value);
        }
      };
      const symbolSource = (s) => {
        if (s === null || typeof s !== "object") return String(s);
        switch (s.tag) {
          case "Num": return String(s.value);
          case "Name": return "`" + s.value;
          case "Call": return symbolSource(s.fun) + "(" + symbolSource(s.arg) + ")";
          case "Dot": return symbolSource(s.left) + "." + symbolSource(s.right);
          case "UnOp": return s.op + symbolSource(s.arg);
          case "BinOp": return symbolSource(s.left) + s.op + symbolSource(s.right);
          case "QuotedAst": return s.source;
          default: return JSON.stringify(s);
        }
      };

      let timer = null;
      /// How many steps to ask for before taking a turn back.
      ///
      /// Not a constant, because the right number depends on the machine. Too
      /// few and the run is mostly round trips; too many and each chunk is a
      /// freeze long enough to see. So it is measured: aim each chunk at
      /// CHUNK_TARGET_MS of work and scale the request by how long the last
      /// one actually took, within bounds that keep a bad measurement from
      /// running away.
      const CHUNK_TARGET_MS = 25;
      const CHUNK_MIN = 2_000;
      const CHUNK_MAX = 250_000;
      const CHUNK_MAX_GROWTH = 2;
      let chunkSteps = 20_000;

      const nextChunk = (elapsed) => {
        if (elapsed > 2) {
          const scaled = (chunkSteps * CHUNK_TARGET_MS) / elapsed;
          // Bounded, and only part of the way. An unbounded ratio ran away:
          // a fast first chunk asked for one so large that the rest of the
          // program fitted inside it, so the count was shown once and the
          // trampoline reported nothing it had not already finished.
          const capped = Math.min(scaled, chunkSteps * CHUNK_MAX_GROWTH);
          chunkSteps = Math.round(chunkSteps * 0.5 + capped * 0.5);
        }
        chunkSteps = Math.min(CHUNK_MAX, Math.max(CHUNK_MIN, chunkSteps));
        return chunkSteps;
      };

      /// Which run is current. A run whose generation is stale has been
      /// superseded -- the program changed while it was still going -- and
      /// abandons its paused computation rather than finishing work nobody
      /// is waiting for.
      let runGeneration = 0;

      /// Say that a run is under way, in the panel the answer will land in.
      ///
      /// Not an overlay. An overlay needs a visibility flag, and a flag can
      /// be left set -- which is what happened: the wait was on a frame, a
      /// frame does not come in a hidden or throttled tab, and the message
      /// stayed up with the run not yet begun. A line of text in the output
      /// panel has no such state. Whatever the run does next overwrites it,
      /// including every failure path, so there is nothing to get stuck.
      ///
      /// `fumola_eval_top` is one synchronous call and holds the main thread
      /// for its whole duration, so a message shown in the same task never
      /// paints. Hence the yield -- and `setTimeout` rather than
      /// `requestAnimationFrame`, because a timer fires in a background tab
      /// and a frame does not.
      /// What a program cost last time it ran, so the next wait can say what
      /// to expect. Keyed by the program text, which is what determines it.
      ///
      /// This is as close to progress as the page can get today. A run is one
      /// synchronous call that returns when it is finished, so there is no
      /// count to watch rise -- only last time's total to compare against.
      /// #79 is what would turn this into real progress.
      const stepsSeen = new Map();
      const commas = (n) => n.toLocaleString("en-US");

      const sayWaiting = (what) => {
        outEl.classList.remove("stale");
        // Built as nodes rather than markup: the message shares this element
        // with rendered program output, and `textContent` is what replaces it.
        outEl.textContent = "";
        const spinner = document.createElement("span");
        spinner.className = "waiting-spin";
        const label = document.createElement("span");
        label.textContent = what;
        outEl.append(spinner, label);
        return new Promise((r) => setTimeout(r, 0));
      };

      const evaluate = async () => {
        try { await ensureRuntime(); } catch (e) { return; }
        const text = srcEl.value;
        if (!text.trim()) { outEl.textContent = ""; outEl.classList.remove("stale"); return; }

        // Back to the instance as it was before anything ran. Clearing the
        // adapton store is not enough on its own: a `let` from an earlier
        // program would still be bound, so a run would not be independent of
        // the ones before it. Restoring the pristine copy is near free --
        // a Core clones in about constant time.
        if (!persistEl.checked) fumola_reset(instance);

        // A pair says what the wait is for; anything else just says to wait.
        // Still a pair if the call it ends in is the one a pair was loaded
        // with. The bindings above may say anything by now; they feed the
        // same call, which answers with the same shape.
        const stillAPair = pairTail !== null && tailOf(text) === pairTail;
        const doing =
          stillAPair
            ? "running the left, then the right, then comparing them"
            : "running";
        const expected = stepsSeen.get(text);
        // The count is real now: the run comes back between chunks and says
        // how many steps it has taken. `expected` is still worth showing
        // beside it, because a rising number means more when there is
        // something to compare it against.
        const progress = (steps) =>
          `wait… ${doing} · ${commas(steps)} Fumola steps` +
          (expected === undefined ? "" : ` of about ${commas(expected)}`);

        const generation = ++runGeneration;
        pairOutlinesShown = false;
        await sayWaiting(
          `wait… ${doing}` +
          (expected === undefined ? "" : ` · about ${commas(expected)} Fumola steps`)
        );

        // Ask a pair for its objects and leave its outlines behind.
        //
        // Opened as a call or opened as its body, either way -- and a body
        // is where this matters most, since a body is what you open in order
        // to edit, and paying for two outlines on every keystroke is what
        // would make editing feel like a poor idea.
        //
        // The text may be the user's own by now. What has to hold is not
        // that it is untouched but that it still yields a pair, since the
        // projection below reads `left`, `right`, `sizes` and `keys` off it.
        // `stillAPair`, decided above, is that question.
        const lightened = stillAPair ? lightPairProgram(text) : null;
        pairSource = lightened ? text : null;
        const toRun = lightened || text;

        let reply;
        try {
          let began = performance.now();
          reply = JSON.parse(
            fumola_eval_top_limited(instance, toRun, chunkSteps));
          while (reply.paused) {
            // Superseded: the program changed while this was running. Drop
            // the paused computation rather than finish it -- and drop it
