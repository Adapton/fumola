<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fumola — replayground</title>
  <meta name="description" content="Replay a Fumola demanded-computation graph: the outline, the event log, and the objects in space, all sharing one time cursor.">

  <!--
    ===================================================================
    The replayground
    ===================================================================

    One scene, four ways of looking at it, all sharing a single time
    cursor called the *metaTime*.

      * the OUTLINE  -- the forced-thunk tree, nested the way it ran
      * the EVENTS   -- the same run as a flat log
      * the OBJECTS  -- boxes, orbs and arrows in 3D, on the right
      * the DOORS    -- see below

    A DOOR is the central idea. Every unique thing the scene data names
    is a door you can open:

        pointer    a space; the identity a node keeps across revisions
        nodeId     [space, "@now", seq] -- one revision of a pointer.
                   Clicking one opens its pointer's door.
        edgeId     "#edgeId(1234)" -- one action from a source node to a
                   target node, possibly revised later
        metaTime   a moment

    Opening a door reveals every `.focus-detail` element tagged with that
    door's (type, id) -- they are built up front and sit at display:none
    until then. Doors nest: a pointer's door holds one metaTime door per
    revision, so opening the pointer shows *which* moments it changed and
    opening one of those moments unfolds what it changed into.

    metaTime doors are the odd one out on purpose: there is no top-level
    metaTime panel. Opening one shifts the highlight in the outline and
    the event log and unfolds whatever nested detail exists for that
    moment.

    Shift-click closes a door. `closeAllDoors()` (the ✕ in the info
    panel header) closes all of them.

    ===================================================================
    Where to change what
    ===================================================================

      scene data ......... `data`, injected by build.py
      doors .............. openDoor / closeDoor / DOOR_KINDS
      chips .............. the make*Chip helpers -- one per door kind
      info panel ......... buildPointerDoors / buildEdgeDoors
      outline ............ renderOutline
      events ............. renderEvents
      time cursor ........ playerState + renderPlayerFocus
      3D build ........... createBoxMesh / createOrbMesh / createPointerMesh
                           / createActionMesh, then buildSceneObjects
      3D sizing & picking  fitRendererToViewport / pointerToNDC / pickAt
  -->

  <style>
    /* ---- palette ------------------------------------------------------
       Unchanged from the hand-tuned original; the colours that used to be
       written inline are named here too, so nothing in the rules below is
       a bare hex any more. */
    :root {
      /* surfaces */
      --bg:        #111318;
      --bg-elev:   #171a20;
      --bg-panel:  #1b1f27;
      --void:      #000000;   /* behind the 3D scene, and behind chips */
      --gutter:    #111111;   /* the drag handles between panes */
      --header-bg: #050505;
      --title-bg:  #29082d;

      /* outline rows */
      --bg-outline-vert:                    #64727c;
      --bg-outline-edge:                    #2a1e2d;
      --bg-outline-edge-hover:              #422b48;
      --bg-outline-internal-result:         #1e1f2d;
      --bg-outline-internal-result-hover:   #2b2c48;
      --bg-outline-result: var(--bg-outline-edge);

      --border:      #2a2f3a;
      --border-soft: #222733;

      /* text */
      --text:       #a1aabb;
      --text-dim:   #97a2b3;
      --text-faint: #6f7b8d;
      --header-fg:  #a8b4ff;
      --title-fg:   #e2a8ff;

      /* accents -- one per door kind, so a colour tells you what you can
         click: purple = edgeId, blue = metaTime, green = value,
         brown = nodeId. */
      --purple: #c6a0f6;
      --blue:   #8bd5ff;
      --green:  #a6da95;
      --brown:  #e6b775;

      --blue-hover:  #c1e5fa;
      --green-hover: #c4dbbc;

      --purple-dark: #8c6fd1;
      --blue-dark:   #5ca7d9;
      --green-dark:  #7fba72;
      --brown-dark:  #875b1d;

      --ptr-thunk:            #b5b7d7;
      --ptr-nonthunk:         #c0d7b5;
      --ptr-nonthunk-border:  #899882;

      /* the moment the player is parked on */
      --now:      yellowgreen;
      --now-edge: yellow;

      /* interaction */
      --hover:  #252b36;
      --active: #303848;
      --focus-ring: #ffffff;

      --shadow:
        0 0 0 1px rgba(255, 255, 255, 0.02),
        0 6px 18px rgba(0, 0, 0, 0.35);

      --ui:   Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
              "Liberation Mono", "DejaVu Sans Mono", monospace;

      /* the sidebar's width, so the divider and the CSS set one thing */
      --sidebar-w: 50%;
      --radius: 4px;
    }

    * { box-sizing: border-box; }

    /* One knob. Everything below is in rem, so the whole app grows on a
       large screen rather than sitting small in a corner -- the same
       arrangement the web-play page uses. */
    html {
      height: 100%;
      font-size: clamp(13px, 10px + 0.35vw, 17px);
    }

    body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 400 0.85rem/1.45 var(--mono);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;          /* each pane scrolls on its own */
    }

    /* ---- frame --------------------------------------------------------- */

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      background: var(--bg);
      overflow: hidden;
    }

    #sidebar {
      flex: 0 0 var(--sidebar-w);
      display: flex;
      flex-direction: column;
      background: var(--void);
      overflow: hidden;
      /* A flex item's min-width defaults to its content. Without this the
         sidebar refuses to shrink past its widest outline row. */
      min-width: 0;
    }

    #divider {
      flex: 0 0 5px;
      cursor: col-resize;
      background: var(--gutter);
      touch-action: none;
    }
    #divider:hover, #divider.dragging { background: var(--active); }

    #viewport {
      flex: 1;
      position: relative;        /* the player bar is positioned against this */
      background: var(--void);
      overflow: hidden;
      /* The one that was missing, and the whole reason 3D picking drifted:
         the canvas is this element's content, so with min-width:auto the
         viewport could never shrink below whatever size the canvas last
         had. The app overflowed the window, two thirds of the canvas hung
         off-screen, and every ray was cast through the wrong pixel. */
      min-width: 0;
      min-height: 0;
    }

    /* The canvas is sized by CSS and only by CSS; three.js is told to set
       the drawing buffer and leave the style alone. That keeps the canvas
       out of the layout's min-content calculation. */
    #viewport canvas {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ---- sidebar panels ------------------------------------------------ */

    .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-bottom: 1px solid var(--border);
    }
    #outlinePanel { flex: 4 1 0; }
    #eventsPanel  { flex: 1 1 0; }
    #infoPanel    { flex: 0 1 auto; max-height: 40%; }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex: 0 0 auto;
      padding: 0.3rem 0.5rem;
      background: var(--header-bg);
      color: var(--header-fg);
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--border-soft);
    }
    .panel-header:hover { background: var(--hover); }
    /* The little triangle is the whole promise the header makes: click to
       collapse. It used to say cursor:pointer and do nothing. */
    .panel-header::before {
      content: "▾";
      font-size: 0.7em;
      opacity: 0.7;
      transition: transform 120ms ease;
    }
    .panel.collapsed > .panel-header::before { transform: rotate(-90deg); }
    .panel.collapsed > .panel-body { display: none; }
    .panel.collapsed { flex: 0 0 auto; }

    .panel-header .spacer { flex: 1; }
    .panel-header .count { color: var(--text-faint); font-size: 0.9em; letter-spacing: 0; }

    .header-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-faint);
      font: inherit;
      font-size: 0.9em;
      line-height: 1;
      padding: 0.15rem 0.35rem;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .header-btn:hover { color: var(--focus-ring); border-color: var(--border); background: var(--void); }

    #titlePanelHeader {
      background: var(--title-bg);
      color: var(--title-fg);
      font-size: 0.9rem;
      cursor: default;
      text-transform: none;
      letter-spacing: 0.02em;
    }
    #titlePanelHeader::before { content: none; }

    .panel-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: 0.35rem;
    }

    .splitter {
      flex: 0 0 5px;
      background: var(--gutter);
      cursor: row-resize;
      touch-action: none;
    }
    .splitter:hover, .splitter.dragging { background: var(--active); }

    /* ---- doors --------------------------------------------------------- */

    /* Built up front, hidden until their door opens. `displayTrue` /
       `displayFalse` ride on the element because a door nested inside
       another one wants `inline-block` when shut, not `none`. */
    .focus-detail { display: none; }

    .focus-detail.focused {
      margin: 2px;
      padding: 2px;
      background-color: var(--bg-panel);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius);
    }
    .focus-detail.focused.inner { border-style: none; }

    .door-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px;
      padding: 1px 0;
    }
    .door-label {
      color: var(--text-faint);
      font-size: 0.85em;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding-right: 2px;
    }

    /* ---- chips, one per door kind -------------------------------------- */

    .metaTime {
      user-select: none;
      color: var(--blue);
      cursor: pointer;
      border: 2px solid transparent;
      border-radius: 33%;
      padding: 2px;
      margin: 2px;
      display: inline-block;
    }
    .metaTime.focused { background: var(--blue-hover); color: var(--bg); font-weight: bold; }
    .metaTime:hover { color: var(--focus-ring); border-color: var(--focus-ring); }
    .metaTime:hover.focused { color: var(--void); background-color: var(--focus-ring); }
    .metaTime.player-focused { color: var(--now); border-color: var(--now-edge); background-color: var(--void); }
    .metaTime.focused.player-focused { background-color: var(--now); border-color: var(--focus-ring); color: var(--void); }

    .edgeId {
      user-select: none;
      color: var(--purple);
      cursor: pointer;
      border: 1px solid var(--border-soft);
      border-radius: 1px;
      padding: 3px;
      margin: 2px;
      display: inline-block;
      background-color: var(--void);
    }
    .edgeId.focused { background: var(--purple-dark); color: var(--bg); font-weight: bold; }
    .edgeId:hover { color: var(--focus-ring); border-color: var(--focus-ring); }

    .nodeId {
      color: var(--brown);
      cursor: pointer;
      border: 1px solid var(--brown-dark);
      border-radius: 5%;
      padding: 3px;
      margin: 2px;
      display: inline-block;
      background-color: var(--void);
    }
    .nodeId.focused { background: var(--brown-dark); color: var(--bg); font-weight: bold; }
    .nodeId:hover { color: var(--focus-ring); }

    .pointer { user-select: none; }

    .pointerThunk {
      color: var(--ptr-thunk);
      cursor: pointer;
      border: 2px solid var(--bg-panel);
      border-radius: 2px;
      padding: 3px;
      margin: 2px;
      display: inline-block;
      background-color: var(--void);
    }
    .pointerThunk.focused { background-color: var(--blue-dark); color: var(--bg-panel); font-weight: bold; }

    .pointerNonThunk {
      color: var(--ptr-nonthunk);
      cursor: pointer;
      border: 1px solid var(--ptr-nonthunk-border);
      border-radius: 1px;
      padding: 3px;
      margin: 2px;
      display: inline-block;
      background-color: var(--void);
    }
    .pointerNonThunk.focused { background-color: var(--green-dark); color: var(--bg-panel); font-weight: bold; }

    .pointerThunk:hover,
    .pointerNonThunk:hover { color: var(--focus-ring); border-color: var(--focus-ring); }
    .pointerThunk.focused:hover,
    .pointerNonThunk.focused:hover { color: var(--focus-ring); border-color: var(--focus-ring); }

    /* ---- outline rows -------------------------------------------------- */

    /* The indentation is the DOM nesting: each of these steps 8px in, and
       the steps only accumulate because a child row is appended inside its
       parent's element rather than beside it. */
    .outline-edge {
      margin: 0 0 0 8px;
      border: 1px solid var(--focus-ring);
      background-color: var(--bg-outline-edge);
    }
    .outline-edge:hover { background-color: var(--bg-outline-edge-hover); }

    .outline-internal-result,
    .outline-node {
      margin-left: 8px;
      border: 0;
      border-left: 2px solid var(--bg-outline-vert);
      background-color: var(--bg-outline-internal-result);
    }
    .outline-node { padding-left: 2px; }
    .outline-internal-result:hover,
    .outline-node:hover { background-color: var(--bg-outline-internal-result-hover); }

    .outline-node-thunk-shape,
    .outline-node-nonthunk-shape {
      cursor: pointer;
      font-size: 1.15em;
      border: 2px solid transparent;
      margin: 2px;
      user-select: none;
    }
    .outline-node-thunk-shape {
      border-radius: 50%;
      color: var(--blue-dark);
      background-color: var(--blue-dark);
      padding: 2px 6px;
    }
    .outline-node-nonthunk-shape {
      border-radius: 0;
      color: var(--green-dark);
      background-color: var(--green-dark);
      padding: 0 4px;
    }
    .outline-node-thunk-shape:hover,
    .outline-node-nonthunk-shape:hover { border-color: var(--focus-ring); }
    .outline-node-thunk-shape:active,
    .outline-node-nonthunk-shape:active {
      background-color: var(--void);
      color: var(--focus-ring);
      border-color: var(--focus-ring);
    }

    .action-arrow {
      margin: 3px;
      padding: 3px;
      cursor: pointer;
      font-size: 1.1em;
      border: 2px solid transparent;
      border-radius: var(--radius);
      user-select: none;
    }
    .action-arrow:hover  { border-color: var(--focus-ring); }
    .action-arrow:active { background-color: var(--void); color: var(--focus-ring); border-color: var(--focus-ring); }

    .result-arrow    { color: var(--blue-dark); }
    .action-put      { color: var(--purple-dark); }
    .action-putForce { color: var(--purple); }
    .action-force    { color: var(--purple); }
    .action-get      { color: var(--blue-dark); }

    /* ---- long text, clamped until asked ---------------------------------
       Thunk bodies and values run to hundreds of characters. Left to run
       they made a single outline row taller than the pane. Two lines by
       default; click for the rest. */
    .clamped {
      cursor: pointer;
      /* -webkit-box is what -webkit-line-clamp needs; the *inline* variant so
         a value still sits on its outline row instead of taking a line of its
         own. */
      display: -webkit-inline-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-width: 100%;
      vertical-align: top;
      word-break: break-word;
    }
    .clamped.expanded {
      display: inline-block;
      -webkit-line-clamp: unset;
      line-clamp: unset;
      overflow: visible;
    }

    .thunk-body-text,
    .outline-forced-thunk-text {
      margin: 1px 1px 1px 6px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 4px;
      background-color: var(--void);
      color: var(--blue-dark);
    }
    .outline-forced-thunk-text:hover { color: var(--blue-hover); }

    .outline-value-text,
    .thunk-result-value {
      color: var(--green-dark);
      border: 1px solid transparent;
      border-radius: 2px;
      background-color: var(--void);
      padding: 2px;
      margin: 2px 2px 2px 8px;
    }
    .outline-value-text:hover { color: var(--green-hover); border-color: var(--green-hover); }

    .thunk-trace, .thunk-result { padding: 1px 0; }

    /* ---- the player, floating over the 3D view -------------------------
       It used to be a panel at the bottom of the sidebar, ~110px of chrome
       taken out of the outline. Over the viewport it costs nothing that
       was showing anything. */
    #playerBar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.35rem;
      padding: 0.3rem 0.45rem;
      font-family: var(--ui);
      color: var(--text);
      background: color-mix(in srgb, var(--bg-panel) 84%, transparent);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .player-group {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      background: color-mix(in srgb, var(--bg-elev) 70%, transparent);
      border: 1px solid var(--border-soft);
      border-radius: 7px;
    }

    .player-button {
      width: 1.9rem;
      height: 1.6rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font: inherit;
      font-size: 0.85rem;
      line-height: 1;
      color: var(--text);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 90ms ease, color 90ms ease;
    }
    .player-button:hover  { background: var(--hover); color: var(--focus-ring); }
    .player-button:active { background: var(--active); }
    .player-button.on     { background: var(--blue-dark); color: var(--bg); }
    .player-button-small  { font-size: 0.7rem; width: 1.6rem; color: var(--text-faint); }
    .player-button-wide   { width: auto; padding: 0 0.5rem; font-size: 0.72rem; letter-spacing: 0.03em; }

    /* The readout is the only thing here that must not jiggle as digits
       change, hence mono and a reserved width. */
    .player-readout {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-dim);
      padding: 0 0.4rem;
      min-width: 6.5rem;
      text-align: center;
      white-space: nowrap;
    }
    .player-readout b { color: var(--blue); font-weight: 600; }

    .player-caption {
      font-size: 0.6rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
      padding-left: 0.2rem;
    }

    #metaSlider {
      flex: 1 1 8rem;
      min-width: 5rem;
      accent-color: var(--blue);
      background: transparent;
      cursor: pointer;
    }

    #bpmDisplay {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-dim);
      min-width: 2.8rem;
      text-align: center;
    }

    /* A scene this size takes a moment to build; say so rather than show
       an empty black rectangle. */
    #boot {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--void);
      color: var(--text-faint);
      font-family: var(--ui);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
    }
    #boot[hidden] { display: none; }
  </style>
</head>

<body>
  <div id="app">

    <div id="sidebar">

      <div class="panel-header" id="titlePanelHeader">DCG Scene Player</div>

      <!-- The info panel is where doors put what they know. metaTime doors
           deliberately have nothing here: they act on the outline, the
           events and the nested detail inside the other doors. -->
      <div class="panel" id="infoPanel">
        <div class="panel-header" data-collapses>
          Open doors
          <span class="spacer"></span>
          <span class="count" id="openDoorCount">none</span>
          <button class="header-btn" id="closeAllDoorsBtn" title="Close every open door">✕ all</button>
        </div>
        <div class="panel-body">
          <div id="pointers"></div>
          <div id="edgeIds"></div>
        </div>
      </div>

      <div class="splitter"></div>

      <div class="panel" id="outlinePanel">
        <div class="panel-header" data-collapses>Outline</div>
        <div class="panel-body" id="outline"></div>
      </div>

      <div class="splitter"></div>

      <div class="panel" id="eventsPanel">
        <div class="panel-header" data-collapses>Events</div>
        <div class="panel-body" id="events"></div>
      </div>

    </div>

    <div id="divider"></div>

    <div id="viewport">

      <div id="playerBar">
        <div class="player-group">
          <button id="gotoStartBtn"    class="player-button" title="Back to the first moment">⏮</button>
          <button id="tickBackBtn"     class="player-button player-button-small" title="One moment back">◀▌</button>
          <button id="playPauseBtn"    class="player-button" title="Play / pause">▶</button>
          <button id="tickForwardBtn"  class="player-button player-button-small" title="One moment on">▐▶</button>
          <button id="stopBtn"         class="player-button" title="Stop">■</button>
        </div>

        <div class="player-readout"><b id="metaTimeNow">1</b> / <span id="metaTimeMax">1</span></div>

        <input id="metaSlider" type="range" min="1" max="1" value="1" step="1" aria-label="metaTime">

        <div class="player-group">
          <span class="player-caption">bpm</span>
          <button id="bpmDownBtn" class="player-button player-button-small" title="Slower">−</button>
          <span id="bpmDisplay">1337</span>
          <button id="bpmUpBtn"   class="player-button player-button-small" title="Faster">+</button>
        </div>

        <button id="growBtn" class="player-button player-button-wide"
                title="Reveal objects as their moment arrives, instead of showing the whole scene">grow</button>
      </div>

      <div id="boot">building the scene…</div>

    </div>

  </div>

  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.160.0';
    import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    // ---- the scene, and a few small helpers -----------------------------

    // build.py substitutes the contents of scene.json for the number below.
    // Do not reformat this line; the replacement is textual.
    const data = 103070301 /* SCENE_JSON */;

    // Every console.log in here is gated. This scene has ~5000 meshes and
    // ~2900 events; logging per mesh once flooded the console badly enough
    // to drop earlier messages, and slowed playback noticeably.
    // Flip from the console with `app.debug.on = true`.
    const debug = { on: false };
    const log  = (...a) => { if (debug.on) console.log(...a); };

    const $ = (id) => document.getElementById(id);

    /// Append to a Map<key, array>, creating the array on first use. Used for
    /// every index in this file.
    const pushInto = (map, key, value) => {
      const seen = map.get(key);
      if (seen) seen.push(value); else map.set(key, [value]);
    };

    const el = (tag, className, text) => {
      const e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    };
    const span = (className, text) => el("span", className, text);

    /// The arrow glyphs are the outline's whole vocabulary for what an edge
    /// did, and the edge doors reuse them so the two views agree.
    const ARROWS = {
      put:        " ───» ",
      get:        " ───> ",
      putForce:   " ══▷» ",
      force:      " ═══▷ ",
      forceBegin: " ═══▷ ",
    };
    /// `inert` for an arrow that is only saying what happened -- inside the
    /// door of the very edge it describes there is nothing left to open, and
    /// an arrow that looks clickable and is not is worse than a plain one.
    const actionArrow = (action, { inert = false } = {}) => {
      const e = span("action-arrow action-" + action, ARROWS[action] || " " + action + " ");
      if (inert) e.style.cursor = "default";
      return e;
    };

    /// A nodeId is [space, "@now", seq]. Its first component is the space,
    /// which is what the rest of the app calls a *pointer*.
    const spaceOf = (nodeId) => nodeId[0];
    const showNodeId = (nodeId) => String(nodeId);

    // ---- doors -----------------------------------------------------------
    //
    // A door is (kind, id). Opening it reveals every `.focus-detail` built
    // for that pair and marks every chip that names it. The three kinds
    // differ only in which chip class carries them.

    const DOOR_KINDS = ["metaTime", "edgeId", "pointer"];

    const emptyIndex = () => Object.fromEntries(DOOR_KINDS.map((k) => [k, new Map()]));

    // Both sides of a door, indexed by (kind, id) as they are built. The
    // original found them with `document.querySelectorAll(".metaTime")` and
    // filtered -- that is 5,600 elements walked on every click and, worse,
    // twice per beat during playback, which is what made fast BPMs stutter.
    const chipIndex   = emptyIndex();   // (kind, id) -> [chip, ...]
    const detailIndex = emptyIndex();   // (kind, id) -> [.focus-detail, ...]
    const anchorIndex = new Map();      // metaTime -> [scroll target, ...]

    const openDoors = {
      metaTime: new Set(),
      edgeId: new Set(),
      pointer: new Set(),
    };

    const indexed = (index, kind, id) => index[kind].get(String(id)) || [];
    const detailsFor = (kind, id) => indexed(detailIndex, kind, id);
    const chipsFor   = (kind, id) => indexed(chipIndex, kind, id);

    function openDoor(kind, id) {
      if (!chipIndex[kind]) { console.error("openDoor: unknown door kind", kind); return; }
      log("openDoor", kind, id);
      openDoors[kind].add(String(id));
      // `displayTrue` rather than a hard-coded "inline-block": a door nested
      // inside another wants "block" when open, and the element knows which.
      detailsFor(kind, id).forEach((e) => {
        e.style.display = e.dataset.displayTrue;
        e.classList.add("focused");
      });
      chipsFor(kind, id).forEach((e) => e.classList.add("focused"));
      renderOpenDoorCount();
    }

    function closeDoor(kind, id) {
      if (!chipIndex[kind]) { console.error("closeDoor: unknown door kind", kind); return; }
      log("closeDoor", kind, id);
      openDoors[kind].delete(String(id));
      detailsFor(kind, id).forEach((e) => {
        e.style.display = e.dataset.displayFalse;
        e.classList.remove("focused");
      });
      chipsFor(kind, id).forEach((e) => e.classList.remove("focused"));
      renderOpenDoorCount();
    }

    function closeAllDoors() {
      for (const kind of DOOR_KINDS) {
        for (const id of [...openDoors[kind]]) closeDoor(kind, id);
      }
    }

    function renderOpenDoorCount() {
      const count = (n, one, many = one + "s") => n + " " + (n === 1 ? one : many);
      const total = Object.values(openDoors).reduce((a, s) => a + s.size, 0);
      $("openDoorCount").textContent = total === 0 ? "none"
        : [count(openDoors.pointer.size, "node"),
           count(openDoors.edgeId.size, "edge"),
           count(openDoors.metaTime.size, "moment")].join(" · ");
    }

    /// The container a door's details live in. `displayFalse` is "none" at
    /// the top level, but "inline-block" for the metaTime doors nested in a
    /// pointer's door: those keep their chip visible while shut.
    function createDoorDetail(kind, id, displayTrue = "inline-block", displayFalse = "none") {
      const e = el("div", "focus-detail");
      e.style.display = displayFalse;
      e.dataset.type = kind;
      e.dataset.id = id;
      e.dataset.displayTrue = displayTrue;
      e.dataset.displayFalse = displayFalse;
      pushInto(detailIndex[kind], String(id), e);
      return e;
    }

    /// The one click handler behind every chip.
    ///
    ///   plain click  -- open the door (and, for a moment, park the player
    ///                   there); "objectShape" instead flies the camera
    ///   shift-click  -- close it
    function doorClick(kind, id) {
      return (event) => {
        event.stopPropagation();
        // Not a door: the ◉ / ▣ shapes fly the camera instead of revealing
        // anything, so they have nothing to shift-click shut.
        if (kind === "objectShape") { lookAtLabel(id); return; }
        if (event.shiftKey) { closeDoor(kind, id); return; }
        openDoor(kind, id);
        if (kind === "metaTime") seekTo(Number(id));
      };
    }

    // ---- chips ------------------------------------------------------------
    // One maker per door kind. Each stashes its id on the element, which is
    // how `chipsFor` finds it again without re-reading the text.

    function metaTimeChip(metaTime, isAnchor = false) {
      const e = span("metaTime" + (isAnchor ? " metaTimeAnchor" : ""), String(metaTime));
      e.metaTime = metaTime;
      e.onclick = doorClick("metaTime", metaTime);
      pushInto(chipIndex.metaTime, String(metaTime), e);
      if (isAnchor) pushInto(anchorIndex, String(metaTime), e);
      return e;
    }

    /// An invisible chip that only exists so `scrollToMetaTime` has
    /// something to scroll to for a moment nothing else printed.
    function metaTimeAnchor(metaTime) {
      const e = span("metaTimeAnchor", "");
      e.metaTime = metaTime;
      pushInto(anchorIndex, String(metaTime), e);
      return e;
    }

    /// A nodeId names one revision; its door is its space's door, because
    /// that is where all the revisions are listed.
    function nodeIdChip(nodeId) {
      const space = spaceOf(nodeId);
      const e = span("nodeId", showNodeId(nodeId));
      e.nodeId = nodeId;
      // Edge endpoints reach outside the graph -- "@here" is the ambient root
      // and has no revisions of its own. Naming it is right; offering a door
      // that opens on nothing is not.
      if (!nodeRevisions.has(space)) {
        e.style.cursor = "default";
        e.title = "no revisions recorded for " + space;
        return e;
      }
      e.classList.add("pointer");
      e.pointer = space;
      e.onclick = doorClick("pointer", space);
      pushInto(chipIndex.pointer, space, e);
      return e;
    }

    function edgeIdChip(edgeId) {
      const e = span("edgeId", edgeId);
      e.edgeId = edgeId;
      e.onclick = doorClick("edgeId", edgeId);
      pushInto(chipIndex.edgeId, edgeId, e);
      return e;
    }

    function pointerChip(ptr, shape) {
      const cls = shape === "#thunk_"   ? "pointer pointerThunk"
                : shape === "#nonThunk" ? "pointer pointerNonThunk"
                : null;
      if (!cls) console.error("unrecognized pointer shape", shape);
      const e = span(cls || "pointer", ptr);
      e.pointer = ptr;
      e.onclick = doorClick("pointer", ptr);
      pushInto(chipIndex.pointer, ptr, e);
      return e;
    }

    /// ◉ / ▣ -- not a door. Clicking one flies the camera to that object.
    function shapeChip(shape = "#thunk_", label = "scene") {
      const thunk = shape === "#thunk_";
      if (!thunk && shape !== "#nonThunk") console.error("unrecognized outline node shape", shape);
      const e = span(thunk ? "outline-node-thunk-shape" : "outline-node-nonthunk-shape",
                     thunk ? "◉" : "▣");
      e.title = "Show " + label + " in the scene";
      e.onclick = doorClick("objectShape", label);
      return e;
    }

    /// Bodies, thunks and values run long. Two lines, click for the rest --
    /// these used to say cursor:pointer and do nothing at all.
    function longText(className, text) {
      const e = span(className + " clamped", text == null ? "" : String(text));
      e.title = "Click to expand";
      e.onclick = (event) => { event.stopPropagation(); e.classList.toggle("expanded"); };
      return e;
    }

    // ---- indexing the scene ----------------------------------------------
    //
    // Three indices, all built once:
    //
    //   nodeRevisions   space   -> [{metaTime, nodeId, node}, ...] in order
    //   edgeRevisions   edgeId  -> [{metaTime, edge}, ...] in order
    //   labelsAtMetaTime  metaTime -> [label, ...] -- what the moment touched,
    //                     where a label is a space or an edgeId, the same
    //                     strings the 3D meshes are filed under.
    //
    // The original kept two persistent (immutable.js) maps so it could ask
    // for a snapshot of every space at a given moment. Nothing ever asked;
    // every lookup was "this space, at this moment", which is a plain index.
    // Dropping it also drops a CDN dependency.

    const nodeRevisions = new Map();
    const edgeRevisions = new Map();
    const labelsAtMetaTime = new Map();

    const touchedAt = (metaTime, label) => {
      const seen = labelsAtMetaTime.get(metaTime);
      if (seen) seen.push(label); else labelsAtMetaTime.set(metaTime, [label]);
    };

    for (const rev of data.nodes) {
      const space = spaceOf(rev.nodeId);
      pushInto(nodeRevisions, space, rev);
      touchedAt(rev.metaTime, space);
    }
    for (const rev of data.edges) {
      pushInto(edgeRevisions, rev.edgeId, rev);
      touchedAt(rev.metaTime, rev.edgeId);
    }

    const maxMetaTime = data.events.reduce((m, e) => Math.max(m, e.metaTime), 1);

    /// The moment a label first appears, so "grow with time" knows when to
    /// let each object into the scene.
    const bornAt = new Map();
    for (const [metaTime, labels] of labelsAtMetaTime) {
      for (const label of labels) {
        const seen = bornAt.get(label);
        if (seen === undefined || metaTime < seen) bornAt.set(label, metaTime);
      }
    }

    // ---- the pointer doors -------------------------------------------------
    //
    // One door per space, holding one nested metaTime door per revision. Shut,
    // a revision is just its moment; open, it is what the node became then.

    function nodeRevisionDetail(into, rev) {
      const node = rev.node;
      if (node.type === "thunk") {
        into.appendChild(longText("thunk-body-text", node.body));

        const trace = el("div", "thunk-trace");
        node.trace.forEach((edgeId) => trace.appendChild(edgeIdChip(edgeId)));
        into.appendChild(trace);

        const result = el("div", "thunk-result");
        if (!node.result) {
          result.appendChild(document.createTextNode("result undefined"));
        } else {
          result.appendChild(longText("thunk-result-value", node.result[1]));
        }
        into.appendChild(result);
      } else if (node.type === "nonThunk") {
        into.appendChild(longText("outline-value-text", node.value));
      } else {
        console.error("invalid node revision type", node.type, rev);
      }
    }

    function buildPointerDoors() {
      const into = $("pointers");
      for (const [space, revisions] of nodeRevisions) {
        const first = revisions[0];
        const shape = first.node.type === "thunk" ? "#thunk_"
                    : first.node.type === "nonThunk" ? "#nonThunk"
                    : null;
        if (!shape) { console.error("pointer with no usable first revision", space, first); continue; }

        const door = createDoorDetail("pointer", space);
        door.appendChild(shapeChip(shape, space));
        door.appendChild(pointerChip(space, shape));

        for (const rev of revisions) {
          // Two nested doors on the same moment: the outer one turns the
          // chip into a block so the detail gets its own line, the inner one
          // holds the detail itself.
          const outer = createDoorDetail("metaTime", rev.metaTime, "block", "inline-block");
          const inner = createDoorDetail("metaTime", rev.metaTime, "inline-block", "none");
          inner.classList.add("inner");
          outer.appendChild(metaTimeChip(rev.metaTime));
          outer.appendChild(inner);
          door.appendChild(outer);
          nodeRevisionDetail(inner, rev);
        }
        into.appendChild(door);
      }
    }

    // ---- the edge doors ----------------------------------------------------
    //
    // Built the same way as the pointer doors, and until now the missing half
    // of the pair: an edge door used to hold nothing but its own name. An
    // edge is an action from a source node to a target node; it can be
    // revised once (a `forceBegin` that later lands as a `force`), so the
    // door lists revisions the way a pointer's does.
    //
    // `edge.metaTimes` is one moment for an action that happened at an
    // instant, and a [begin, end] pair for one that spans a force.

    function edgeRevisionDetail(into, rev) {
      const edge = rev.edge;
      const action = edge.action;

      const wires = el("div", "door-row");
      wires.appendChild(span("door-label", "from"));
      wires.appendChild(nodeIdChip(edge.source));
      wires.appendChild(actionArrow(action.type, { inert: true }));
      wires.appendChild(span("door-label", "to"));
      wires.appendChild(nodeIdChip(edge.target));
      into.appendChild(wires);

      const spans = el("div", "door-row");
      spans.appendChild(span("door-label", Array.isArray(edge.metaTimes) ? "spans" : "at"));
      if (Array.isArray(edge.metaTimes)) {
        spans.appendChild(metaTimeChip(edge.metaTimes[0]));
        spans.appendChild(document.createTextNode("→"));
        spans.appendChild(metaTimeChip(edge.metaTimes[1]));
      } else {
        spans.appendChild(metaTimeChip(edge.metaTimes));
      }
      into.appendChild(spans);

      if (action.thunk !== undefined) {
        const row = el("div", "door-row");
        row.appendChild(span("door-label", "thunk"));
        row.appendChild(longText("outline-forced-thunk-text", action.thunk));
        into.appendChild(row);
      }
      if (action.value !== undefined) {
        const row = el("div", "door-row");
        row.appendChild(span("door-label", "value"));
        row.appendChild(longText("outline-value-text", action.value));
        into.appendChild(row);
      }
    }

    function buildEdgeDoors() {
      const into = $("edgeIds");
      for (const [edgeId, revisions] of edgeRevisions) {
        const door = createDoorDetail("edgeId", edgeId);
        door.appendChild(edgeIdChip(edgeId));

        for (const rev of revisions) {
          const outer = createDoorDetail("metaTime", rev.metaTime, "block", "inline-block");
          const inner = createDoorDetail("metaTime", rev.metaTime, "inline-block", "none");
          inner.classList.add("inner");
          outer.appendChild(metaTimeChip(rev.metaTime));
          outer.appendChild(inner);
          door.appendChild(outer);
          edgeRevisionDetail(inner, rev);
        }
        into.appendChild(door);
      }
    }

    // ---- the event log ------------------------------------------------------

    const EVENT_SUBJECT = {
      addNode:    (ev) => nodeIdChip(ev.nodeId),
      addEdge:    (ev) => edgeIdChip(ev.edgeId),
      forceBegin: (ev) => edgeIdChip(ev.edgeId),
      forceEnd:   (ev) => edgeIdChip(ev.edgeId),
      updateEdge: (ev) => edgeIdChip(ev.edgeId),
    };

    function renderEvents() {
      const into = $("events");
      into.innerHTML = "";
      let lastMetaTime = null;
      for (const ev of data.events) {
        const row = el("div");
        // Only the first event of a moment is an anchor, so scrolling to a
        // moment lands on where it starts rather than where it ends.
        row.appendChild(metaTimeChip(ev.metaTime, ev.metaTime !== lastMetaTime));
        lastMetaTime = ev.metaTime;
        row.appendChild(document.createTextNode(" " + ev.type + " "));
        const subject = EVENT_SUBJECT[ev.type];
        if (subject) row.appendChild(subject(ev));
        else console.error("unknown event type", ev);
        if (ev.cacheHit)  row.appendChild(span("door-label", "cache hit"));
        if (ev.cacheMiss) row.appendChild(span("door-label", "cache miss"));
        into.appendChild(row);
      }
    }

    // ---- the outline ---------------------------------------------------------
    //
    // The forced-thunk tree, nested the way it ran. Each edge is one action;
    // an edge whose `metaTimes` is a [begin, end] pair forced a thunk, so its
    // sub-outline is drawn underneath it and the value it came back with hangs
    // below that on a result row. An edge with a single moment just did its
    // action and its value sits on the same line.
    //
    // The indentation is the DOM nesting -- see `.outline-node` in the CSS --
    // so a child row is appended *inside* its parent's element.

    function renderOutline() {
      // A scene's outline is a forest: zero or more trees, in the order
      // whoever produced it chose. It used to be a single tree, and an older
      // scene.json will still hold one, so both are accepted.
      const forest = Array.isArray(data.outline) ? data.outline
                   : data.outline ? [data.outline]
                   : [];
      const panel = $("outline");
      let placedFirstAnchor = false;

      /// The [begin, end] pair under a result row. The begin chip used to be
      /// wired to the *end* moment: clicking "3," parked the player on 49.
      function metaTimeRange(into, begin, end) {
        const row = el("div");
        row.style.marginLeft = "9px";
        const beginChip = metaTimeChip(begin);
        beginChip.textContent = begin + ", ";
        row.appendChild(beginChip);
        row.appendChild(metaTimeChip(end, true));
        into.appendChild(row);
      }

      function walk(into, node, depth) {
        if (!node) return;

        const nodeEl = el("div", "outline-node");
        if (depth === 0) {
          // Nothing above the root printed its name, so the root prints its own.
          nodeEl.appendChild(shapeChip(node.shape, spaceOf(node.nodeId)));
          nodeEl.appendChild(nodeIdChip(node.nodeId));
        }
        into.appendChild(nodeEl);

        const edges = node.edges || [];
        edges.forEach((e, i) => {
          const row = el("div", "outline-edge");
          const spans = Array.isArray(e.metaTimes);
          const begin = spans ? e.metaTimes[0] : e.metaTimes;
          const end   = spans ? e.metaTimes[1] : e.metaTimes;

          // Somewhere to scroll to for moment 1, if the first edge starts later.
          if (!placedFirstAnchor && begin > 1) {
            row.appendChild(metaTimeAnchor(1));
            placedFirstAnchor = true;
          }

          row.appendChild(metaTimeChip(begin, true));
          if (spans) {
            row.appendChild(document.createTextNode(", "));
            row.appendChild(metaTimeChip(end));
          }
          row.appendChild(document.createTextNode(" (" + (i + 1) + "/" + edges.length + ")"));

          // The arrow says what the action was, and opens that edge's door --
          // it has always looked clickable and never was.
          const arrow = actionArrow(e.action);
          arrow.onclick = doorClick("edgeId", e.edgeId);
          arrow.title = e.action;
          row.appendChild(arrow);

          row.appendChild(shapeChip(e.outline.shape, e.actionTarget));
          row.appendChild(pointerChip(e.actionTarget, e.outline.shape));
          nodeEl.appendChild(row);

          // A forced edge draws its callees between itself and its result.
          walk(nodeEl, e.outline, depth + 1);

          row.appendChild(document.createTextNode(" " + e.action + " "));

          if (!spans) {
            row.appendChild(longText("outline-value-text", e.value));
            row.appendChild(edgeIdChip(e.edgeId));
          } else {
            row.appendChild(edgeIdChip(e.edgeId));
            row.appendChild(longText("outline-forced-thunk-text", e.forcedThunk));

            const result = el("div", "outline-internal-result");
            const resultArrow = span("action-arrow result-arrow", "╰〜〜>");
            resultArrow.onclick = doorClick("edgeId", e.edgeId);
            result.appendChild(resultArrow);
            result.appendChild(longText("outline-value-text", e.value));
            nodeEl.appendChild(result);
            metaTimeRange(result, begin, end);
          }
        });

        // What the whole tree came back with, which nothing was showing.
        if (depth === 0 && node.value !== undefined) {
          const result = el("div", "outline-internal-result");
          const rootArrow = span("action-arrow result-arrow", "╰〜〜>");
          rootArrow.style.cursor = "default";
          result.appendChild(rootArrow);
          result.appendChild(longText("outline-value-text", node.value));
          if (node.valueMetaTime !== undefined) {
            result.appendChild(metaTimeChip(Number(node.valueMetaTime)));
          }
          nodeEl.appendChild(result);
        }
      }

      forest.forEach((tree) => walk(panel, tree, 0));
    }

    /// Bring a moment into view in whichever panes printed an anchor for it.
    function scrollToMetaTime(metaTime, behavior) {
      // One is enough. The original scrolled to every anchor for the moment,
      // so the pane jumped once per match and only the last one stuck.
      const [first] = anchorIndex.get(String(metaTime)) || [];
      if (first) first.scrollIntoView({ behavior, block: "nearest", inline: "nearest" });
    }

    // ---- the player ------------------------------------------------------
    //
    // One cursor over the metaTimes, shared by every pane. `growWithTime`
    // decides what the 3D view does with it: off (the default) the whole
    // scene stands there and the cursor only lights things up; on, an object
    // is invisible until its moment arrives, so playing builds the graph.

    const playerState = {
      isPlaying: false,
      metaTime: 1,
      maxMetaTime,
      stopResetsTo: 1,
      bpm: 1337,
      growWithTime: false,
      // Whether the scene is currently showing all of itself, so the "show
      // everything" pass runs on the change rather than on every beat.
      everythingVisible: false,
      timer: null,
    };

    const BPM_STEP = 60, BPM_MIN = 17, BPM_MAX = 6000;

    const slider = $("metaSlider");
    slider.min = 1;
    slider.max = playerState.maxMetaTime;
    slider.value = playerState.metaTime;
    $("metaTimeMax").textContent = playerState.maxMetaTime;

    function renderPlayerUI() {
      $("metaTimeNow").textContent = playerState.metaTime;
      $("bpmDisplay").textContent = playerState.bpm;
      slider.value = playerState.metaTime;
      slider.max = playerState.maxMetaTime;
      $("playPauseBtn").textContent = playerState.isPlaying ? "⏸" : "▶";
      $("growBtn").classList.toggle("on", playerState.growWithTime);
    }

    /// Park on a moment. Everything that moves the cursor goes through here,
    /// so there is one place that keeps the panes and the scene in step.
    function seekTo(metaTime, scrollBehavior = "smooth") {
      playerState.metaTime = Math.min(Math.max(1, metaTime), playerState.maxMetaTime);
      playerState.stopResetsTo = playerState.metaTime;
      renderPlayerFocus(scrollBehavior);
      renderPlayerUI();
    }

    const beatDurationMs = () => (60 * 1000) / playerState.bpm;

    function tickPlayback() {
      if (!playerState.isPlaying) return;
      if (playerState.metaTime >= playerState.maxMetaTime) {
        playerState.metaTime = playerState.maxMetaTime;
        stopPlayback();
        return;
      }
      playerState.metaTime++;
      renderPlayerFocus("instant");
      renderPlayerUI();
      playerState.timer = setTimeout(tickPlayback, beatDurationMs());
    }

    function startPlayback() {
      if (playerState.isPlaying) return;
      playerState.isPlaying = true;
      renderPlayerUI();
      tickPlayback();
    }

    function pausePlayback() {
      playerState.isPlaying = false;
      clearTimeout(playerState.timer);
      renderPlayerUI();
    }

    /// Stop rewinds to wherever the last deliberate seek left the cursor,
    /// which is not necessarily the start.
    function stopPlayback() {
      pausePlayback();
      seekTo(playerState.stopResetsTo);
    }

    $("playPauseBtn").onclick   = () => playerState.isPlaying ? pausePlayback() : startPlayback();
    $("stopBtn").onclick        = stopPlayback;
    $("tickBackBtn").onclick    = () => { pausePlayback(); seekTo(playerState.metaTime - 1); };
    $("tickForwardBtn").onclick = () => { pausePlayback(); seekTo(playerState.metaTime + 1); };
    $("gotoStartBtn").onclick   = () => { pausePlayback(); seekTo(1); };

    $("bpmUpBtn").onclick   = () => { playerState.bpm = Math.min(BPM_MAX, playerState.bpm + BPM_STEP); renderPlayerUI(); };
    $("bpmDownBtn").onclick = () => { playerState.bpm = Math.max(BPM_MIN, playerState.bpm - BPM_STEP); renderPlayerUI(); };

    slider.oninput = (e) => {
      // Read the handle before pausing: pausing re-renders the player UI,
      // which writes playerState.metaTime back into the slider and would
      // otherwise overwrite the value the drag just produced.
      const to = Number(e.target.value);
      pausePlayback();
      seekTo(to, "instant");
    };

    $("growBtn").onclick = () => {
      playerState.growWithTime = !playerState.growWithTime;
      renderPlayerFocus("instant");
      renderPlayerUI();
    };

    // ---- the objects, in space ------------------------------------------
    //
    // `data.objects` is a flat list. Boxes and orbs are nodes and are placed
    // first, because pointers and actions are drawn between them and need to
    // know where they landed.
    //
    // Every mesh is filed under a *label* -- a space for a node, an edgeId for
    // an action -- which is the same string the doors and the outline use. That
    // is the whole cross-link between the sidebar and the 3D view.
    //
    // Text (the name floating by a node, and its fields) is DECOR: drawn, but
    // never pickable. Those planes are full rectangles as far as a raycaster is
    // concerned, and being in front of the node they name they were swallowing
    // the clicks meant for it.

    const BOX_DIM = 0.33;
    const COLOR = {
      box: 0x55aa44,
      pointer: 0x55aa44,
      orb: 0x4488aa,
      dot: 0x000000,
      action: 0x0088aa,        // get, force
      actionPut: 0x008877,
      actionPutForce: 0xaaaaaa,
    };
    const GLOW = { off: 0, on: 1.0 };
    const GLOW_FADE_PER_FRAME = 0.01;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
    camera.position.set(6, 4, 8);

    const viewport = $("viewport");
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    viewport.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    scene.add(new THREE.AmbientLight(0xffffff));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1);
    keyLight.position.set(5, 5, 5);
    scene.add(keyLight);

    const meshesByLabel = new Map();   // label  -> [mesh, ...], body first
    const labelByMesh   = new Map();   // mesh   -> label
    const pickable      = [];          // what a click may hit -- no text planes
    const dotPositionByField = new Map();   // "label:field" -> Vector3
    const labelByField       = new Map();   // "label:field" -> label

    function addMesh(label, mesh, { decor = false } = {}) {
      scene.add(mesh);
      labelByMesh.set(mesh, label);
      pushInto(meshesByLabel, label, mesh);
      if (!decor) pickable.push(mesh);
      return mesh;
    }

    /// White text on a transparent canvas, sized to the text. Returns the
    /// texture and the aspect ratio so the caller can make a plane that does
    /// not squash it.
    function makeTextTexture(text) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const fontSize = 48, lineHeight = fontSize * 1.2, padding = 20;

      ctx.font = fontSize + "px monospace";
      const lines = String(text).split("\n");
      const maxWidth = Math.max(...lines.map((l) => ctx.measureText(l).width));

      canvas.width = maxWidth + padding * 2;
      canvas.height = lineHeight * lines.length + padding * 2;

      // Resizing the canvas resets the context, so the font is set twice.
      ctx.font = fontSize + "px monospace";
      ctx.fillStyle = "white";
      lines.forEach((line, i) =>
        ctx.fillText(line, padding, padding + (i + 1) * lineHeight - (lineHeight - fontSize)));

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      texture.minFilter = THREE.LinearFilter;
      return { texture, aspect: canvas.height / canvas.width };
    }

    /// The name plate and the field list that float beside a node.
    ///
    /// Boxes light theirs with the node (a MeshStandardMaterial, so it takes an
    /// emissive), orbs do not (a MeshBasicMaterial, which has no such
    /// property -- passing one anyway is what printed thousands of
    /// "'emissive' is not a property of THREE.MeshBasicMaterial" warnings).
    function addNodeText(obj, body, MaterialClass) {
      const glows = MaterialClass !== THREE.MeshBasicMaterial
        ? { emissive: "white", emissiveIntensity: GLOW.off }
        : {};

      const name = makeTextTexture(obj.label);
      const namePlane = new THREE.Mesh(
        new THREE.PlaneGeometry(0.7, 0.7 * name.aspect),
        new MaterialClass({ map: name.texture, transparent: false, ...glows }));
      namePlane.position.copy(body.position.clone().add(new THREE.Vector3(-0.17, 0.17, BOX_DIM)));
      addMesh(obj.label, namePlane, { decor: true });

      const fields = makeTextTexture(obj.textLines || obj.fields || "");
      const fieldsPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(0.5, 0.5 * fields.aspect),
        new MaterialClass({ map: fields.texture, transparent: true, alphaTest: 0.1, ...glows }));
      fieldsPlane.position.copy(body.position.clone().add(new THREE.Vector3(0.37, 0, BOX_DIM)));
      addMesh(obj.label, fieldsPlane, { decor: true });
    }

    /// One small sphere per pointer field, in a row under the node. These are
    /// where outgoing pointers start, so their positions are remembered.
    function addFieldDots(obj, body, material) {
      if (!obj.pointerFields) return;
      const spacing = 0.1;
      const startX = body.position.x - (obj.pointerFields.length - 1) * spacing / 2;
      obj.pointerFields.forEach((field, i) => {
        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 12), material);
        dot.position.set(startX + i * spacing, body.position.y - 0.17, body.position.z);
        // Filed under the node it belongs to. They used to be added straight
        // to the scene with no label, so hovering one left it lit for good:
        // the un-hover could not find a label and gave up before restoring it.
        addMesh(obj.label, dot);
        const key = obj.label + ":" + field;
        dotPositionByField.set(key, dot.position);
        labelByField.set(key, obj.label);
      });
    }

    function createBoxMesh(obj) {
      const material = new THREE.MeshStandardMaterial({
        color: COLOR.box, transparent: true, opacity: 0.618,
        emissive: "white", emissiveIntensity: GLOW.off, visible: true,
      });
      const body = new THREE.Mesh(new THREE.BoxGeometry(BOX_DIM, BOX_DIM, BOX_DIM), material);
      body.position.set(...obj.position);
      addMesh(obj.label, body);
      addNodeText(obj, body, THREE.MeshStandardMaterial);
      // A box's dots get their own black material; an orb's share the orb's.
      addFieldDots(obj, body, new THREE.MeshStandardMaterial({
        color: COLOR.dot, emissive: "white", emissiveIntensity: GLOW.off }));
      return body;
    }

    function createOrbMesh(obj) {
      const material = new THREE.MeshStandardMaterial({
        color: COLOR.orb, transparent: true, opacity: 0.9,
        emissive: "white", emissiveIntensity: GLOW.off,
      });
      const body = new THREE.Mesh(new THREE.SphereGeometry(BOX_DIM * 0.618), material);
      body.position.set(...obj.position);
      addMesh(obj.label, body);
      addNodeText(obj, body, THREE.MeshBasicMaterial);
      addFieldDots(obj, body, material);
      return body;
    }

    /// A cylinder from `a` to `b`, plus the rotation that points it there.
    function edgeFrame(a, b) {
      const dir = new THREE.Vector3().subVectors(b, a);
      const length = dir.length();
      const dirNorm = dir.clone().normalize();
      const quat = new THREE.Quaternion()
        .setFromUnitVectors(new THREE.Vector3(0, 1, 0), dirNorm);
      return { dirNorm, length, quat };
    }

    /// A structural pointer: one field of one node naming another node.
    function createPointerMesh(label, from, to) {
      const material = new THREE.MeshStandardMaterial({
        color: COLOR.pointer, emissive: "white", transparent: true,
        opacity: 1, emissiveIntensity: GLOW.off,
      });
      const { dirNorm, length, quat } = edgeFrame(from, to);

      const tail = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), material);
      tail.position.copy(from);
      addMesh(label, tail);

      const shaftLen = Math.max(0.001, length - 0.08);
      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.023, 0.035, shaftLen, 8), material);
      shaft.position.copy(from.clone().addScaledVector(dirNorm, shaftLen / 2));
      shaft.quaternion.copy(quat);
      addMesh(label, shaft);

      const head = new THREE.Mesh(new THREE.ConeGeometry(0.04, 0.08, 8), material);
      head.position.copy(to.clone().addScaledVector(dirNorm, -0.04));
      head.quaternion.copy(quat);
      addMesh(label, head);
    }

    /// An action taken over an edge. The head hovers short of the target so it
    /// does not disappear inside it; `force` and `putForce` get a fatter,
    /// translucent shaft with a solid one inside, and `put` a double pyramid
    /// instead of a cone.
    const ACTION_TINT = {
      put: COLOR.actionPut,
      putForce: COLOR.actionPutForce,
      get: COLOR.action,
      force: COLOR.action,
    };

    function createActionMesh(type, source, target, label, hoverOffset = -BOX_DIM) {
      const tint = ACTION_TINT[type] ?? COLOR.action;
      const forcing = type === "force" || type === "putForce";

      const dir = new THREE.Vector3().subVectors(target, source);
      const length = dir.length();
      dir.normalize();

      const shaftLength = length + hoverOffset * 1.6;
      const headPos = new THREE.Vector3().copy(target).addScaledVector(dir, hoverOffset);
      const mid = new THREE.Vector3().addVectors(source, headPos).multiplyScalar(0.5);
      const aim = new THREE.Quaternion()
        .setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);

      const shaft = new THREE.Mesh(
        new THREE.CylinderGeometry(forcing ? 0.10 : 0.03, forcing ? 0.10 : 0.03, shaftLength, 12),
        new THREE.MeshStandardMaterial({
          color: tint, transparent: true, opacity: forcing ? 0.6 : 0.8,
          emissive: "white", emissiveIntensity: GLOW.off }));
      shaft.position.copy(mid);
      shaft.quaternion.copy(aim);
      addMesh(label, shaft);

      /// A cone sitting `along` units past the head position, pointing either
      /// with the arrow or against it.
      const cone = (along = 0, backwards = false, color = tint) => {
        const mesh = new THREE.Mesh(
          new THREE.ConeGeometry(0.12, 0.12, 12),
          new THREE.MeshStandardMaterial({ color, emissive: "white", emissiveIntensity: GLOW.off }));
        mesh.position.copy(headPos).addScaledVector(dir, along);
        mesh.quaternion.copy(aim);
        if (backwards) mesh.rotateX(Math.PI);
        return addMesh(label, mesh);
      };

      const innerShaft = (color) => {
        const inner = new THREE.Mesh(
          new THREE.CylinderGeometry(0.03, 0.03, shaftLength, 12),
          new THREE.MeshStandardMaterial({ color, emissive: "white", emissiveIntensity: GLOW.off }));
        inner.position.copy(mid);
        inner.quaternion.copy(aim);
        addMesh(label, inner);
      };

      // `put` ends in a double pyramid, `get` and `force` in a plain cone, and
      // `putForce` in both.
      //
      // The two halves of the pyramid used to be parented to a THREE.Group
      // that was never added to the scene. 954 cones -- every put and every
      // putForce arrowhead -- went unrendered, and because they stayed in the
      // pick list with a never-updated identity matrix they piled up at the
      // world origin as invisible click targets. Placing them directly is both
      // the fix and one fewer thing between a mesh and the scene.
      if (type !== "put") cone();
      if (type === "put" || type === "putForce") {
        cone(+0.06);
        cone(-0.06, true);
      }

      if (type === "force")    innerShaft(tint);
      if (type === "putForce") innerShaft(COLOR.actionPut);
    }

    const ACTION_TYPES = new Set(["get", "put", "force", "putForce"]);

    function buildSceneObjects() {
      for (const obj of data.objects) {
        if (obj.type === "box") createBoxMesh(obj);
        else if (obj.type === "orb") createOrbMesh(obj);
      }
      for (const obj of data.objects) {
        if (obj.type === "box" || obj.type === "orb") continue;

        const from = dotPositionByField.get(obj.from);
        const target = meshesByLabel.get(obj.to);
        if (!from || !target) {
          console.error("object names an endpoint that is not in the scene:", obj);
          continue;
        }
        if (obj.type === "pointer") {
          const to = target[0].position.clone().add(new THREE.Vector3(0, BOX_DIM / 2, 0));
          createPointerMesh(labelByField.get(obj.from), from, to);
        } else if (ACTION_TYPES.has(obj.type)) {
          createActionMesh(obj.type, from, target[0].position, obj.edgeId);
        } else {
          console.error("do not recognize this object type: " + obj.type);
        }
      }
      log("built", labelByMesh.size, "meshes,", pickable.length, "pickable");
    }

    // ---- keeping the renderer the size of the viewport -------------------
    //
    // Everything about 3D picking depends on one invariant: the pixel the
    // user clicked and the pixel the ray is cast through are the same pixel.
    // Three things used to break it, and all three are handled here.
    //
    //   1. The canvas is sized by CSS (100% of #viewport) and the drawing
    //      buffer follows, never the other way round. `setSize(w, h, false)`
    //      says "buffer only, leave my style alone" -- which is only safe
    //      *because* the CSS above gives the canvas a size of its own.
    //   2. #viewport has min-width/min-height 0, so it can shrink. Without
    //      that a flex item cannot go below its content, the canvas is its
    //      content, and the viewport could only ever grow: the layout
    //      ratcheted, the app overflowed the window, and two thirds of the
    //      canvas hung off-screen while the maths still divided by all of it.
    //   3. devicePixelRatio is re-read whenever it changes -- dragging the
    //      window to another monitor, or zooming the page, used to leave the
    //      buffer at the old density.

    function fitRendererToViewport() {
      const width = viewport.clientWidth;
      const height = viewport.clientHeight;
      if (!width || !height) return;          // hidden, or mid-layout
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    // One observer, on the element whose size actually matters. It fires for
    // window resizes, devtools opening, the divider being dragged and panels
    // collapsing alike, so there is no separate window "resize" handler to
    // disagree with it.
    new ResizeObserver(fitRendererToViewport).observe(viewport);

    // devicePixelRatio has no event of its own; a media query on the current
    // ratio flips exactly when it changes, and is then re-armed for the new one.
    (function watchPixelRatio() {
      const mq = matchMedia("(resolution: " + (window.devicePixelRatio || 1) + "dppx)");
      mq.addEventListener("change", () => { fitRendererToViewport(); watchPixelRatio(); },
                          { once: true });
    })();

    // ---- picking ----------------------------------------------------------

    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    let pointerIsOverCanvas = false;
    let pointerMovedSinceLastCast = false;

    /// Normalised device coordinates, measured against the CANVAS -- not the
    /// container it sits in, and not the window. Those three used to be
    /// interchangeable and are the first thing to stop being so.
    function pointerToNDC(event, into) {
      const rect = renderer.domElement.getBoundingClientRect();
      into.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      into.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      return into;
    }

    const pickAt = (ndc) => {
      raycaster.setFromCamera(ndc, camera);
      return raycaster.intersectObjects(pickable, false)[0] || null;
    };

    // ---- flying the camera --------------------------------------------------

    let camTargetPos = null;
    let camTargetLook = null;
    let camTransitionStart = 0;
    const CAM_TRANSITION_SECONDS = 2.3;

    function lookAtMesh(mesh, distance = 3.0) {
      if (!mesh) return;
      log("lookAtMesh", labelByMesh.get(mesh));
      camTargetPos = mesh.position.clone().add(new THREE.Vector3(0, 0, distance));
      camTargetLook = mesh.position.clone();
      camTransitionStart = performance.now() / 1000;
    }

    /// Fly to whatever the sidebar just named. The body mesh is always the
    /// first one filed under a label, so this lands on the node rather than on
    /// its name plate.
    function lookAtLabel(label) {
      const meshes = meshesByLabel.get(label);
      if (!meshes) { console.warn("nothing in the scene is labelled", label); return; }
      lookAtMesh(meshes[0]);
    }

    // ---- pointer on the canvas ---------------------------------------------
    //
    // These listen on the canvas, not on `window`. With them on the window a
    // click anywhere -- an outline row, the divider, a player button -- cast a
    // ray into the scene as well, and the divider in particular sits at an NDC
    // just inside the frustum, so dragging it kept flying the camera off.

    const canvas = renderer.domElement;
    let pressAt = null;
    const DRAG_SLOP_PX = 4;

    canvas.addEventListener("pointerdown", (e) => {
      pressAt = { x: e.clientX, y: e.clientY };
    });

    canvas.addEventListener("click", (e) => {
      // OrbitControls ends every orbit with a click. Without a slop threshold
      // letting go after turning the camera also flew it somewhere new.
      if (pressAt && Math.hypot(e.clientX - pressAt.x, e.clientY - pressAt.y) > DRAG_SLOP_PX) return;
      const hit = pickAt(pointerToNDC(e, new THREE.Vector2()));
      if (!hit) return;
      const label = labelByMesh.get(hit.object);
      log("picked", label);
      lookAtMesh(hit.object);
    });

    canvas.addEventListener("pointermove", (e) => {
      pointerToNDC(e, pointerNDC);
      pointerIsOverCanvas = true;
      pointerMovedSinceLastCast = true;
    });
    canvas.addEventListener("pointerleave", () => { pointerIsOverCanvas = false; });

    // ---- what the time cursor lights up ------------------------------------

    let hoverMesh = null;
    const fading = new Set();

    function setGlow(mesh, intensity) {
      if (!mesh.material.emissive) return;
      mesh.material.emissiveIntensity = intensity;
      mesh.material.emissive.setHex(0xffffff);
      mesh.material.needsUpdate = true;
    }

    /// Highlight the current moment everywhere: the chips that name it, the
    /// pane that should scroll to it, and the objects it touched.
    let playerFocusedChips = [];

    function renderPlayerFocus(scrollBehavior = "instant") {
      const t = playerState.metaTime;

      for (const chip of playerFocusedChips) chip.classList.remove("player-focused");
      playerFocusedChips = chipsFor("metaTime", t);
      for (const chip of playerFocusedChips) chip.classList.add("player-focused");

      scrollToMetaTime(t, scrollBehavior);

      // "grow with time": an object is not in the scene until its moment.
      // Off by default, because the first thing you want on load is the whole
      // graph. It replaces the old ⏮, which hid all 5,000 meshes with nothing
      // that could bring them back short of playing to the end.
      if (playerState.growWithTime) {
        for (const [label, meshes] of meshesByLabel) {
          const visible = (bornAt.get(label) ?? 1) <= t;
          for (const mesh of meshes) mesh.visible = visible;
        }
      } else if (!playerState.everythingVisible) {
        for (const mesh of labelByMesh.keys()) mesh.visible = true;
      }
      playerState.everythingVisible = !playerState.growWithTime;

      for (const label of labelsAtMetaTime.get(t) || []) {
        const meshes = meshesByLabel.get(label);
        // The root "scene" node and the first edge have no geometry: they are
        // the moment the run started, before anything was placed.
        if (!meshes) { log("no mesh for", label); continue; }
        for (const mesh of meshes) {
          mesh.visible = true;
          if (!mesh.material.emissive) continue;   // unlit text planes
          setGlow(mesh, GLOW.on);
          fading.add(mesh);
        }
      }
    }

    // ---- the frame ---------------------------------------------------------

    function animate() {
      requestAnimationFrame(animate);

      for (const mesh of fading) {
        const next = mesh.material.emissiveIntensity - GLOW_FADE_PER_FRAME;
        if (next < 0.01) { mesh.material.emissiveIntensity = GLOW.off; fading.delete(mesh); }
        else mesh.material.emissiveIntensity = next;
      }

      if (camTargetPos) {
        const t = Math.min((performance.now() / 1000 - camTransitionStart) / CAM_TRANSITION_SECONDS, 1);
        camera.position.lerpVectors(camera.position, camTargetPos, t);
        controls.target.lerpVectors(controls.target, camTargetLook, t);
        if (t >= 1) { camTargetPos = null; camTargetLook = null; }
      }

      // Only when the pointer is over the canvas and has actually moved. The
      // original cast a ray through ~5,000 meshes every single frame, from a
      // freshly built array, whether or not anything had changed.
      if (pointerIsOverCanvas && pointerMovedSinceLastCast) {
        pointerMovedSinceLastCast = false;
        const hit = pickAt(pointerNDC);
        const next = hit ? hit.object : null;
        if (next !== hoverMesh) {
          if (hoverMesh) setGlow(hoverMesh, GLOW.off);
          hoverMesh = next;
          if (hoverMesh) setGlow(hoverMesh, GLOW.on);
        }
      } else if (!pointerIsOverCanvas && hoverMesh) {
        setGlow(hoverMesh, GLOW.off);
        hoverMesh = null;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // ---- the panes: collapse, and drag to size -----------------------------

    for (const header of document.querySelectorAll(".panel-header[data-collapses]")) {
      header.addEventListener("click", () => header.parentElement.classList.toggle("collapsed"));
    }
    $("closeAllDoorsBtn").addEventListener("click", (e) => {
      e.stopPropagation();          // not a collapse
      closeAllDoors();
    });

    /// Pointer capture rather than window listeners, so a drag that leaves the
    /// element still ends when the button comes up.
    function onDrag(handle, move) {
      handle.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        try { handle.setPointerCapture(e.pointerId); } catch (_) {}
        handle.classList.add("dragging");
        const onMove = (ev) => move(ev);
        const onUp = () => {
          handle.classList.remove("dragging");
          handle.removeEventListener("pointermove", onMove);
          handle.removeEventListener("pointerup", onUp);
        };
        handle.addEventListener("pointermove", onMove);
        handle.addEventListener("pointerup", onUp);
      });
    }

    const appEl = $("app");
    onDrag($("divider"), (e) => {
      const bounds = appEl.getBoundingClientRect();
      const width = Math.min(Math.max(e.clientX - bounds.left, 160), bounds.width - 160);
      appEl.style.setProperty("--sidebar-w", width + "px");
    });

    // A splitter fixes the height of the panel above it and lets the ones
    // below take the rest.
    for (const splitter of document.querySelectorAll(".splitter")) {
      const panel = splitter.previousElementSibling;
      onDrag(splitter, (e) => {
        const top = panel.getBoundingClientRect().top;
        const height = Math.min(Math.max(e.clientY - top, 40),
                                $("sidebar").getBoundingClientRect().height - 80);
        panel.style.flex = "0 0 auto";
        panel.style.height = height + "px";
        panel.style.maxHeight = "none";
      });
    }

    // ---- boot ---------------------------------------------------------------

    function loadScene() {
      buildSceneObjects();
      buildPointerDoors();
      buildEdgeDoors();
      renderOutline();
      renderEvents();
      fitRendererToViewport();
      renderOpenDoorCount();
      seekTo(1, "instant");
      $("boot").hidden = true;
    }

    // Give the "building the scene…" notice one frame to paint before the main
    // thread disappears for a second or two. requestAnimationFrame alone is not
    // enough: a background tab never gets one, and the page would sit unbuilt
    // until it was looked at.
    let started = false;
    const start = () => {
      if (started) return;
      started = true;
      loadScene();
      animate();
    };
    requestAnimationFrame(start);
    setTimeout(start, 250);

    // ---- the console handle --------------------------------------------------
    // `app.debug.on = true` turns the logging back on.
    window.app = {
      debug,
      data,
      playerState,
      openDoors, chipIndex, detailIndex,
      nodeRevisions, edgeRevisions, labelsAtMetaTime, bornAt,
      meshesByLabel, labelByMesh, pickable,
      scene, camera, renderer, controls,
      openDoor, closeDoor, closeAllDoors, seekTo, lookAtLabel,
      fitRendererToViewport, pickAt, pointerToNDC,
      get hoverMesh() { return hoverMesh; },
      // Where the camera is heading, which is what a pick actually sets --
      // the position only catches up over the next couple of seconds.
      get camTarget() { return camTargetLook && camTargetLook.toArray(); },
    };
  </script>

</body>

</html>
