[package]
name = "fumola_canister"
version = "0.0.1"
authors = ["Matthew Hammer"]
edition = "2021"
license = "Apache-2.0"
description = "An Internet Computer canister holding Hazel's state, with the Fumola interpreter linked in"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The REPL pulls in rustyline, which does not build for wasm32.
fumola = { path = "../fumola", default-features = false }
fumola_semantics = { path = "../fumola_semantics" }
fumola_syntax = { path = "../fumola_syntax" }
# Answers /eval.json in the browser runtime's JSON, so Hazel reads a
# remote result as it reads a local one.
fumola_wasm_common = { path = "../fumola_wasm_common" }
im-rc = "15.1.0"
num-bigint = "0.4"
ordered-float = "3"
candid = "0.10"
ic-cdk = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
