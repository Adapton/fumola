[package]
name = "fumola_wasm"
version = "0.0.29"
authors = ["Matthew Hammer"]
edition = "2021"
license = "Apache-2.0"
description = "wasm-bindgen bindings exposing incremental Fumola instances to JavaScript"

[lib]
crate-type = ["cdylib", "rlib"]

build = "build.rs"

[dependencies]
# The REPL feature pulls in rustyline -> fs2, which does not build for wasm32.
fumola = { path = "../fumola", default-features = false }
fumola_semantics = { path = "../fumola_semantics" }
wasm-bindgen = "0.2"
serde_json = "1.0"
num-traits = "0.2"
num-bigint = "0.4"
fumola_syntax = { path = "../fumola_syntax" }
