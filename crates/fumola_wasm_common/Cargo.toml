[package]
name = "fumola_wasm_common"
version = "0.0.29"
authors = ["Matthew Hammer"]
edition = "2021"
license = "Apache-2.0"
build = "build.rs"
description = "Incremental Fumola instances for a host: the runtime behind fumola_wasm_browser and fumola_canister"

# No wasm-bindgen here, deliberately: fumola_canister links this crate, and a
# canister that imported wasm-bindgen's glue would not install.
[dependencies]
# The REPL feature pulls in rustyline -> fs2, which does not build for wasm32.
fumola = { path = "../fumola", default-features = false }
num-traits = "0.2"
fumola_semantics = { path = "../fumola_semantics" }
fumola_syntax = { path = "../fumola_syntax" }
serde_json = "1.0"
num-bigint = "0.4"
