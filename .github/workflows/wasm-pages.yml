# Build the Fumola wasm runtime and publish it to GitHub Pages.
#
# Pages rather than a release asset, deliberately: release assets are served
# without an Access-Control-Allow-Origin header, so a browser can never fetch
# one cross-origin. The whole point of this artifact is to be loaded by a web
# page (Hazel's Fumola livelit), which makes a release asset a dead end.
# Pages serves it with CORS and the correct application/wasm content type.
name: Publish wasm to Pages

on:
  push:
    branches: ["main"]
  # Lets a branch publish a runtime for its own preview before merging.
  # Only selectable once this workflow is on the default branch, which is why
  # publishing before then needs the branch added to the push trigger above,
  # temporarily.
  workflow_dispatch:
    inputs:
      hazel_branches:
        description: >-
          Hazel branches to host at /hazel/<branch>/, space separated.
          Blank uses the default set below; "none" fetches nothing and keeps
          whatever is already published.
        required: false
        default: ""
      hazel_drop:
        description: >-
          Hazel branches to stop hosting, space separated. A hosted build is
          carried across every deploy, so this is the only way to remove one.
        required: false
        default: ""

concurrency:
  group: wasm-pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Fumola needs nightly: fumola_syntax uses #![feature(negative_impls)],
      # which stable rejects outright.
      - name: Install nightly with the wasm target
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
          rustup target add wasm32-unknown-unknown
          rustc --version

      # Fumola is slow to build -- lalrpop parser generation dominates -- so
      # the cache matters more here than usual.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.toml') }}

      # The CLI must match the wasm-bindgen crate exactly or the bindings it
      # generates will not load. Cargo.lock is not committed here, so the
      # version comes from the resolved dependency graph rather than the lock
      # file -- and an empty answer is treated as an error, since a silently
      # skipped install shows up much later as "wasm-bindgen: command not
      # found".
      - name: Install wasm-bindgen-cli
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' | head -1)
          if [ -z "$version" ]; then
            echo "could not determine the wasm-bindgen version" >&2
            exit 1
          fi
          echo "wasm-bindgen $version"
          if [ "$(wasm-bindgen --version 2>/dev/null | awk '{print $2}')" != "$version" ]; then
            cargo install wasm-bindgen-cli --version "$version" --force
          fi
          wasm-bindgen --version

      # --no-default-features drops the repl feature, whose rustyline
      # dependency pulls in fs2, which does not build for wasm32.
      - name: Build
        run: cargo build --release --target wasm32-unknown-unknown -p fumola_wasm --no-default-features

      - name: Generate bindings
        run: |
          mkdir -p bindings
          wasm-bindgen --target web --out-dir bindings \
            target/wasm32-unknown-unknown/release/fumola_wasm.wasm
          rm -f bindings/*.d.ts
          ls -la bindings

      # Every published version lives on gh-pages and nowhere else, and the
      # publish step below replaces that branch wholesale (force_orphan). So
      # carrying versions forward means fetching them first, before anything
      # is assembled. A first publish has no such branch, which is not an
      # error -- hence continue-on-error rather than a guard.
      - name: Fetch the currently published site
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous

      # The Hazel builds this site hosts at /hazel/<branch>/, copied out of
      # hazelgrove/build -- the repo hazel.org is itself served from -- rather
      # than built here. Building Hazel needs an OCaml toolchain and a
      # js_of_ocaml release link, and what that would produce is the artifact
      # that repo already holds. It is 5.6 GB, so the clone is blobless and
      # sparse: one branch directory is ~11 MB and arrives in about four
      # seconds.
      #
      # Fetched on every deploy, not only on a dispatch that asks. The page
      # links to these builds, so the alternative is a window after each merge
      # to main where the copy is whatever was last dispatched -- and the
      # fetch is cheap enough that keeping it current costs nothing worth
      # counting. A branch that has gone from hazelgrove/build is a warning
      # and not a failure: the carried-forward copy stays published, which is
      # better than a deploy this repo cannot make because another repo moved.
      - name: Fetch the Hazel builds to host
        env:
          # Blank on a push, which is every deploy following a merge to main.
          REQUESTED: ${{ github.event.inputs.hazel_branches }}
          # The set the front page links to. One line, so hosting another
          # branch is a one-line diff and is reviewed like page content.
          DEFAULTS: experimental-lang-integration
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          explicit=true
          branches="${REQUESTED:-}"
          if [ -z "$branches" ]; then
            explicit=false
            branches="$DEFAULTS"
          fi
          if [ "$branches" = "none" ]; then
            echo "fetching no Hazel builds; whatever is published is carried forward"
            echo "HAZEL_HOSTED=" >> "$GITHUB_ENV"
            exit 0
          fi

          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/hazelgrove/build.git hazel-build
          # Each path is one branch's directory, written there by Hazel's own
          # deploy job (hazelgrove/hazel .github/workflows/deploy.yml).
          git -C hazel-build sparse-checkout set $branches

          hosted=""
          for branch in $branches; do
            if [ ! -d "hazel-build/$branch" ]; then
              echo "::warning::hazelgrove/build has no directory for $branch"
              if [ "$explicit" = true ]; then
                echo "$branch was asked for by name, so this is an error" >&2
                exit 1
              fi
              continue
            fi

            # Provenance for the copy. The commit that last touched the path
            # is the deploy that built it, so its date is the age of the demo
            # -- the question a live link actually raises. The Hazel-side
            # commit is not recoverable here: Hazel's deploy job commits as
            # "github-deploy-action-<branch>" and records its own sha nowhere
            # in the build.
            read -r sha when < <(
              gh api "repos/hazelgrove/build/commits?path=$branch&per_page=1" \
                --jq '.[0] | "\(.sha) \(.commit.committer.date)"' 2>/dev/null || echo " "
            )
            # jq interpolates a missing commit as the string "null", which
            # would be recorded as though it were provenance.
            [ "${sha:-null}" != "null" ] || sha=unknown
            [ "${when:-null}" != "null" ] || when=unknown
            cat > "hazel-build/$branch/build.json" <<JSON
          {
            "branch": "$branch",
            "source": "hazelgrove/build",
            "source_commit": "${sha:-unknown}",
            "source_deployed": "${when:-unknown}",
            "copied": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
            echo "$branch: $(du -sh "hazel-build/$branch" | cut -f1), deployed ${when:-unknown}"
            hosted="${hosted:+$hosted }$branch"
          done
          echo "HAZEL_HOSTED=$hosted" >> "$GITHUB_ENV"

      # The assembly is a script rather than steps here because this decides
      # what every browser receives, Hazel's livelits included, and a workflow
      # can only be tested by publishing. tools/assemble-site.test.sh covers
      # it against scratch directories. See #69.
      - name: Assemble the site
        env:
          HAZEL_DROP: ${{ github.event.inputs.hazel_drop }}
        run: |
          set -euo pipefail
          if [ -d previous ]; then
            previous_arg=(--previous previous)
          else
            echo "no published site yet; this is a first publish"
            previous_arg=()
          fi
          # Rebuilt from the branch list rather than passed between steps as a
          # command line: the fetch step decides what was hosted, and this
          # decides how to say so.
          hazel_args=()
          for branch in ${HAZEL_HOSTED:-}; do
            hazel_args+=(--hazel "$branch=hazel-build/$branch")
          done
          for branch in ${HAZEL_DROP:-}; do
            hazel_args+=(--hazel-drop "$branch")
          done
          ./tools/assemble-site.sh \
            --bindings bindings \
            --pages pages \
            --out site \
            --commit "${{ github.sha }}" \
            --keep 10 \
            "${previous_arg[@]}" \
            ${hazel_args[@]+"${hazel_args[@]}"}
          cat site/runtime.json
          if [ -f site/hazel.json ]; then cat site/hazel.json; fi

      # The pages are checked in rather than written here: they explain
      # Fumola and load the runtime published beside them, which is a
      # document to review in a diff, not a heredoc buried in a workflow.
      # assemble-site.sh copies the whole tree, so pages/web-play/index.html
      # is served at /web-play/. A directory rather than web-play.html because
      # Pages does not route extensionless paths with .nojekyll in place.
      # pages/web-repl/ is a redirect to it, kept because links to the old
      # path were shared.

      # `cname` is not decoration: force_orphan replaces gh-pages with the
      # contents of ./site and nothing else, so without this the CNAME file
      # GitHub writes when the custom domain is set would be deleted by the
      # next publish, silently dropping the domain and moving the site back
      # to adapton.github.io/fumola.
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          cname: fumola.org
