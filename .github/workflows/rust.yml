name: Rust + Fumola Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Before the Rust build, because it needs none of it and takes seconds.
      # This is the logic that decides what every browser gets from the
      # published site; the publish workflow itself can only be tested by
      # publishing, so the script it calls is tested here instead. See #69.
      - name: Test the site assembly
        run: ./tools/assemble-site.test.sh

      # Also before the build, and for the same reason. Every panic macro an
      # evaluating program could reach became an Interruption, so that a host
      # embedding the VM has one error path rather than two; a new `todo!()`
      # would read as an ordinary note to self and land unremarked. See
      # docs/panic-audit.md, and #118, #120 and #121.
      - name: Refuse a panic macro reachable from evaluation
        run: ./tools/check-no-panics.sh

      - name: Install latest nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rustfmt, clippy

      - name: Build
        run: cargo build --verbose

      - name: Run Rust unit tests
        run: cargo test --verbose

      - name: Run Fumola unit tests
        run: ./fumola-test.sh

      - name: Run Fumola example scripts
        run: ./fumola-scripts.sh
