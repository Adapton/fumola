name: Rust + Fumola Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Before the Rust build, because it needs none of it and takes seconds.
      # This is the logic that decides what every browser gets from the
      # published site; the publish workflow itself can only be tested by
      # publishing, so the script it calls is tested here instead. See #69.
      - name: Test the site assembly
        run: ./scripts/assemble-site.test.sh

      - name: Install latest nightly
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          override: true
          components: rustfmt, clippy

      - name: Build
        run: cargo build --verbose

      - name: Run Rust unit tests
        run: cargo test --verbose

      - name: Run Fumola unit tests
        run: ./fumola-test.sh

      - name: Run Fumola example scripts
        run: ./fumola-scripts.sh
